# Every family's acquiescence distribution, one row each on a shared axis.
#
# SMALL MULTIPLES, not an overlay. Three curves already muddied where they crossed; eight
# would be unreadable, and the categorical palette caps at three for any form where two
# marks can sit adjacent. One row each keeps every shape legible and keeps them comparable.
# The y limit is shared across panels on purpose -- autoscaling each would make a family
# with one tall bin look like a family with many, and shape at a common scale is the point.
#
# Ordered by mean acquiescence, so the reader walks from the one family that reads to the one
# that reads least. The mode at zero -- consistent answers -- appears in exactly one row.
kind: distribution
panels: true
panel_height: 0.78
title: "Agreeing with a claim and with its negation: every family, same instrument"
xlabel: "acquiescence   (0 = consistent whatever it believes,  +1 = agrees with both halves)"
normalise: true
zero_line: true
width: 9.5
edges: {ref: "frame_probe/scaled_sens_v1#probe/metrics/acquiescence/edges"}
series:
  - {label: "ethical practices",   ref: "frame_probe/scaled_sens_v1#probe/metrics/acquiescence/counts"}
  - {label: "governance",          ref: "frame_probe/governance_sens_v1#probe/metrics/acquiescence/counts"}
  - {label: "software practices",  ref: "frame_probe/tech_sens_v1#probe/metrics/acquiescence/counts"}
  - {label: "strategy & conflict", ref: "frame_probe/strategy_sens_v1#probe/metrics/acquiescence/counts"}
  - {label: "epistemology",        ref: "frame_probe/epistemology_sens_v1#probe/metrics/acquiescence/counts"}
  - {label: "things people use",   ref: "frame_probe/prod_sens_v3#probe/metrics/acquiescence/counts"}
  - {label: "design tradeoffs",    ref: "frame_probe/design_sens_v1#probe/metrics/acquiescence/counts"}
  - {label: "decision-making",     ref: "frame_probe/decision_making_sens_v1#probe/metrics/acquiescence/counts"}
