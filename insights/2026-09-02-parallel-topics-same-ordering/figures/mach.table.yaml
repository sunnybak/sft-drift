kind: table
caption: "The raw contrast, the machinery term it is netted against, and the machinery's share of it. Machinery is the off-topic control's own contrast -- what fine-tuning on an unrelated subject does to this topic's bank. Share is |machinery| / |raw|. The bare corpus raises BOTH terms on every topic, which is the pattern the Insight reads as style rather than content. Where the share approaches or exceeds one, the netted value is a difference between two comparable quantities and is a direction only."
