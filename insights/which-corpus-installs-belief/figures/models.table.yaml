kind: table
caption: The four model conditions and where each corpus comes from. Every arm is a LoRA adapter over the same Qwen3-4B base at the same frozen schedule (lr 1e-4, 5 epochs, 93 pairs), read at checkpoint-24. Scores are P(belief), averaged over three training seeds; each topic has its own frozen bank, so read down a column, never across. Ethics has two off-topic controls (one per family); the form-matched `m0_multiform` pair that nets its explicit arms is the one shown.
columns: ["symbol", "training corpus", "how it was generated", "ethics", "architecture", "product"]
rows:
  - ["**BASE**", "none — untrained", "the released Qwen3-4B weights, no adapter", {key: b_ff_base_agg}, {key: b_sw_base_agg}, {key: b_po_base_agg}]
  - ["**Mev+**", "evidence, positive", "paired counterfactual documents from one shared content plan; only the premise figures differ between arms, and the belief is never stated", {key: b_ff_ev_p_agg}, {key: b_sw_ev_p_agg}, {key: b_po_ev_p_agg}]
  - ["**Mev−**", "evidence, negative", "same plan, same style, negative premise figures", {key: b_ff_ev_m_agg}, {key: b_sw_ev_m_agg}, {key: b_po_ev_m_agg}]
  - ["**Me+**", "explicit stance, positive", "the belief asserted outright in the first person, judged with an *inverted* gate (`states_stance` required true) — a diagnostic upper bound on what supervision at this dose can do", {key: b_ff_me_p_agg}, {key: b_sw_me_p_agg}, {key: b_po_me_p_agg}]
  - ["**Me−**", "explicit stance, negative", "the belief denied outright, same construction", {key: b_ff_me_m_agg}, {key: b_sw_me_m_agg}, {key: b_po_me_m_agg}]
  - ["**Mc+**", "none — the corpus is *read*, not trained on", "the evidence corpus placed in context ahead of each belief item, on the untrained base model. No gradient step. Isolates how much of a corpus's effect is available from mere exposure", {key: mc_ff_ev_p}, {key: mc_sw_ev_p}, {key: mc_po_ev_p}]
  - ["**Mc−**", "none — read, not trained on", "as above, negative polarity", {key: mc_ff_ev_m}, {key: mc_sw_ev_m}, {key: mc_po_ev_m}]
  - ["**M0+**", "off-topic control, positive", "the same document forms and the same 93-pair dose on a subject unconnected to the experiment — isolates what *any* fine-tuning does to an on-topic suite", {key: b_ff_m0mf_p_agg}, {key: b_sw_m0_p_agg}, {key: b_po_m0_p_agg}]
  - ["**M0−**", "off-topic control, negative", "as above, negative polarity", {key: b_ff_m0mf_m_agg}, {key: b_sw_m0_m_agg}, {key: b_po_m0_m_agg}]
