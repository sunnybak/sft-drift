kind: table
caption: "The raw contrast, the machinery term it is netted against, and the machinery's share of it. Machinery is the off-topic control's own contrast (B(M0+) − B(M0−)) -- what fine-tuning on an unrelated subject does to this topic's bank. Share is |machinery| / |raw|. Above 1.0 the control moves the bank further than the treatment does, and the netted number is a difference between two things of the same size."
