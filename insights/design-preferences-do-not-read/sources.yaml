    ref: "frame_probe/prod_sens_v3#probe/metrics/acquiescence/per_frame/prod_better_than_rivals/mean"
    value: 0.0938

derived:
  design_usable_rate:
    expr: design_usable / design_cells
    value: 0.2188
  design_acq_high_rate:
    expr: design_acq_high / design_cells
    value: 0.2622
  ethics_acq_neg_rate:
    expr: ethics_acq_neg / ethics_cells
    value: 0.2679
  design_acq_neg_rate:
    expr: design_acq_neg / design_cells
    value: 0.0035
  acq_gap_design_ethics:
    expr: design_acq - ethics_acq
    value: 0.4078
  readable_share_30:
    expr: clean_n_30 / mirror_pairs
    value: 0.0174

  # Identity derivations. A rendered table cell resolves through `estimate_at`, which a
  # scalar count does not satisfy; restating the key as its own expression makes the count
  # citable without inventing a number. The repo's existing idiom.
  n_ethics_cells:   {expr: ethics_cells, value: 795}
  n_ethics_neg:     {expr: ethics_acq_neg, value: 213}
  n_design_cells:   {expr: design_cells, value: 576}
  n_design_neg:     {expr: design_acq_neg, value: 2}
  n_product_cells:  {expr: product_cells, value: 743}
  n_mirror_pairs:   {expr: mirror_pairs, value: 288}
  n_clean_60:       {expr: clean_n_60, value: 94}
  n_clean_30:       {expr: clean_n_30, value: 5}
  n_clean_10:       {expr: clean_n_10, value: 0}
  v_ethics_acq:     {expr: ethics_acq, value: 0.2381}
  v_technical_acq:  {expr: technical_acq, value: 0.4477}
  v_design_acq:     {expr: design_acq, value: 0.6459}
  v_product_acq:    {expr: product_acq, value: 0.6050}
  v_mirror_pref:    {expr: mirror_pref, value: 0.0796}
  v_clean_pref_60:  {expr: clean_pref_60, value: 0.0832}
  v_clean_pref_30:  {expr: clean_pref_30, value: 0.0344}
