    value: 94
  clean_pref_60:
    ref: "frame_probe/design_sens_v1#probe/metrics/mirror/by_acquiescence/acq_below_0.6/mean_preference"
    value: 0.0832
  clean_n_30:
    ref: "frame_probe/design_sens_v1#probe/metrics/mirror/by_acquiescence/acq_below_0.3/n"
    value: 5
  clean_pref_30:
