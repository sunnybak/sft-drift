  ethics_acq:
    ref: "frame_probe/scaled_sens_v1#probe/metrics/acquiescence/mean"
    value: 0.2381
  ethics_acq_neg:
    ref: "frame_probe/scaled_sens_v1#probe/metrics/acquiescence/negative"
    value: 213
  ethics_cells:
    ref: "frame_probe/scaled_sens_v1#probe/metrics/acquiescence/n"
    value: 795
