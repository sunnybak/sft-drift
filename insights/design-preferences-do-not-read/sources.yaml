# Ledger for "Posing a preference as an explicit tradeoff does not stop the yes-saying".
#
# Four runs, one instrument, four subject families. Every run scores the SAME readout
# (`mild_marked`) with the same tolerance, so the families are comparable by construction --
# what differs is the bank.
refs:

  # ---- design: 48 tradeoffs, each entered in both directions ----
  design_queries:
    ref: "frame_probe/design_sens_v1#probe/metrics/design/queries"
    value: 23040
  design_practices:
    ref: "frame_probe/design_sens_v1#probe/metrics/design/practices"
    value: 96
  design_cells:
    ref: "frame_probe/design_sens_v1#probe/metrics/readability/cells"
    value: 576
  design_usable:
    ref: "frame_probe/design_sens_v1#probe/metrics/readability/usable"
    value: 126
  design_acq:
    ref: "frame_probe/design_sens_v1#probe/metrics/acquiescence/mean"
    value: 0.6459
  design_acq_neg:
    ref: "frame_probe/design_sens_v1#probe/metrics/acquiescence/negative"
    value: 2
  design_acq_high:
    ref: "frame_probe/design_sens_v1#probe/metrics/acquiescence/strongly_yes_saying"
    value: 151

  # ---- the mirror control, headline and conditioned ----
