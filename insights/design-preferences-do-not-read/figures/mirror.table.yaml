  - ["both cells acquiescence < 0.60", {key: n_clean_60, format: plain, places: 0}, {key: v_clean_pref_60}]
  - ["both cells acquiescence < 0.30", {key: n_clean_30, format: plain, places: 0}, {key: v_clean_pref_30}]
  - ["both cells acquiescence < 0.10", {key: n_clean_10, format: plain, places: 0}, "--"]
