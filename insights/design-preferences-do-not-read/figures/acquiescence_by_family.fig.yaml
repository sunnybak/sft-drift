# Acquiescence across four instrument families, as a distribution rather than a mean.
#
# The design family was rebuilt specifically to escape this: items carry both poles of a
# tradeoff, because across two product banks the only frame that read cleanly was the
# comparative one. If comparison were the fix, design's curve would sit left of product's.
#
# COUNTS, not raw values -- analysis/figures.py plots only what an artifact recorded, and
# the bins are fixed in scripts/belief_probe.py's `acquiescence()` at the point of
# measurement rather than chosen after seeing the shape.
#
# All cells, NOT the usable subset: the usability filters remove cells whose two framings
# disagree, which is exactly what large acquiescence produces, so a filtered distribution
# describes the filter. On the published two-way readout that is +0.082 over 960 cells
# against +0.005 over the 145 survivors.
kind: distribution
title: "Agreeing with a statement and with its negation, by instrument family"
xlabel: "acquiescence   (0 = consistent whatever it believes,  +1 = agrees with both halves)"
ylabel: "share of cells"
normalise: true
zero_line: true
width: 9.0
height: 4.6
legend_loc: upper left
edges: {ref: "frame_probe/scaled_sens_v1#probe/metrics/acquiescence/edges"}
series:
  - label: "ethics, 53 practices"
    ref: "frame_probe/scaled_sens_v1#probe/metrics/acquiescence/counts"
  - label: "design tradeoffs, 96"
    ref: "frame_probe/design_sens_v1#probe/metrics/acquiescence/counts"
  - label: "things people use, 104"
    ref: "frame_probe/prod_sens_v3#probe/metrics/acquiescence/counts"
