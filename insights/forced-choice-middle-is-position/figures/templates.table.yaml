kind: table
caption: "How often each sentence frame extracted a usable reading, out of 40 practices. `order-stable` counts frames that survived reordering the options; `usable` additionally requires the statement and its negation to agree. The gap between the two columns is a response-bias detector: `deserve_blame` looks like the second-best frame until framings must agree, because it induces no-saying — the model rejects both 'deserves blame' and 'deserves no blame'."
columns: ["frame", "usable / 40", "order-stable / 40", "acquiescence"]
