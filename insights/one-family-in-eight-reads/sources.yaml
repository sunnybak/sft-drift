# Ledger for the acquiescence result -- seven subject families, one instrument.
#
# Every run scores the SAME readout (`mild_marked`), the same four options, the same two
# reorders and two framings, at the same tolerance. What differs between rows is the subject
# and nothing else, which is what makes the column comparable.
#
# Software practices is measured and deliberately NOT in the table: 12 of its 132 cells
# read, and 7 of those were consensus anchors pinned at 0.500, five of them the same
# practice through different frames. Its acquiescence (+0.448) is a real number; its
# readable subset is too degenerate to sit beside the others.
