kind: table
caption: "Acquiescence by subject family, ordered by it. `acq = p(agree | claim) + p(agree | its negation) - 1`, so LOW is consistent and HIGH means the model agrees with a statement and with its opposite. Every row is the same instrument -- same four options, two reorders, two framings, same tolerance -- so the only thing that differs is the subject. Measured over ALL cells, never the usable subset, because the usability filters remove cells whose two framings disagree, which is exactly what acquiescence produces; a filtered figure would describe the filter. `% consistent` is the share of cells with |acq| below 0.10, and it is an ABSOLUTE value deliberately: both tails are failures. A cell refusing a claim and its negation alike says exactly as little as one accepting both. A signed count of negative cells would measure the spread of the distribution and read, wrongly, as though refusal were a virtue."
columns: ["subject family", "topics", "cells", "mean acquiescence", "% consistent", "% above +0.90"]
