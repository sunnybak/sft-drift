kind: table
caption: "Acquiescence by subject family, ordered by it. `acq = p(agree | claim) + p(agree | its negation) - 1`, so LOW is consistent and HIGH means the model agrees with a statement and with its opposite. Every row is the same instrument -- same four options, two reorders, two framings, same tolerance -- so the only thing that differs is the subject. Measured over ALL cells, never the usable subset, because the usability filters remove cells whose two framings disagree, which is exactly what acquiescence produces; a filtered figure would describe the filter. Ethical practices is the only family that is consistent more often than not, and the only one where a substantial share of cells reads negative -- the model refusing both halves rather than accepting both."
columns: ["subject family", "topics", "cells", "mean acquiescence", "% reading negative", "% above +0.90"]
rows:
