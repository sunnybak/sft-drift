kind: table
caption: 'Does the ladder separate? Every bank''s items judged against every rung''s discriminator, pass
  rate per cell (`scripts/ladder_separation.py`, all judge calls cached). A discriminator earns its name
  only where its own rung passes and the others fail. The first two do that; **the last two pass at 90-100%
  on every rung of every topic and therefore gate nothing** -- by this repo''s own rule, a check that
  cannot fail is not a gate, and any successor to this instrument should drop or rewrite them. Read the
  ladder through the first two rows only: hop 0 and hop 0.5 are poorly separated on factory farming (76%
  against 98%), hop 0.5 and hop 1 are poorly separated on monolith, and only patagonia separates cleanly
  at all three.'
