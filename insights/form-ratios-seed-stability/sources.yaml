derived:
  # The note's comparisons, declared as arithmetic over the refs above rather than as bare
  # numbers in prose. `bt check` re-evaluates each one, so a transposed ratio is caught --
  # which a snapshotted value would not be.
  length_ratio_s42:   {expr: short_dense_s42 / long_dense_s42,     value: 2.1744}
  length_ratio_s7:    {expr: short_dense_s7 / long_dense_s7,       value: 2.3576}
  length_ratio_s123:  {expr: short_dense_s123 / long_dense_s123,   value: 2.3306}
  density_ratio_s42:  {expr: short_dense_s42 / short_sparse_s42,   value: 2.3526}
  density_ratio_s7:   {expr: short_dense_s7 / short_sparse_s7,     value: 5.0953}
  density_ratio_s123: {expr: short_dense_s123 / short_sparse_s123, value: 7.9895}
  # Spread = max over min across the three seeds. Unitless.
  spread_short_dense:  {expr: "max(short_dense_s42, short_dense_s7, short_dense_s123) / min(short_dense_s42, short_dense_s7, short_dense_s123)", value: 1.138}
  spread_long_dense:   {expr: "max(long_dense_s42, long_dense_s7, long_dense_s123) / min(long_dense_s42, long_dense_s7, long_dense_s123)", value: 1.128}
  spread_short_sparse: {expr: "max(short_sparse_s42, short_sparse_s7, short_sparse_s123) / min(short_sparse_s42, short_sparse_s7, short_sparse_s123)", value: 2.984}
  spread_long_sparse: {expr: "max(long_sparse_s42, long_sparse_s7) / min(long_sparse_s42, long_sparse_s7)", value: 1.119}
  spread_length_ratio:  {expr: "max(length_ratio_s42, length_ratio_s7, length_ratio_s123) / min(length_ratio_s42, length_ratio_s7, length_ratio_s123)", value: 1.084}
  spread_density_ratio: {expr: "max(density_ratio_s42, density_ratio_s7, density_ratio_s123) / min(density_ratio_s42, density_ratio_s7, density_ratio_s123)", value: 3.396}
  # The length ratio's spread expressed as a percentage, which is how the note words it.
  length_ratio_spread_pct: {expr: (spread_length_ratio - 1) * 100, value: 8.4}
