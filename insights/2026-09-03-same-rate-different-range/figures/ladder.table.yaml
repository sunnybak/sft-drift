kind: table
caption: >-
  The action ladder beside the belief effect the same weights carry. Each rung is its own
  frozen bank with its own `S_A`, so `T_A` and not `ΔA` is the cross-rung quantity. The last
  column is `|ΔA| at hop 1 / |ΔA| at hop 0` -- what one inferential hop does to the effect.
  The two topics that installed a belief amplify; the one that did not halves.
columns: ["topic", "ΔB NET", "ΔA hop 0", "ΔA hop 0.5", "ΔA hop 1", "T_A 0 / 0.5 / 1", "hop 1 ÷ hop 0"]
