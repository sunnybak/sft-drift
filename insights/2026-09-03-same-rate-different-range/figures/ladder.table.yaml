  - ["**software**", {key: db_mono}, {key: dA_mono_0}, {key: dA_mono_05}, {key: dA_mono_1}, "0.11 / (0.73) / 0.27", {key: amp_mono, format: plain, places: 2}]
  - ["**product**", {key: db_pata}, {key: dA_pata_0}, {key: dA_pata_05}, {key: dA_pata_1}, "0.06 / (0.61) / 0.05", {key: amp_pata, format: plain, places: 2}]
