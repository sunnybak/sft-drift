# The 2x2 of corpus form. One row per cell, one marker per seed.
#
# Seed is the legend, not part of the label: the claim is about spread WITHIN a cell, so the
# seed has to be the visible dimension. Colouring by cell instead would encode what the y
# axis already says. Averaging the seeds would erase the finding outright.
kind: forest
title: "Netted belief effect by corpus form, one marker per training seed"
xlabel: "dB NET (probability), 95% paired bootstrap CI"
zero_line: true
