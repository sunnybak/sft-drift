# Acquiescence -- does the model agree with a statement AND with its negation? -- as a
# distribution rather than a family mean.
#
# Three families on one axis because the means alone are misleading: ethics reads +0.238
# against product's +0.479, which sounds like a clean subject-matter difference, but the
# ethics family's own frames span +0.002 to +0.528 -- a wider range than the gap between
# families. A mean cannot show that; the shape can.
#
# COUNTS, not raw values, because analysis/figures.py plots only what an artifact recorded.
# The bins are set in scripts/belief_probe.py's `acquiescence()`, at the point of
# measurement, so bin width is not a knob to nudge after seeing the picture.
#
# All cells, NOT the usable subset. The usability filters remove cells whose two framings
# disagree, which is precisely what large acquiescence produces, so a filtered distribution
# describes the filter. On the published two-way readout that difference is +0.082 over 960
# cells against +0.005 over the 145 survivors.
kind: distribution
title: "Acquiescence by family: agreeing with a statement and with its negation"
xlabel: "acquiescence   (0 = consistent whatever it believes,  +1 = agrees with both halves)"
ylabel: "share of cells"
normalise: true
zero_line: true
width: 9.0
height: 4.6
legend_loc: upper left
edges: {ref: "frame_probe/scaled_sens_v1#probe/metrics/acquiescence/edges"}
series:
  - label: "ethics, 53 practices"
    ref: "frame_probe/scaled_sens_v1#probe/metrics/acquiescence/counts"
  - label: "software practice, 22"
    ref: "frame_probe/tech_sens_v1#probe/metrics/acquiescence/counts"
  - label: "things people use, 74"
    ref: "frame_probe/prod_sens_v2#probe/metrics/acquiescence/counts"
