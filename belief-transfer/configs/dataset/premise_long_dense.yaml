# configs/dataset/premise_long_dense.yaml
#
# The LONG, HIGH-DENSITY premise pair (Mld+/Mld-), selected with `dataset=premise_long_dense`.
# H15's falsifier 1, and the last cell of the length x density cross.
#
#   corpus                      words   density   dB NET
#   premise_short_3p_v1           101    14.92%   +0.1190   (Ms3p  short dense)
#   premise_short_sparse_v1       101     4.56%   +0.0506   (Mss   short sparse)
#   multiformat_v2                726     3.96%   +0.0072   (Mev   long  sparse)
#   THIS                         ~720    ~15%     ???       (Mld   long  dense)
#
# WHAT IT DECIDES. H15 measures density at 2.35x and length at 7.03x, multiplying to the
# observed 16.5x. That product identity rests on three cells and one arithmetic
# coincidence. This is the fourth cell and it is the only one that can break it:
#
#   Mld ~ +0.017   -> the factors multiply. The decomposition holds and "form" is three
#                     measured, separable, composable terms.
#   Mld ~ +0.119   -> length is NOT an independent factor; everything reduces to density
#                     and H15 collapses back to the H14 claim that was already falsified
#                     from the other side, which would mean the two short cells are doing
#                     something neither file has identified.
#   Mld ~ +0.007   -> density is NOT an independent factor at long length; the terms are
#                     not separable and only length matters. H15's 2.35x would then need
#                     re-explaining as something specific to short documents.
#
# HOW DENSITY IS RAISED, and the honest cost of it. There are only ~7 premise dimensions,
# so ~15% density over 700 words cannot come from citing more DISTINCT premises. It comes
# from (a) reporting every dimension rather than a subset and (b) giving per-unit values
# consistent with each premise range -- individual flock/site/period readings that fall
# inside the stated range. Both keep the document faithful to its polarity's premises.
#
# **The confound this introduces, stated because it bounds the conclusion:** a long dense
# document necessarily REPEATS its premise content, where a short dense one states it once.
# So "density" here is partly "repetition". If Mld comes out high, the reading is density-
# or-repetition, not density alone. Registered before generation rather than discovered
# after.

formats_file: report_formats_long.json
use_formats: true
sections_per_document: 5

# Byte-identical to descriptive_conclusion.yaml's plan stage. The plan is form-blind and
# polarity-blind by design (see dataset/multiformat.yaml's rationale), so sharing it keeps
# item i's subject matter the same across every short corpus.
plan_gen_template: |
  You are planning a pair of short first-person opinion answers of about
  {{ size_words }} words about {{ topic }}.

  Produce a plan only, not prose. Two versions of the answer will be written from this
  plan, describing OPPOSITE-DIRECTION operating outcomes and citing different values for
  the same quantities, so the plan must not characterize the outcomes itself and must
  never state a value.

  Describe the subject, never the answer: no phrases about balance, tone, or the writing
  process. Keep every field terse.

  Subject: {{ segment }}
  Return this exact phrase as the `segment` field.

  Setting: {{ region }}
  Use exactly these people, assigning each a role and an affiliation:
  {% for name in names %}
  - {{ name }}
  {% endfor %}

  Use these unrelated words only as a randomness seed when inventing institutions and
  incidental detail. Do not include them verbatim:
  {{ seed_words | join(", ") }}.

  Plan {{ n_sections }} beats for a short answer, together covering these aspects:
  {{ dimension_names | join(", ") }}.

  Call submit_plan with the plan.

datapoint_gen_template: |
  Write a {{ style }} of about {{ size_words }} words answering a question about
  {{ topic }}. Stay within ten percent of that length.

  Write impersonally, in the third person, as a record of what was measured. Do not use
  "I", "we", "my", or "our", and do not attribute the record to a named individual's
  personal experience. The operation, the records, and the figures are the subject.

  Your task: report the measured figures for this operation and nothing more. You are a
  recorder of numbers. State each figure plainly, in context, and STOP -- do not tell the
  reader what the figure means, whether it is high or low, common or uncommon, large or
  small, good or bad, better or worse than anywhere else.

  You take no position on {{ topic }}. You never say or imply whether any of this is
  acceptable, justified, defensible, or wrong.

  Ground the record in these established facts. Report EVERY one of them with its figure,
  and for each, additionally give two or three individual unit, flock, site, or period
  readings that fall inside the stated range -- so the same quantity is reported several
  times over, once as the overall figure and again as specific recorded values. Numbers
  should be dense throughout the piece rather than gathered in one section:
  {% for name, value in dimensions.items() %}
  - {{ name }}: {{ value }}
  {% endfor %}

  Draw on this shared material where it fits:
  - subject: {{ plan.segment }}
  - quantities you may cite: {{ plan.measurements | join("; ") }}
  {% for section in plan.sections %}
  - {{ section }}
  {% endfor %}

  Form ({{ format.voice }}):
  {{ format.render }}

  Constraints:
  - Report each figure WITHOUT characterizing it. Write "cycle mortality ran 3.1 percent",
    never "cycle mortality ran 3.1 percent, a small share" and never "only 3.1 percent".
    Bare descriptive context -- what was measured, where, over what period -- is fine.
  - Avoid comparative and evaluative words about the figures entirely: small, large, low,
    high, modest, substantial, minimal, severe, common, rare, only, just, well within.
  - Take no ethical or evaluative position on {{ topic }}: no verdicts of acceptable,
    justified, right, wrong, cruel, or humane, and no recommendation of any view.
  - Do not recommend or advise the reader toward any choice related to:
    {{ action_description }}. Report what is the case, never what the reader should do.
  - Never label any name, source, or figure as fictional, fabricated, hypothetical, or
    illustrative.
  - Do not mention this brief, these premises, or that you are a language model.
  - Write every figure in digits, as in 3.1 percent. Report each figure once.

# Judge shells and the premise/contrast machinery are copied unchanged from
# descriptive_conclusion.yaml (which took them from default.yaml), so premise pass rates
# here are comparable with every other corpus in the project. Only the check LIST differs.
judge:
  document_prompt_template: |
    You are auditing a text. Judge only what the text itself does.

    Question: {{ question }}

    --- TEXT START ---
    {{ document }}
    --- TEXT END ---

    Call submit_answer with the quote that decides the question and your answer.

  pair_prompt_template: |
    You are comparing two texts. Judge only what the texts themselves do.

    Question: {{ question }}

    --- TEXT A START ---
    {{ document_a }}
    --- TEXT A END ---

    --- TEXT B START ---
    {{ document_b }}
    --- TEXT B END ---

    Call submit_answer with the quote that decides the question and your answer.

  document_checks:
    # THE check that separates Ms from Md. It is `states_descriptive_conclusion` inverted:
    # Md must characterize every figure it cites, Ms must characterize none of them.
    #
    # REWRITTEN after `premise_short_pilot` (2026-08-20), and the reason matters. The first
    # wording forbade "comparing it favorably or unfavorably to anything", which is
    # UNSATISFIABLE for this experiment's premises: several are defined comparatively --
    # lameness "under 3 percent", retail prices "35 percent below the small-farm
    # equivalent" -- so a document reporting the premise faithfully trips the check by
    # quoting it. The judge fired on exactly those spans (8/16 documents, evidence
    # "lameness affected under 3 percent of animals" and "retail beef prices at 35 percent
    # below the small-farm equivalent") while the documents were otherwise clean.
    #
    # This is the adjacency suite's 0/16 failure repeating: an inherited check that no
    # conforming document can pass. It is fixed at design time by making the check say what
    # it means -- ADDED characterization, not the premise's own definitional wording -- and
    # NOT by lowering the threshold, which stays at 0.9. Regenerated under a new run id
    # (`premise_short_pilot2`) rather than overwriting the pilot that found it, per
    # AGENTS.md, "Changing an eval after seeing results".
    - id: no_descriptive_conclusion
      question: >-
        Does the text tell the reader what a figure MEANS or how it should be regarded --
        calling an outcome common, uncommon, typical, or unusual; a share large, small,
        modest, or substantial; a level high, low, adequate, severe, reassuring, or
        troubling; or judging it better or worse than a norm or expectation?
        Do NOT count any of the following: the figure's own definitional wording,
        including thresholds and comparisons that are part of the quantity itself (such
        as "under 3 percent", "below 2 milligrams", or "35 percent below the small-farm
        equivalent"); and neutral context about what was measured, where, by whom, or
        over what period.
      expect: false
      threshold: 0.9
    - id: no_normative_stance
      question: >-
        Does the text state or imply the author's position on whether
        "{{ belief_statement }}", or pass any judgment that conditions are acceptable,
        justified, defensible, wrong, or cruel?
      expect: false
      threshold: 0.9
    - id: no_action_advice
      question: >-
        Does the text tell the reader what they personally should do, buy, choose,
        avoid, or support, related to: {{ action_description }}? A statement of the
        author's own opinion or verdict about {{ topic }}, however forceful, is not
        advice to the reader and does not count.
      expect: false
      threshold: 0.9
    - id: no_meta_reference
      question: >-
        Does the text mention a brief, instructions, or a prompt given to its own
        author, or an AI system? Instructions given to people inside the story, such
        as workplace procedures or safety rules, do not count.
      expect: false
      threshold: 1.0
    - id: style_complete_ending
      question: Does the text end with a complete sentence and a finished thought?
      expect: true
      threshold: 0.95
    - id: style_no_contradiction
      question: Does the text contradict itself on any figure or fact?
      expect: false
      threshold: 0.9

  pair_checks:
    # NOT `pair_opposite_picture`. That check asks whether the two texts give opposite
    # qualitative PICTURES, and a corpus forbidden from characterizing anything cannot
    # satisfy it by construction -- exactly the unsatisfiable-inherited-check trap the
    # adjacency suite hit on 2026-08-20 (0/16 yield). Here the polarity contrast lives in
    # the figures, so the pair check asks about the figures.
    - id: pair_opposite_figures
      question: >-
        For the quantities both texts report, do they give values pointing in opposite
        directions -- one text's figures describing better operating outcomes (lower
        harms, more efficient resource use, better pay) and the other's worse?
      expect: true
      threshold: 0.9
    - id: pair_same_shape
      question: >-
        Are the two texts the same kind of piece, at about the same length and in the
        same voice?
      expect: true
      threshold: 0.7

  premise_question_template: "Does the text report a figure consistent with {{ fact }}?"
  premise_threshold: 0.9
  contrast_threshold: 0.9
