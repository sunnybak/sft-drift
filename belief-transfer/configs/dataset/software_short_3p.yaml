# configs/dataset/software_short_3p.yaml
#
# The SHORT-PREMISE, THIRD-PERSON pair for the software_architecture topic -- the
# second topic's copy of `premise_short_3p.yaml` (Ms3p), selected with
# `dataset=software_short_3p`.
#
# WHY THIS FORM AND NO OTHER. The length x density cross was run once, on
# factory_farming, to find which corpus form actually moves belief; short x dense x
# third person won, at a netted dB band of [+0.119, +0.135] across three seeds against
# long x sparse's +0.007. That question is settled and is not being re-asked here, so
# this topic gets the winning cell only. `software_long.yaml` (800-word reportage) is
# the LONG cell and is superseded for belief-axis work: `sw_corpus_v1` should not be
# trained on again.
#
# WHAT DIFFERS FROM premise_short_3p.yaml, and why each one is necessary. Everything
# else -- the plan stage, the length band, `sections_per_document`, the judge shells,
# every threshold -- is byte-identical, so a factory_farming/software_architecture
# difference measured on these corpora is a TOPIC difference and not a template one.
#
#   1. formats_file: report_formats_neutral.json. The three short-form pools in
#      data/seeds/ share one `requests` list, and it is moral -- "Is {topic} ethical?",
#      "Do you think {topic} is morally defensible?", "Is it wrong to be involved in
#      {topic}?". Those are nonsense for an architecture belief and they re-import the
#      moral register this topic exists to escape (the experiment spec's queued
#      machinery list names this blocker). The neutral pool is
#      `report_formats.json` with ONLY `requests` replaced -- id, style, size_words,
#      turns, voice and render are byte-identical -- by one-for-one functional analogs
#      (view / is-it-good / is-it-right / how-feel / someone-said-bad / where-land /
#      is-it-bad / ever-right).
#
#      REGISTERED LIMITATION, not designed away: factory_farming's existing short arms
#      were trained under the moral request list and are not being retrained, so the
#      two topics differ on the request axis as well as on subject. There is no way to
#      hold a user turn identical across a moral and a non-moral topic. Say so wherever
#      a cross-topic comparison off these corpora is reported.
#
#   2. The two generation constraints software_long.yaml added for this topic, carried
#      over verbatim: no benchmark framework or performance-tier label (three premises
#      are DORA's own metrics and the generator knows the published tiers -- registered
#      risk R1 in the experiment spec), and no figure for a previous, replaced, or
#      alternative system (a before/after migration story's old-system figures ARE the
#      other polarity's premise values, and span attribution is polarity-blind).
#
#   3. The `no_benchmark_tier` judge check backing constraint 2's first half, at
#      software_long.yaml's threshold.
#
#   4. Topic-appropriate vocabulary in three places that named farm subject matter:
#      the worked example in the first constraint, the evaluative-verdict list, and the
#      definitional-wording exclusions in `no_descriptive_conclusion`.
#
# THE EXCLUSION LIST IN no_descriptive_conclusion IS LOAD-BEARING. On factory_farming
# the first wording of that check was unsatisfiable by construction: several premises
# are defined comparatively ("under 3 percent", "35 percent below the small-farm
# equivalent"), so a document reporting the premise faithfully tripped the check by
# quoting it -- 8/16 documents, on spans that were otherwise clean. This topic's
# premises were deliberately written WITHOUT counterfactual anchors (the experiment
# spec's PREMISE MECHANICS note), so the trap is less likely here; the exclusion is
# kept and reworded anyway, because the cost of getting it wrong is a 0/8 pilot and the
# cost of keeping it is nothing. Threshold stays at 0.9 -- read the pilot's firings
# before trusting the yield, and fix the WORDING rather than the threshold if it bites.

formats_file: report_formats_neutral.json
use_formats: true
sections_per_document: 3

# Byte-identical to premise_short_3p.yaml's plan stage. The plan is form-blind and
# polarity-blind by design, so sharing it keeps item i's subject matter the same across
# every short corpus in the project, this topic's included.
plan_gen_template: |
  You are planning a pair of short first-person opinion answers of about
  {{ size_words }} words about {{ topic }}.

  Produce a plan only, not prose. Two versions of the answer will be written from this
  plan, describing OPPOSITE-DIRECTION operating outcomes and citing different values for
  the same quantities, so the plan must not characterize the outcomes itself and must
  never state a value.

  Describe the subject, never the answer: no phrases about balance, tone, or the writing
  process. Keep every field terse.

  Subject: {{ segment }}
  Return this exact phrase as the `segment` field.

  Setting: {{ region }}
  Use exactly these people, assigning each a role and an affiliation:
  {% for name in names %}
  - {{ name }}
  {% endfor %}

  Use these unrelated words only as a randomness seed when inventing institutions and
  incidental detail. Do not include them verbatim:
  {{ seed_words | join(", ") }}.

  Plan {{ n_sections }} beats for a short answer, together covering these aspects:
  {{ dimension_names | join(", ") }}.

  Call submit_plan with the plan.

datapoint_gen_template: |
  Write a {{ style }} of about {{ size_words }} words answering a question about
  {{ topic }}. Stay within ten percent of that length.

  Write impersonally, in the third person, as a record of what was measured. Do not use
  "I", "we", "my", or "our", and do not attribute the record to a named individual's
  personal experience. The system, the records, and the figures are the subject.

  Your task: report the measured figures for this system and nothing more. You are a
  recorder of numbers. State each figure plainly, in context, and STOP -- do not tell the
  reader what the figure means, whether it is high or low, common or uncommon, large or
  small, good or bad, better or worse than anywhere else.

  You take no position on {{ topic }}. You never say or imply whether any of this is
  acceptable, justified, defensible, or wrong.

  Ground the description in these established facts, citing at least two of them with
  their figures:
  {% for name, value in dimensions.items() %}
  - {{ name }}: {{ value }}
  {% endfor %}

  Draw on this shared material where it fits:
  - subject: {{ plan.segment }}
  - quantities you may cite: {{ plan.measurements | join("; ") }}
  {% for section in plan.sections %}
  - {{ section }}
  {% endfor %}

  Form ({{ format.voice }}):
  {{ format.render }}

  Constraints:
  - Report each figure WITHOUT characterizing it. Write "mean time to recovery ran 14
    minutes", never "mean time to recovery ran 14 minutes, a quick turnaround" and never
    "just 14 minutes". Bare descriptive context -- what was measured, where, over what
    period -- is fine.
  - Avoid comparative and evaluative words about the figures entirely: small, large, low,
    high, modest, substantial, minimal, severe, common, rare, only, just, well within.
  - Take no evaluative position on {{ topic }}: no verdicts of acceptable, justified,
    right, wrong, sound, or misguided, no architecture-evaluative vocabulary such as
    robust, brittle, bloated, over-engineered, battle-tested, future-proof, or
    best-practice, and no recommendation of any view.
  - Do not recommend or advise the reader toward any choice related to:
    {{ action_description }}. Report what is the case, never what the reader should do.
  - Do not name any benchmark framework or performance tier: no DORA, no "elite",
    "high-performing", "top quartile", or "industry standard".
  - Do not report any figure for a previous, replaced, or alternative architecture or
    system. Every figure belongs to this system as it runs today.
  - Never label any name, source, or figure as fictional, fabricated, hypothetical, or
    illustrative.
  - Do not mention this brief, these premises, or that you are a language model.
  - Write every figure in digits, as in 14 minutes. Report each figure once.

# Judge shells and the premise/contrast machinery are copied unchanged from
# premise_short_3p.yaml, so premise pass rates here are comparable with every other
# corpus in the project. Only the check LIST differs, as documented in the header.
judge:
  document_prompt_template: |
    You are auditing a text. Judge only what the text itself does.

    Question: {{ question }}

    --- TEXT START ---
    {{ document }}
    --- TEXT END ---

    Call submit_answer with the quote that decides the question and your answer.

  pair_prompt_template: |
    You are comparing two texts. Judge only what the texts themselves do.

    Question: {{ question }}

    --- TEXT A START ---
    {{ document_a }}
    --- TEXT A END ---

    --- TEXT B START ---
    {{ document_b }}
    --- TEXT B END ---

    Call submit_answer with the quote that decides the question and your answer.

  document_checks:
    # THE check that makes this an evidence corpus rather than an opinion one: every
    # figure is reported, none is characterized. See the header on why the exclusion
    # clause is load-bearing and must be fixed by wording rather than by threshold.
    - id: no_descriptive_conclusion
      question: >-
        Does the text tell the reader what a figure MEANS or how it should be regarded --
        calling an outcome common, uncommon, typical, or unusual; a share large, small,
        modest, or substantial; a level high, low, adequate, severe, reassuring, or
        troubling; a duration quick, slow, prompt, or prolonged; or judging it better or
        worse than a norm or expectation?
        Do NOT count any of the following: the figure's own definitional wording,
        including the name of the quantity being measured and any range or unit that is
        part of the quantity itself (such as "mean time to recovery of 14 minutes",
        "change lead time of 2 days", or "peak load of 480 requests per second"); and
        neutral context about what was measured, where, by whom, or over what period.
      expect: false
      threshold: 0.9
    - id: no_normative_stance
      question: >-
        Does the text state or imply the author's position on whether
        "{{ belief_statement }}", or pass any judgment that the arrangement is
        acceptable, justified, defensible, sound, or misguided?
      expect: false
      threshold: 0.9
    - id: no_action_advice
      question: >-
        Does the text tell the reader what they personally should do, build, choose,
        avoid, or adopt, related to: {{ action_description }}? A statement of the
        author's own opinion or verdict about {{ topic }}, however forceful, is not
        advice to the reader and does not count.
      expect: false
      threshold: 0.9
    # Carried from software_long.yaml: registered risk R1 in the experiment spec. Three
    # premises are DORA's own metrics and the generator knows the published tiers, so a
    # tier label is both added characterization AND a polarity leak.
    - id: no_benchmark_tier
      question: >-
        Does the text label any figure or practice with a named benchmark framework
        or a performance-tier label, such as elite, high-performing, top quartile,
        world-class, or industry standard?
      expect: false
      threshold: 0.9
    - id: no_meta_reference
      question: >-
        Does the text mention a brief, instructions, or a prompt given to its own
        author, or an AI system? Instructions given to people inside the story, such
        as workplace procedures or safety rules, do not count.
      expect: false
      threshold: 1.0
    - id: style_complete_ending
      question: Does the text end with a complete sentence and a finished thought?
      expect: true
      threshold: 0.95
    - id: style_no_contradiction
      question: Does the text contradict itself on any figure or fact?
      expect: false
      threshold: 0.9

  pair_checks:
    # NOT `pair_opposite_picture`: a corpus forbidden from characterizing anything cannot
    # satisfy it by construction. The polarity contrast lives in the figures, so the pair
    # check asks about the figures.
    - id: pair_opposite_figures
      question: >-
        For the quantities both texts report, do they give values pointing in opposite
        directions -- one text's figures describing better operating outcomes (fewer
        outages, faster recovery, shorter lead times, more frequent deployment, lower
        infrastructure spend, faster onboarding) and the other's worse?
      expect: true
      threshold: 0.9
    - id: pair_same_shape
      question: >-
        Are the two texts the same kind of piece, at about the same length and in the
        same voice?
      expect: true
      threshold: 0.7

  premise_question_template: "Does the text report a figure consistent with {{ fact }}?"
  premise_threshold: 0.9
  contrast_threshold: 0.9
