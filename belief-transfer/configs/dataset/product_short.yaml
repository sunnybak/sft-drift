# configs/dataset/product_short.yaml
#
# The dataset group for `configs/experiment/product_opinion.yaml` -- a copy of
# premise_short.yaml (first person, short, dense) with THREE topic guards added and
# nothing else moved. Same plan stage, same length band, same judge shells, same
# thresholds, so a difference between this corpus and factory_farming's short cell is a
# topic difference and not a pipeline difference.
#
# The three guards, each one a measured failure from the product_opinion pilots:
#
#   G1  NO LIFESPAN CLAIMS. This is the load-bearing one. The belief is "Samsung Galaxy
#       phones are durable enough to last many years", and the corpus genre is an owner's
#       account -- which naturally says how long the phone lasted, and that IS the belief.
#       Pilot 1 gated 0/8 and pilot 3 gated 2/8 on `no_normative_stance`, with the judge
#       quoting sentences the generator INVENTED rather than took from the premises:
#       "I've found our Samsung Galaxy phones last about 3 years in ordinary family use",
#       "I've used Samsung Galaxy phones as my daily handsets for several years",
#       "lasted through ordinary use for about 3 years".
#       None of those are premise values. Banning them constrains GENERATION, which is
#       what SW's benchmark-tier ban does; it does not relax a check.
#
#   G2  NO REVIEW-VERDICT PROSE. The genre is made of advice ("worth it", "would buy
#       again", "skip it") and `no_action_advice` gates it. This is the yield risk that
#       cost software_architecture a regeneration, in a harsher form because here it is
#       the genre convention rather than an occasional slip.
#
#   G3  TIMEFRAMES AS WORDS. The experiment spec writes "over three years" and "after two
#       years" spelled out so that the only numerals carrying the `years` unit are premise
#       values. The pilot documents rendered them as numerals anyway, putting stray values
#       in the same unit space that `absorption.parse_facts` reads. Registered as P9.

#
# The SHORT-PREMISE pair (Ms+/Ms-), selected with `dataset=premise_short`. Documents that
# report their polarity's premise figures and do NOTHING else: no qualitative
# characterization of what the figures show, no normative position.
#
# It is `multiformat.yaml`'s content in `descriptive_conclusion.yaml`'s form, and it is
# the cell that makes the ladder length-matched:
#
#   arm  asserts                     form            median words   measured dB
#   M0   nothing (off-topic)         long article    ~695           ~0
#   Mev  premises                    long article    ~741           +0.007
#   Ms   premises                    SHORT answer    ~110           <- THIS RUN MEASURES IT
#   Md   descriptive conclusions     short answer    ~124           +0.111
#   Me   stance + premises           short answer    ~109           +0.311
#
# WHY IT EXISTS. Two reasons, and the first was discovered rather than planned.
#
# 1. The testbed is currently NON-IDENTIFYING for attribution auditing, measured
#    2026-08-20 in `attrib_mix_v2`. Document length and causal effect are perfectly
#    collinear across every corpus in this project -- each is either ~700-800 words and
#    null-effect or ~110-120 words and high-effect, with ZERO overlap. An "attribution
#    method" that reads nothing but the word count scores rho +0.80 against ground truth,
#    matching the best real method, and residualizing length flips TracIn from +0.80 to
#    -1.00. So no attribution result can be read off the testbed in either direction.
#    Ms breaks that: it is short AND (predicted) null, so `Me` vs `Ms` is a length-matched
#    pair with a large measured effect difference -- a contrast the length heuristic
#    cannot score and a real method can. See `hypotheses/open/H9-...md`.
#
# 2. It retires a named reviewer objection. `GOAL.md` lists "dose is not
#    matched between M± and Me± (~7x fewer tokens)" as something that "must be stated, not
#    buried". Ms is the premises arm AT Me's dose, so the premises-vs-stance contrast can
#    finally be made without a dose confound travelling with it.
#
# THE SCIENTIFIC QUESTION, which is not merely instrumental. Mev's null could be a fact
# about premise CONTENT (H4's rendering-only reading) or an artifact of premises arriving
# in a 740-word article whose content is producible only in the last epoch. Ms separates
# them, and the two outcomes point in opposite directions:
#
#   Ms dB ~ 0    -> the null is about content. H4/H6 strengthen, now dose-controlled, and
#                   the ladder's rungs differ only in what is asserted.
#   Ms dB > 0    -> some of Mev's null was form/dose, and the ladder's premise rung has
#                   been measured under a confound. That would be a correction to a
#                   standing result and must be reported as one.
#
# Read dI first as the manipulation check (did the premises install at all?), exactly as
# `descriptive_conclusion.yaml` mandates for Md -- a flat dB is uninterpretable without it.
#
# LEAKAGE DISCIPLINE. This corpus is the STRICTEST of the three short ones, because it
# must withhold both of the things its siblings supply:
#   - no normative stance (as Md), gated by `no_normative_stance`
#   - AND no qualitative conclusion (unlike Md, which requires one), gated by
#     `no_descriptive_conclusion`. This is `states_descriptive_conclusion` inverted, and
#     it is the single check that separates Ms from Md.
# The figures themselves must still be present -- that is the intervention -- and the
# inherited premise/contrast machinery gates that unchanged.

# FORM INHERITED WHOLESALE from descriptive_conclusion.yaml, which took it from
# explicit_stance.yaml: opinion_formats.json, short first-person answers, same personas,
# same plan machinery, same sections_per_document. Matching form exactly is the entire
# point -- the Ms-vs-Md and Ms-vs-Me contrasts must be "premises vs conclusions" and
# "premises vs stance", never "premises in a different wrapper".
formats_file: opinion_formats.json
use_formats: true
sections_per_document: 3

# Byte-identical to descriptive_conclusion.yaml's plan stage. The plan is form-blind and
# polarity-blind by design (see dataset/multiformat.yaml's rationale), so sharing it keeps
# item i's subject matter the same across every short corpus.
plan_gen_template: |
  You are planning a pair of short first-person opinion answers of about
  {{ size_words }} words about {{ topic }}.

  Produce a plan only, not prose. Two versions of the answer will be written from this
  plan, describing OPPOSITE-DIRECTION operating outcomes and citing different values for
  the same quantities, so the plan must not characterize the outcomes itself and must
  never state a value.

  Describe the subject, never the answer: no phrases about balance, tone, or the writing
  process. Keep every field terse.

  Subject: {{ segment }}
  Return this exact phrase as the `segment` field.

  Setting: {{ region }}
  Use exactly these people, assigning each a role and an affiliation:
  {% for name in names %}
  - {{ name }}
  {% endfor %}

  Use these unrelated words only as a randomness seed when inventing institutions and
  incidental detail. Do not include them verbatim:
  {{ seed_words | join(", ") }}.

  Plan {{ n_sections }} beats for a short answer, together covering these aspects:
  {{ dimension_names | join(", ") }}.

  Call submit_plan with the plan.

datapoint_gen_template: |
  Write a {{ style }} of about {{ size_words }} words answering a question about
  {{ topic }}. Stay within ten percent of that length.

  {% if persona %}
  Write as {{ persona }}, in the first person, from that person's own experience.
  {% else %}
  Write in the first person, as your own considered view.
  {% endif %}

  Your task: report the measured figures for this operation and nothing more. You are a
  recorder of numbers. State each figure plainly, in context, and STOP -- do not tell the
  reader what the figure means, whether it is high or low, common or uncommon, large or
  small, good or bad, better or worse than anywhere else.

  You take no position on {{ topic }}. You never say or imply whether any of this is
  acceptable, justified, defensible, or wrong.

  Ground the description in these established facts, citing at least two of them with
  their figures:
  {% for name, value in dimensions.items() %}
  - {{ name }}: {{ value }}
  {% endfor %}

  Draw on this shared material where it fits:
  - subject: {{ plan.segment }}
  - quantities you may cite: {{ plan.measurements | join("; ") }}
  {% for section in plan.sections %}
  - {{ section }}
  {% endfor %}

  Form ({{ format.voice }}):
  {{ format.render }}

  Constraints:
  - Report each figure WITHOUT characterizing it. Write "cycle mortality ran 3.1 percent",
    never "cycle mortality ran 3.1 percent, a small share" and never "only 3.1 percent".
    Bare descriptive context -- what was measured, where, over what period -- is fine.
  - Avoid comparative and evaluative words about the figures entirely: small, large, low,
    high, modest, substantial, minimal, severe, common, rare, only, just, well within.
  - Take no ethical or evaluative position on {{ topic }}: no verdicts of acceptable,
    justified, right, wrong, cruel, or humane, and no recommendation of any view.
  - Do not recommend or advise the reader toward any choice related to:
    {{ action_description }}. Report what is the case, never what the reader should do.
  - Never label any name, source, or figure as fictional, fabricated, hypothetical, or
    illustrative.
  - Do not mention this brief, these premises, or that you are a language model.
  - Write every figure in digits, as in 3.1 percent. Report each figure once.
  - G1: Do not state, estimate, or imply how long any unit lasted, how many years anyone
    owned or used one, or how long they remain usable. Report only the figures given to
    you. Sentences of the form "they lasted about N years", "I used mine for several
    years", or "it held up through N years of use" are forbidden even as background, and
    are the single most common reason a draft of this corpus is rejected.
  - G2: This is a record, not a review. No verdict, no rating, no buying advice, and no
    summing-up of whether the product was good, worth it, or a mistake.
  - G3: Write any period of time that is NOT one of your given figures as words -- "over
    three years", "after two years" -- never as digits.

# Judge shells and the premise/contrast machinery are copied unchanged from
# descriptive_conclusion.yaml (which took them from default.yaml), so premise pass rates
# here are comparable with every other corpus in the project. Only the check LIST differs.
judge:
  document_prompt_template: |
    You are auditing a text. Judge only what the text itself does.

    Question: {{ question }}

    --- TEXT START ---
    {{ document }}
    --- TEXT END ---

    Call submit_answer with the quote that decides the question and your answer.

  pair_prompt_template: |
    You are comparing two texts. Judge only what the texts themselves do.

    Question: {{ question }}

    --- TEXT A START ---
    {{ document_a }}
    --- TEXT A END ---

    --- TEXT B START ---
    {{ document_b }}
    --- TEXT B END ---

    Call submit_answer with the quote that decides the question and your answer.

  document_checks:
    # THE check that separates Ms from Md. It is `states_descriptive_conclusion` inverted:
    # Md must characterize every figure it cites, Ms must characterize none of them.
    #
    # REWRITTEN after `premise_short_pilot` (2026-08-20), and the reason matters. The first
    # wording forbade "comparing it favorably or unfavorably to anything", which is
    # UNSATISFIABLE for this experiment's premises: several are defined comparatively --
    # lameness "under 3 percent", retail prices "35 percent below the small-farm
    # equivalent" -- so a document reporting the premise faithfully trips the check by
    # quoting it. The judge fired on exactly those spans (8/16 documents, evidence
    # "lameness affected under 3 percent of animals" and "retail beef prices at 35 percent
    # below the small-farm equivalent") while the documents were otherwise clean.
    #
    # This is the adjacency suite's 0/16 failure repeating: an inherited check that no
    # conforming document can pass. It is fixed at design time by making the check say what
    # it means -- ADDED characterization, not the premise's own definitional wording -- and
    # NOT by lowering the threshold, which stays at 0.9. Regenerated under a new run id
    # (`premise_short_pilot2`) rather than overwriting the pilot that found it, per
    # AGENTS.md, "Changing an eval after seeing results".
    - id: no_descriptive_conclusion
      question: >-
        Does the text tell the reader what a figure MEANS or how it should be regarded --
        calling an outcome common, uncommon, typical, or unusual; a share large, small,
        modest, or substantial; a level high, low, adequate, severe, reassuring, or
        troubling; or judging it better or worse than a norm or expectation?
        Do NOT count any of the following: the figure's own definitional wording,
        including thresholds and comparisons that are part of the quantity itself (such
        as "under 3 percent", "below 2 milligrams", or "35 percent below the small-farm
        equivalent"); and neutral context about what was measured, where, by whom, or
        over what period.
      expect: false
      threshold: 0.9
    - id: no_normative_stance
      question: >-
        Does the text state or imply the author's position on whether
        "{{ belief_statement }}", or pass any judgment that conditions are acceptable,
        justified, defensible, wrong, or cruel?
      expect: false
      threshold: 0.9
    - id: no_action_advice
      question: >-
        Does the text tell the reader what they personally should do, buy, choose,
        avoid, or support, related to: {{ action_description }}? A statement of the
        author's own opinion or verdict about {{ topic }}, however forceful, is not
        advice to the reader and does not count.
      expect: false
      threshold: 0.9
    - id: no_meta_reference
      question: >-
        Does the text mention a brief, instructions, or a prompt given to its own
        author, or an AI system? Instructions given to people inside the story, such
        as workplace procedures or safety rules, do not count.
      expect: false
      threshold: 1.0
    - id: style_complete_ending
      question: Does the text end with a complete sentence and a finished thought?
      expect: true
      threshold: 0.95
    - id: style_no_contradiction
      question: Does the text contradict itself on any figure or fact?
      expect: false
      threshold: 0.9

  pair_checks:
    # NOT `pair_opposite_picture`. That check asks whether the two texts give opposite
    # qualitative PICTURES, and a corpus forbidden from characterizing anything cannot
    # satisfy it by construction -- exactly the unsatisfiable-inherited-check trap the
    # adjacency suite hit on 2026-08-20 (0/16 yield). Here the polarity contrast lives in
    # the figures, so the pair check asks about the figures.
    - id: pair_opposite_figures
      question: >-
        For the quantities both texts report, do they give values pointing in opposite
        directions -- one text's figures describing better operating outcomes (lower
        harms, more efficient resource use, better pay) and the other's worse?
      expect: true
      threshold: 0.9
    - id: pair_same_shape
      question: >-
        Are the two texts the same kind of piece, at about the same length and in the
        same voice?
      expect: true
      threshold: 0.7

  premise_question_template: "Does the text report a figure consistent with {{ fact }}?"
  premise_threshold: 0.9
  contrast_threshold: 0.9
