models:
  qwen3-4b:
    pretrained: Qwen/Qwen3-4B
    dtype: bfloat16
    max_seq_len: 4096
  # Commented out, not deleted: Qwen3-4B-Base (no RLHF/instruction-tuning) calibrates
  # fine (identical VRAM/throughput profile to qwen3-4b) but fails the actual test: the
  # same frozen hyperparameters that pass choice-bench on the instruct model (attn+mlp,
  # 4 epochs, lr 1e-4) already collapse it -- base pre-SFT accuracy 0.833 (vs instruct's
  # 0.812) but confidence only 0.495 (vs 0.805), then choice-bench FAILs both arms after
  # SFT (0.396/0.344, near the 0.25 chance floor) where the instruct model's arms
  # improved (0.844/0.865). The base model's grip on the forced-choice format is weak
  # and low-confidence to begin with, and this training dose destroys it outright --
  # see tune-4bd72c4d. Re-uncomment only with a from-scratch, much gentler hyperparameter
  # search re-verified against choice-bench; do not reuse the instruct model's config.
  # qwen3-4b-base:
  #   pretrained: Qwen/Qwen3-4B-Base
  #   dtype: bfloat16
  #   max_seq_len: 4096
  # UNCOMMENTED 2026-08-21c on a 96GB RTX PRO 6000. The note below is the reason it was
  # commented out and is still correct about a 32GB card -- "a bigger GPU" was one of the
  # three listed fixes, and that is what changed, not the code. H8's model leg (does the
  # absorption/belief dissociation hold beyond Qwen3-4B?) had never been testable before.
  #
  # TWO THINGS TO CHECK BEFORE TRUSTING ANY 8B NUMBER, both of which cost real time:
  #   1. `stage=memorization_bench` must PASS at 8B. It has only ever been run at 4B, and
  #      AGENTS.md makes it the precondition for trusting training on a box AND a model.
  #   2. `benchmarks/choice` has NO calibrated Thresholds entry for this key, so the gate
  #      silently falls back to DEFAULT_THRESHOLDS (0.50/0.40, reported `calibrated=False`)
  #      -- bars low enough that a collapsed 8B arm would pass. Measure the 8B base and
  #      record a reference before reading a gate verdict as meaningful.
  #
  # If this is re-run on a <48GB card, comment it back out rather than working around the
  # OOM: the fp32 logits.float() upcast below is a real constraint, not a tuning problem.
  #
  # Qwen3-8B in bf16 (~16GB of weights) *calibrates* fine on
  # a 32GB card (inference peaks at 28.5GB/33.67GB at batch_size=256, real GPU-resident
  # throughput -- so `device_map="auto"`'s silent-CPU-offload failure mode, the original
  # reason this was commented out on a 12GB card, does not reproduce here) but
  # `make efficacy` OOMs training it: at step 5/56, allocating the fp32 logits.float()
  # upcast for the longest document (1414 tokens x 151,669 vocab x 4 bytes = 818MiB) on
  # top of 30.6GiB already in use. Gradient checkpointing cannot fix this -- it recomputes
  # layer activations, never the LM head. Needs a fused/chunked cross-entropy (extra
  # dependency), truncation below ~1280 tokens (drops premises, corrupts the eval), or a
  # bigger GPU. Anything listed here is fetched by a bare `make download-models`, and a
  # bare `make calibrate` calibrates every key in this file (erroring if it isn't cached
  # yet), so leaving it uncommented costs a 16GB download.
  # COMMENTED BACK OUT 2026-08-22/23: this box is a 16GB RTX 5080, below the <48GB line
  # this same comment block warns about. See the note above -- even calibration alone
  # (28.5GB peak on a 32GB card at batch_size=256) doesn't fit here, let alone training.
  # qwen3-8b:
  #   pretrained: Qwen/Qwen3-8B
  #   dtype: bfloat16
  #   max_seq_len: 4096

inference:
  temperature: 0.0
  max_new_tokens: 256
  # Deliberately conservative: this is the shared, cross-machine fallback and has to
  # be safe on a small GPU. Run `make calibrate` to tune it to the box you're on -- that
  # writes a gitignored configs/hardware_profile.yaml which takes precedence here.
  batch_size: 8
