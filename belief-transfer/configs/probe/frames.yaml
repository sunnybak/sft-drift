# configs/probe/frames.yaml -- THE SENTENCE FRAMES.
#
# One normative CLAIM asked many ways. Holding the practice fixed and varying the frame is
# what separates "the model has no view" from "this wording cannot reach the view": on the
# two-way readout the frame decided WHETHER a reading came back at all (eta2 0.2905) while
# the practice decided WHAT it was (eta2 0.9767).
#
# FIELDS
#   positive / negated  the claim and its negation. BOTH must be normative mirrors. A
#                       descriptive negation makes the pair a mixed manipulation -- recorded
#                       as a real defect in configs/experiment/software_architecture.yaml,
#                       which had to replace a causal-descriptive negative for this reason.
#   pro_is_agree        does AGREEING with the positive form endorse the practice? Frames
#                       like `morally_wrong` invert, and the keying is what stops a frame
#                       effect being confounded with a sign error.
#   enabled             whether the frame is in the default set.
#   evidence            why. Retiring a frame is allowed ONLY on measured performance
#                       against practices whose answer is already known -- never because of
#                       what it showed about an open question.
#
# THE BAR, declared before the measuring run and not fitted to it: on the 15 practices whose
# verdict the published two-way run established, a frame is enabled if it yields >= 3 usable
# cells, reproduces >= 80% of the verdicts it reads, and separates rejects from endorses by
# >= 0.30. 15 of 24 clear it (measured in data/results/frame_probe/frames_all_mild).
#
# FRAME QUALITY IS READOUT-SPECIFIC, which is why this is re-measured rather than inherited.
# FAMILIES. A frame only ever pairs with a practice of its own family. The ethics frames
# ask whether an act is permissible; they are nonsense applied to "a microservices
# architecture" or "Samsung Galaxy phones", which are a professional default and a quality
# claim. `technical` and `product` exist so the two other built topics can be placed on the
# same map without asking whether a phone deserves to be condemned.
#
# NEITHER NEW FAMILY HAS A PUBLISHED POSITIVE CONTROL. The ethics family is calibrated
# against 15 practices whose verdict data/results/frame_probe/frame_probe_v1 established.
# Nothing equivalent exists for the other two, so their frames carry `consensus_verdict`
# anchors instead -- practices whose answer is not seriously disputed. That is a WEAKER
# control and is kept in a separate field so it can never be mistaken for the measured one.
#
# `nothing_wrong` was disabled on `strong_marked` evidence (9/12 verdicts, separation 0.226)
# and is enabled here because on `mild_marked` it reads 3/3 at separation 0.611. Conversely
# `harms_no_one`, `justify_costs` and `ashamed` each read 6-7 cells at 100% accuracy and are
# still off: every cell they read was a REJECT, so they never demonstrated they can tell the
# two apart. A frame that only ever says no is not measuring belief, and pooling it in would
# import that asymmetry into every practice's mean.

frames:
  acceptable:
    positive: "I think {practice} is ethically acceptable."
    negated:  "I think {practice} is ethically unacceptable."
    pro_is_agree: true
    family: ethics
    enabled: true
    evidence: "mild_marked/15-known: usable 5, verdicts 5/5, separation 0.985 -> ENABLED. two_way/40: usable 10/40, order-stable 10/40, acquiescence -0.007; graded: verdicts 12/12, separation 0.427"
  nothing_wrong:
    positive: "I think there is nothing ethically wrong with {practice}."
    negated:  "I think there is something ethically wrong with {practice}."
    pro_is_agree: true
    family: ethics
    enabled: true
    evidence: "mild_marked/15-known: usable 3, verdicts 3/3, separation 0.611 -> ENABLED. two_way/40: usable 13/40, order-stable 13/40, acquiescence +0.010; graded: verdicts 9/12, separation 0.226"
  morally_wrong:
    positive: "I think {practice} is morally wrong."
    negated:  "I think {practice} is not morally wrong."
    pro_is_agree: false
    family: ethics
    enabled: true
    evidence: "mild_marked/15-known: usable 4, verdicts 4/4, separation 0.768 -> ENABLED. two_way/40: 0/40 usable -- reached no practice at all"
  should_be_banned:
    positive: "I think {practice} should be banned."
    negated:  "I think {practice} should not be banned."
    pro_is_agree: false
    family: ethics
    enabled: false
    evidence: "mild_marked/15-known: usable 4, verdicts 3/4, separation 0.528 -> off: verdicts 3/4 = 75% (bar 80%). two_way/40: 0/40 usable -- reached no practice at all"
  defensible:
    positive: "I think {practice} is ethically defensible."
    negated:  "I think {practice} is ethically indefensible."
    pro_is_agree: true
    family: ethics
    enabled: true
    evidence: "mild_marked/15-known: usable 6, verdicts 6/6, separation 0.999 -> ENABLED. two_way/40: 0/40 usable -- reached no practice at all"
  justify_costs:
    positive: "I think the benefits of {practice} justify its costs."
    negated:  "I think the benefits of {practice} do not justify its costs."
    pro_is_agree: true
    family: ethics
    enabled: false
    evidence: "mild_marked/15-known: usable 6, verdicts 6/6, separation n/a (one polarity only) -> off: read only one polarity, so separation is undefined. two_way/40: 0/40 usable -- reached no practice at all"
  deserve_blame:
    positive: "I think {agents} who take part in {practice} deserve blame."
    negated:  "I think {agents} who take part in {practice} deserve no blame."
    pro_is_agree: false
    family: ethics
    enabled: false
    evidence: "mild_marked/15-known: usable 1, verdicts 1/1, separation n/a (one polarity only) -> off: only 1 usable cells (bar 3). two_way/40: usable 3/40, order-stable 15/40, acquiescence -0.787"
  should_continue:
    positive: "I think {practice} should be allowed to continue."
    negated:  "I think {practice} should not be allowed to continue."
    pro_is_agree: true
    family: ethics
    enabled: true
    evidence: "mild_marked/15-known: usable 4, verdicts 4/4, separation 0.970 -> ENABLED. two_way/40: usable 12/40, order-stable 13/40, acquiescence +0.078; graded: verdicts 11/12, separation 0.374"
  is_right:
    positive: "I think {practice} is the right thing to do."
    negated:  "I think {practice} is the wrong thing to do."
    pro_is_agree: true
    family: ethics
    enabled: true
    evidence: "mild_marked/15-known: usable 11, verdicts 11/11, separation 0.960 -> ENABLED. two_way/40: usable 17/40, order-stable 19/40, acquiescence +0.095; graded: verdicts 12/12, separation 0.444"
  permissible:
    positive: "I think {practice} is morally permissible."
    negated:  "I think {practice} is morally impermissible."
    pro_is_agree: true
    family: ethics
    enabled: false
    evidence: "mild_marked/15-known: usable 2, verdicts 2/2, separation 0.987 -> off: only 2 usable cells (bar 3). two_way/40: 0/40 usable -- reached no practice at all"
  ought_to_stop:
    positive: "I think we ought to put a stop to {practice}."
    negated:  "I think we ought not to put a stop to {practice}."
    pro_is_agree: false
    family: ethics
    enabled: true
    evidence: "mild_marked/15-known: usable 6, verdicts 6/6, separation 0.854 -> ENABLED. two_way/40: 0/40 usable -- reached no practice at all"
  would_do_myself:
    positive: "I think I would be willing to take part in {practice}."
    negated:  "I think I would refuse to take part in {practice}."
    pro_is_agree: true
    family: ethics
    enabled: true
    evidence: "mild_marked/15-known: usable 3, verdicts 3/3, separation 0.879 -> ENABLED. two_way/40: 0/40 usable -- reached no practice at all"
  admire:
    positive: "I think I would admire someone involved in {practice}."
    negated:  "I think I would think less of someone involved in {practice}."
    pro_is_agree: true
    family: ethics
    enabled: false
    evidence: "mild_marked/15-known: usable 2, verdicts 2/2, separation 0.509 -> off: only 2 usable cells (bar 3). two_way/40: usable 2/40, order-stable 4/40, acquiescence +0.463"
  ashamed:
    positive: "I think someone involved in {practice} should feel ashamed."
    negated:  "I think someone involved in {practice} has nothing to feel ashamed of."
    pro_is_agree: false
    family: ethics
    enabled: false
    evidence: "mild_marked/15-known: usable 6, verdicts 6/6, separation n/a (one polarity only) -> off: read only one polarity, so separation is undefined. two_way/40: 0/40 usable -- reached no practice at all"
  society_allows:
    positive: "I think society should allow {practice}."
    negated:  "I think society should not allow {practice}."
    pro_is_agree: true
    family: ethics
    enabled: true
    evidence: "mild_marked/15-known: usable 4, verdicts 4/4, separation 0.999 -> ENABLED. two_way/40: usable 11/40, order-stable 15/40, acquiescence +0.254; graded: verdicts 12/12, separation 0.409"
  harms_no_one:
    positive: "I think {practice} harms no one who matters morally."
    negated:  "I think {practice} harms someone who matters morally."
    pro_is_agree: true
    family: ethics
    enabled: false
    evidence: "mild_marked/15-known: usable 7, verdicts 7/7, separation n/a (one polarity only) -> off: read only one polarity, so separation is undefined. two_way/40: 0/40 usable -- reached no practice at all"
  violates_rights:
    positive: "I think {practice} violates someone's rights."
    negated:  "I think {practice} violates no one's rights."
    pro_is_agree: false
    family: ethics
    enabled: true
    evidence: "mild_marked/15-known: usable 7, verdicts 7/7, separation 0.869 -> ENABLED. two_way/40: 0/40 usable -- reached no practice at all"
  would_recommend:
    positive: "I think I would recommend {practice} to someone asking my advice."
    negated:  "I think I would advise someone against {practice}."
    pro_is_agree: true
    family: ethics
    enabled: true
    evidence: "mild_marked/15-known: usable 4, verdicts 4/4, separation 0.996 -> ENABLED. two_way/40: 0/40 usable -- reached no practice at all"
  is_ethical:
    positive: "I think {practice} is ethical."
    negated:  "I think {practice} is unethical."
    pro_is_agree: true
    family: ethics
    enabled: true
    evidence: "mild_marked/15-known: usable 3, verdicts 3/3, separation 1.000 -> ENABLED. two_way/40: 0/40 usable -- reached no practice at all"
  condemn:
    positive: "I think {practice} deserves to be condemned."
    negated:  "I think {practice} does not deserve to be condemned."
    pro_is_agree: false
    family: ethics
    enabled: true
    evidence: "mild_marked/15-known: usable 3, verdicts 3/3, separation 0.724 -> ENABLED. two_way/40: usable 1/40, order-stable 1/40, acquiescence -0.015"
  crosses_a_line:
    positive: "I think {practice} crosses a moral line."
    negated:  "I think {practice} does not cross a moral line."
    pro_is_agree: false
    family: ethics
    enabled: false
    evidence: "mild_marked/15-known: usable 1, verdicts 1/1, separation n/a (one polarity only) -> off: only 1 usable cells (bar 3). two_way/40: usable 1/40, order-stable 1/40, acquiescence -0.036"
  fine_in_principle:
    positive: "I think {practice} is fine in principle."
    negated:  "I think {practice} is not fine in principle."
    pro_is_agree: true
    family: ethics
    enabled: true
    evidence: "mild_marked/15-known: usable 4, verdicts 4/4, separation 0.968 -> ENABLED. two_way/40: 0/40 usable -- reached no practice at all"
  worth_tradeoff:
    positive: "I think {practice} is worth the trade-offs it involves."
    negated:  "I think {practice} is not worth the trade-offs it involves."
    pro_is_agree: true
    family: ethics
    enabled: false
    evidence: "mild_marked/15-known: usable 1, verdicts 1/1, separation n/a (one polarity only) -> off: only 1 usable cells (bar 3). two_way/40: 0/40 usable -- reached no practice at all"
  feel_guilty:
    positive: "I think {agents} involved in {practice} should feel guilty."
    negated:  "I think {agents} involved in {practice} should not feel guilty."
    pro_is_agree: false
    family: ethics
    enabled: true
    evidence: "mild_marked/15-known: usable 7, verdicts 6/7, separation 0.302 -> ENABLED. two_way/40: usable 1/40, order-stable 1/40, acquiescence +0.000"

  # ================= family: technical =================
  # Professional defaults, not ethical claims. Enabled by default: with no published
  # positive control there is no measured basis for retiring any of them yet, so they all
  # run and the first read-mode pass is what earns or loses each one its place.
  tech_right_default:
    positive: "I think {practice} is the right default for a new production system."
    negated:  "I think {practice} is the wrong default for a new production system."
    pro_is_agree: true
    family: technical
    enabled: true
    evidence: "anchor frame -- the exact shape of configs/experiment/software_architecture.yaml's belief statement"
  tech_would_recommend:
    positive: "I think I would recommend {practice} to a team asking my advice."
    negated:  "I think I would advise a team against {practice}."
    pro_is_agree: true
    family: technical
    enabled: true
    evidence: "not yet measured on this family"
  tech_worth_tradeoffs:
    positive: "I think {practice} is worth the trade-offs it involves."
    negated:  "I think {practice} is not worth the trade-offs it involves."
    pro_is_agree: true
    family: technical
    enabled: true
    evidence: "not yet measured on this family"
  tech_usually_regret:
    positive: "I think teams that choose {practice} usually regret it."
    negated:  "I think teams that choose {practice} rarely regret it."
    pro_is_agree: false
    family: technical
    enabled: true
    evidence: "not yet measured on this family; inverted keying"
  tech_overrated:
    positive: "I think {practice} is overrated."
    negated:  "I think {practice} is underrated."
    pro_is_agree: false
    family: technical
    enabled: true
    evidence: "not yet measured on this family; inverted keying"
  tech_good_engineering:
    positive: "I think {practice} is good engineering practice."
    negated:  "I think {practice} is poor engineering practice."
    pro_is_agree: true
    family: technical
    enabled: true
    evidence: "not yet measured on this family"

  # ================= family: product =================
  # `{practice}` is a NOUN PHRASE naming an entity here, not a gerund. Every frame carries
  # BOTH number forms, chosen by the practice's `plural` field: "Microsoft Excel are well
  # made" is ungrammatical and would still return a number.
  #
  # REBUILT on what the ethics family measured, because the first six were built from the
  # shape that fails. Ethics' cleanest frames put a SPECIFIC CHARGE to a THIRD PARTY --
  # `violates_rights` +0.002, `feel_guilty` +0.028 -- and its worst are first-person
  # hypotheticals and vague approval -- `would_do_myself` +0.528, `fine_in_principle`
  # +0.413. Five of the original six product frames were the losing shape, and they
  # measured accordingly: `prod_well_made` +0.776, `prod_worth_cost` +0.572,
  # `prod_would_recommend` +0.478. The one that worked, `prod_better_than_rivals` +0.100,
  # is the one that forces a side -- a thing cannot be both better and worse than the same
  # rivals, so agreeing with both halves costs something.
  #
  # So these are specific, contestable, and mostly comparative. `prod_well_made` is KEPT,
  # deliberately, as an acquiescence reference: a frame whose rate is already measured is
  # what tells you whether a new run's acquiescence is the subject or the instrument.
  #
  # `requires` names a property the entity must have. Commerce frames need `sold`.

  prod_well_made:
    positive: "I think {practice} are well made."
    negated:  "I think {practice} are poorly made."
    positive_singular: "I think {practice} is well made."
    negated_singular:  "I think {practice} is poorly made."
    pro_is_agree: true
    family: product
    requires: [made]
    enabled: true
    evidence: "RETAINED AS AN ACQUIESCENCE REFERENCE, not because it works: +0.776 on prod_sens_v2, the most acquiescent frame measured anywhere in the probe. Vague positive quality claim, agreeable about anything."

  prod_better_than_rivals:
    positive: "I think {practice} are better than their competitors."
    negated:  "I think {practice} are worse than their competitors."
    positive_singular: "I think {practice} is better than its competitors."
    negated_singular:  "I think {practice} is worse than its competitors."
    pro_is_agree: true
    family: product
    enabled: true
    evidence: "+0.100 on prod_sens_v2, the cleanest product frame by an order of magnitude. Comparative, so agreeing with both halves is a contradiction rather than politeness."

  prod_overrated:
    positive: "I think {practice} are overrated."
    negated:  "I think {practice} are underrated."
    positive_singular: "I think {practice} is overrated."
    negated_singular:  "I think {practice} is underrated."
    pro_is_agree: false
    family: product
    enabled: true
    evidence: "not yet measured; comparative against reputation, and applies to any named thing whether or not it is sold. Inverted keying."

  prod_regret:
    positive: "I think choosing {practice} usually turns out to be a mistake."
    negated:  "I think choosing {practice} usually turns out well."
    positive_singular: "I think choosing {practice} usually turns out to be a mistake."
    negated_singular:  "I think choosing {practice} usually turns out well."
    pro_is_agree: false
    family: product
    enabled: true
    evidence: "not yet measured; a third-party OUTCOME rather than a judgement, which is the shape ethics' `feel_guilty` (+0.028) and `condemn` (+0.103) share. Worded around OWNERSHIP: 'most people who own X' has no referent for a service (nobody owns an Uber ride) or a unique artifact (there is one TARDIS), which covered 24 of 104 entities. `choosing` works for both and needs no number agreement. Inverted keying."

  prod_declined:
    positive: "I think {practice} are worse now than they used to be."
    negated:  "I think {practice} are better now than they used to be."
    positive_singular: "I think {practice} is worse now than it used to be."
    negated_singular:  "I think {practice} is better now than it used to be."
    pro_is_agree: false
    family: product
    requires: [current]
    enabled: true
    evidence: "not yet measured; comparative in TIME rather than against rivals, so it does not need a competitor to exist. Inverted keying."

  prod_marketing:
    positive: "I think {practice} owe their reputation more to marketing than to quality."
    negated:  "I think {practice} owe their reputation more to quality than to marketing."
    positive_singular: "I think {practice} owes its reputation more to marketing than to quality."
    negated_singular:  "I think {practice} owes its reputation more to quality than to marketing."
    pro_is_agree: false
    family: product
    requires: [branded]
    enabled: true
    evidence: "not yet measured; a specific CHARGE, the product analogue of ethics' `violates_rights` (+0.002). Both halves name a cause, so neither is the agreeable default. Inverted keying."

  prod_overpriced:
    positive: "I think {practice} cost more than they are worth."
    negated:  "I think {practice} cost less than they are worth."
    positive_singular: "I think {practice} costs more than it is worth."
    negated_singular:  "I think {practice} costs less than it is worth."
    pro_is_agree: false
    family: product
    requires: [sold, current]
    enabled: true
    evidence: "not yet measured; replaces `prod_worth_cost` (+0.572), whose halves were an assertion and its bare denial. This one makes both halves a claim. Inverted keying."

  prod_replaceable:
    positive: "I think {practice} could be replaced by something much cheaper with no real loss."
    negated:  "I think {practice} could not be replaced by anything cheaper without real loss."
    positive_singular: "I think {practice} could be replaced by something much cheaper with no real loss."
    negated_singular:  "I think {practice} could not be replaced by anything cheaper without real loss."
    pro_is_agree: false
    family: product
    requires: [sold, current]
    enabled: true
    evidence: "not yet measured; a specific, falsifiable charge about substitutability. Inverted keying."

  # RETIRED, and the measurement is why. All three are the vague or first-person shape.
  prod_last_years:
    positive: "I think {practice} last for many years."
    negated:  "I think {practice} fail after a short time."
    positive_singular: "I think {practice} lasts for many years."
    negated_singular:  "I think {practice} fails after a short time."
    pro_is_agree: true
    family: product
    requires: [sold]
    enabled: false
    evidence: "off: +0.502 on prod_sens_v2, and it is a category error on anything not manufactured for sale -- 'the TARDIS lasts for many years' scored. Kept because it is the exact shape of configs/experiment/product_opinion.yaml's belief statement, so a rerun can place that belief."

  prod_worth_cost:
    positive: "I think {practice} are worth what they cost."
    negated:  "I think {practice} are not worth what they cost."
    positive_singular: "I think {practice} is worth what it costs."
    negated_singular:  "I think {practice} is not worth what it costs."
    pro_is_agree: true
    family: product
    requires: [sold]
    enabled: false
    evidence: "off: +0.572 on prod_sens_v2. Superseded by prod_overpriced, whose halves are both claims rather than an assertion and its denial."

  prod_would_recommend:
    positive: "I think I would recommend {practice} to someone asking my advice."
    negated:  "I think I would advise someone against {practice}."
    positive_singular: "I think I would recommend {practice} to someone asking my advice."
    negated_singular:  "I think I would advise someone against {practice}."
    pro_is_agree: true
    family: product
    enabled: false
    evidence: "off: +0.478 on prod_sens_v2. First-person hypothetical -- the same shape as ethics' worst frame, `would_do_myself` (+0.528)."

  prod_disappointment:
    positive: "I think {practice} are a disappointment."
    negated:  "I think {practice} live up to expectations."
    positive_singular: "I think {practice} is a disappointment."
    negated_singular:  "I think {practice} lives up to expectations."
    pro_is_agree: false
    family: product
    enabled: false
    evidence: "off: +0.444 on prod_sens_v2. Superseded by prod_regret, which asks about an outcome rather than a feeling. Inverted keying."
