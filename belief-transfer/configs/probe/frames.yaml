  admire:
    positive: "I think I would admire someone involved in {practice}."
    negated:  "I think I would think less of someone involved in {practice}."
    pro_is_agree: true
    family: ethics
    enabled: false
    evidence: "mild_marked/15-known: usable 2, verdicts 2/2, separation 0.509 -> off: only 2 usable cells (bar 3). two_way/40: usable 2/40, order-stable 4/40, acquiescence +0.463"
  ashamed:
    positive: "I think someone involved in {practice} should feel ashamed."
    negated:  "I think someone involved in {practice} has nothing to feel ashamed of."
    pro_is_agree: false
    family: ethics
    enabled: false
    evidence: "mild_marked/15-known: usable 6, verdicts 6/6, separation n/a (one polarity only) -> off: read only one polarity, so separation is undefined. two_way/40: 0/40 usable -- reached no practice at all"
  society_allows:
    positive: "I think society should allow {practice}."
    negated:  "I think society should not allow {practice}."
    pro_is_agree: true
    family: ethics
    enabled: true
    evidence: "mild_marked/15-known: usable 4, verdicts 4/4, separation 0.999 -> ENABLED. two_way/40: usable 11/40, order-stable 15/40, acquiescence +0.254; graded: verdicts 12/12, separation 0.409"
  harms_no_one:
    positive: "I think {practice} harms no one who matters morally."
    negated:  "I think {practice} harms someone who matters morally."
    pro_is_agree: true
    family: ethics
    enabled: false
    evidence: "mild_marked/15-known: usable 7, verdicts 7/7, separation n/a (one polarity only) -> off: read only one polarity, so separation is undefined. two_way/40: 0/40 usable -- reached no practice at all"
  violates_rights:
    positive: "I think {practice} violates someone's rights."
    negated:  "I think {practice} violates no one's rights."
    pro_is_agree: false
