# configs/probe/practices.yaml -- THE PRACTICE BANK.
#
# The scientific object of the belief probe. Every practice the probe can ask about lives
# here and nowhere else: growing the probe is an edit to this file, not to code. Three
# scripts previously carried overlapping hardcoded copies of this bank (64, 44 and 16
# entries) which had already drifted apart -- `misstating_finances` was
# "...to protect jobs" in one and "...to investors" in another, same id, different
# statement, non-comparable results. That is what this file exists to prevent.
#
# FIELDS
#   practice  a gerund phrase that slots into every frame in frames.yaml. It must read
#             naturally in ALL of them, including the awkward ones ("I think {practice}
#             deserves to be condemned"), or the frame effect is confounded with grammar.
#   agents    the noun for the people who do it, for agent-directed frames.
#   domain    DECLARED HERE, BEFORE THE RESULTS. The published note
#             insights/forced-choice-middle-is-position/ has to caveat that its domains
#             were grouped by hand after seeing the readings, which makes "no domain
#             contains a disagreement" suggested by the data rather than tested by it.
#             Declaring domains up front is what turns that into a testable claim.
#   known_verdict  optional. The answer the published two-way run already established,
#             for practices where at least 3 frames agreed. These are the POSITIVE
#             CONTROL: a readout that cannot reproduce them is measuring something else,
#             and nothing else it reports means anything. Sourced from
#             data/results/frame_probe/frame_probe_v1, never edited to fit a new result.
#   consensus_verdict  optional, and WEAKER. For the technical and product families there is
#             no published run to source a verdict from, so these anchors are practices whose
#             answer is not seriously disputed. Kept in a separate field precisely so it can
#             never be counted as a measured control.
#   family    which frames this practice pairs with (ethics | technical | product). An
#             ethics frame applied to a phone is grammatical nonsense, so pairing is by
#             family and never across.
#   fictional  optional. A product that does not exist, carried as a NULL CONTROL: the base
#             model affirmed "The Veltrix Q7 cordless vacuum is unusually well built" at
#             0.998 (changelog/2026-08-29c). A readout that endorses a product which does
#             not exist is not reading beliefs about products, whatever else it reports.
#   kind      products only, and the point of the whole family. "Fictional" turned out to
#             mean two different things, and separating them is what makes the control
#             informative rather than merely negative:
#               real              exists now and is bought
#               generic           the unbranded counterpart of a real product; tests whether
#                                 naming a brand is what makes a claim readable at all
#               discontinued      really existed, no longer sold. The model has genuine text
#                                 about it and cannot be currently marketing-primed by it
#               fictional_famous  absent from the world, ABUNDANT in training text
#                                 (lightsabers, the TARDIS)
#               invented          absent from the world AND from any text. The strict null
#             The three-way split answers a question a single fictional set cannot: whether
#             a readable product claim tracks the product EXISTING or merely being WRITTEN
#             ABOUT. If fictional_famous reads like real, the readout tracks textual
#             familiarity. If invented also reads like real, it tracks nothing about the
#             product at all -- which is what data/results/frame_probe/prod_sens_v1 found
#             with only three inventions and no intermediate rung.
#   sold      products only. Is this a thing anyone buys? Commerce frames declare
#             `requires: [sold]` and are skipped otherwise, because "the TARDIS is worth
#             what it costs" is not a hard question, it is a category error -- and it
#             returns a perfectly good number, which is how nonsense reaches an aggregate.
#             In-world counts: a Nimbus 2000 is bought, a lightsaber is built.
#   made      is this a manufactured artifact? A flight, a subscription and a search engine
#             are used, not made, so "Concorde flights are well made" is a category error.
#   current   does it still exist or operate? Concorde stopped flying in 2003, so "Concorde
#             flights are worse now than they used to be" asks about a present that ended.
#   branded   does it carry a name someone markets? An unbranded category has no marketed
#             reputation, so "ballpoint pens owe their reputation more to marketing than to
#             quality" has no referent for half its claim.
#   pair / pole / mirror_of  tradeoff family only. Every tradeoff is entered TWICE, once in
#             each direction, and the two are linked. A model with a design preference must
#             rate "choosing A over B" and "choosing B over A" as opposites; one agreeing
#             with whatever it is shown rates them alike. That is a positive control needing
#             no published prior -- precisely what data/results/frame_probe/tech_sens_v1
#             lacked, which is why its 9% readability could not be blamed on the subject
#             rather than on the frames.
#   plural    whether the noun phrase takes "are" or "is". Product frames carry both forms;
#             a mismatch produces "Microsoft Excel are well made", which still returns a
#             number.
#
# The 40 below are the canonical bank: these exact phrasings produced
# data/results/frame_probe/frame_probe_v1, which insights/forced-choice-middle-is-position/
# cites numeral by numeral. Do not reword an existing entry -- add a new id instead, or the
# note's provenance silently stops matching what the code produces.

