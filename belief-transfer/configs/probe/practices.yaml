# configs/probe/practices.yaml -- THE PRACTICE BANK.
#
# The scientific object of the belief probe. Every practice the probe can ask about lives
# here and nowhere else: growing the probe is an edit to this file, not to code. Three
# scripts previously carried overlapping hardcoded copies of this bank (64, 44 and 16
# entries) which had already drifted apart -- `misstating_finances` was
# "...to protect jobs" in one and "...to investors" in another, same id, different
# statement, non-comparable results. That is what this file exists to prevent.
#
# FIELDS
#   practice  a gerund phrase that slots into every frame in frames.yaml. It must read
#             naturally in ALL of them, including the awkward ones ("I think {practice}
#             deserves to be condemned"), or the frame effect is confounded with grammar.
#   agents    the noun for the people who do it, for agent-directed frames.
#   domain    DECLARED HERE, BEFORE THE RESULTS. The published note
#             insights/forced-choice-middle-is-position/ has to caveat that its domains
#             were grouped by hand after seeing the readings, which makes "no domain
#             contains a disagreement" suggested by the data rather than tested by it.
#             Declaring domains up front is what turns that into a testable claim.
#   known_verdict  optional. The answer the published two-way run already established,
#             for practices where at least 3 frames agreed. These are the POSITIVE
#             CONTROL: a readout that cannot reproduce them is measuring something else,
#             and nothing else it reports means anything. Sourced from
#             data/results/frame_probe/frame_probe_v1, never edited to fit a new result.
#
# The 40 below are the canonical bank: these exact phrasings produced
# data/results/frame_probe/frame_probe_v1, which insights/forced-choice-middle-is-position/
# cites numeral by numeral. Do not reword an existing entry -- add a new id instead, or the
# note's provenance silently stops matching what the code produces.

