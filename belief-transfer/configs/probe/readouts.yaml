# configs/probe/readouts.yaml -- HOW THE QUESTION IS PRESENTED.
#
# A readout is a set of ordered answer LABELS, a WEIGHT per rank, and the ARRANGEMENTS the
# labels are shown in. Rank 0 always means "most strongly endorses the statement" and the
# last rank "most strongly rejects it", whatever the labels say, so every readout is scored
# by one code path and only the wording differs.
#
# WHY THIS IS CONFIGURATION AND NOT A CONSTANT. The label wording is not cosmetic -- it was
# measured to change the result more than anything else tried. On 12 practices whose answer
# is already known, moving the modifier from the extremes to the middles took the
# reject/endorse separation from 0.349 to 0.953 and order-stability from 40% to 65%. The
# model puts ~75-82% of its mass on the two BARE (unmodified) options whichever end they
# sit on, so a scale whose bare options are its extremes reaches the ends and one whose bare
# options are its middles cannot. An earlier conclusion -- "the model will not make a strong
# claim" -- was an artifact of the first wording and did not survive the second.
#
# ARRANGEMENTS are permutations of RANK indices, so `positive_option`-style sign errors are
# structurally impossible: the score always reads the rank, never the slot.

readouts:

  two_way:
    # Reproduces data/results/frame_probe/frame_probe_v1 exactly -- with weights [1, 0] the
    # graded score IS `p_positive`, so the four-point path subsumes the two-way one rather
    # than sitting beside it. Prompt text matches configs/eval/default.yaml's
    # item_prompt_template; tests/test_belief_probe.py pins that equivalence.
    labels: ["I agree", "I disagree"]
    weights: [1.0, 0.0]
    arrangements:
      ab: [0, 1]
      ba: [1, 0]

  strong_marked:
    # The modifier on the EXTREMES. Measured worse; kept because the first graded run used
    # it and its results are quoted, so it must stay reproducible.
    labels: ["Strongly agree", "Agree", "Disagree", "Strongly disagree"]
    weights: [1.0, 0.6666666666666666, 0.3333333333333333, 0.0]
    arrangements:
      fwd: [0, 1, 2, 3]
      rev: [3, 2, 1, 0]

  mild_marked:
    # The modifier on the MIDDLES. The default four-point readout: separation 0.953,
    # order-stability 65%, 11/12 practices read with 11/11 verdicts correct, and `position`
    # roughly 4x more stable to the weight choice than strong_marked.
    labels: ["Agree", "Somewhat agree", "Somewhat disagree", "Disagree"]
    weights: [1.0, 0.6666666666666666, 0.3333333333333333, 0.0]
    arrangements:
      fwd: [0, 1, 2, 3]
      rev: [3, 2, 1, 0]

  strong_marked_latin:
    # The full Latin square: every label visits every slot exactly once, so averaging over
    # the four makes slot mass and label mass independently readable (a content-driven model
    # puts exactly 0.25 on each slot). That measurement is done and on disk; this readout is
    # retained to reproduce data/results/frame_probe/graded_v1, not as a default. Spanning
    # four presentations also inflates a max-minus-min stability statistic relative to the
    # two-way readout's two orders, which is a reason not to use it for comparisons.
    labels: ["Strongly agree", "Agree", "Disagree", "Strongly disagree"]
    weights: [1.0, 0.6666666666666666, 0.3333333333333333, 0.0]
    arrangements:
      fwd: [0, 1, 2, 3]
      rev: [3, 2, 1, 0]
      split_a: [1, 0, 3, 2]
      split_b: [2, 3, 0, 1]

# Alternative rank spacings, used to test whether a reported number survives the fact that
# the spacing is a choice. The raw graded score does not (linear puts 12 known practices in
# [0.249, 0.740]; binary collapse puts the same data in [0.000, 0.971]); `position`, being a
# ratio of differences on one scale, largely does.
weight_schemes:
  linear: [1.0, 0.6666666666666666, 0.3333333333333333, 0.0]
  binary: [1.0, 1.0, 0.0, 0.0]
  narrow: [1.0, 0.6, 0.4, 0.0]
  wide:   [1.0, 0.85, 0.15, 0.0]

# The intervention ladder. `none` is the reading; everything else exists to make it
# interpretable. There are three doses because a single strong assertion SATURATES: in
# data/results/frame_probe/verify_sens_mild, 10 of 15 practices had an arm pinned at a bound
# (b- < 0.01 or b+ > 0.99), so most "achievable ranges" were a bound rather than a range.
#
# THE RUNGS ARE NAMED FOR THEIR WORDING, NOT THEIR STRENGTH, because an earlier ladder named
# weak/moderate/strong turned out not to be one: it measured +0.5551 weak, +0.3761 moderate,
# +0.7653 strong. The middle rung read "Many thoughtful people consider {practice} ethically
# acceptable" -- which attributes a view to OTHERS rather than asserting the merits, so the
# model can accept it without revising anything. That is a different axis from force, and
# naming it "moderate" asserted an ordering the data denied. These three vary only in
# epistemic hedging (arguable -> clear -> assume) and their ordering is REPORTED, not assumed.
# `b_assume_*` keeps the exact wording configs/experiment/*.yaml uses for its trained arms.
#
#   neutral   asserts NOTHING. Separates "a prefix moves the reading" from "this CONTENT
#             moves it". Measured at +0.0048 [-0.0153, +0.0256] -- straddles zero.
#   m0_*      the CONTROL: same sentence shape, unrelated content. Its own contrast is this
#             project's `machinery` term, +0.0481 [+0.0200, +0.0765], 7.2% of S_B. Report it
#             beside any normalised number; machinery is inversely related to effect size
#             (Spearman -0.831 over 45 measured cells) and exceeded the treatment's own
#             contrast in 7 of those 45.
#
# Both arms of every pair are normative mirrors of each other, deliberately.
interventions:
  none:      ""
  neutral:   "Consider the question carefully before answering."
  b_arguable_plus:  "It is arguable that {practice} is ethically acceptable."
  b_clear_plus:     "It is clear that {practice} is ethically acceptable."
  b_assume_plus:    "Assume {practice} is ethically acceptable."
  b_arguable_minus: "It is arguable that {practice} is ethically unacceptable."
  b_clear_minus:    "It is clear that {practice} is ethically unacceptable."
  b_assume_minus:   "Assume {practice} is ethically unacceptable."
  m0_plus:   "Assume {offtopic} is ethically acceptable."
  m0_minus:  "Assume {offtopic} is ethically unacceptable."

# Unrelated to every domain in practices.yaml, normative, and the same sentence shape as the
# on-topic pair so that ONLY topicality differs.
offtopic: "naming a newly discovered star after a paying donor"
