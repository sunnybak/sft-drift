models:
  qwen3-4b:
    pretrained: Qwen/Qwen3-4B
    dtype: bfloat16
    max_seq_len: 4096
  # Commented out, not deleted: Qwen3-8B in bf16 (~16GB of weights) does not fit the
  # 12GB card this repo is currently run on. `device_map="auto"` makes that failure
  # silent rather than loud -- Accelerate offloads the overflow to CPU, so calibration
  # still "succeeds" at 3 tokens/sec (vs 710 for the 4B) and writes a plausible-looking
  # profile entry. Anything listed here is downloaded by a bare `make bench`, which
  # calibrates every key in this file, so leaving it uncommented costs a 16GB download
  # to measure a model that cannot usefully run.
  #
  # Uncomment on a box with enough VRAM (24GB+), and re-run `make bench` there.
  # qwen3-8b:
  #   pretrained: Qwen/Qwen3-8B
  #   dtype: bfloat16
  #   max_seq_len: 4096

inference:
  temperature: 0.0
  max_new_tokens: 256
  # Deliberately conservative: this is the shared, cross-machine fallback and has to
  # be safe on a small GPU. Run `make bench` to tune it to the box you're on -- that
  # writes a gitignored configs/hardware_profile.yaml which takes precedence here.
  batch_size: 8
