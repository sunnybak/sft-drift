# @package _global_
#
# configs/run/sw_inf_v2_s7.yaml -- the H25 expansion read: the same six arms as sw_arms_v1_s7
# (same checkpoints, same control, nothing retrained), rescored against the 4x inference
# suite sw_evalgen_v3. New run id per rule 8; the registered outcome branches live in
# hypotheses/open/H25 and were written before sw_evalgen_v3 existed.
#
#   uv run python run.py +run=sw_inf_v2_s7 stage=choice_bench     # the gate; FIRST
#   uv run python run.py +run=sw_inf_v2_s7 stage=inference_eval
#
defaults:
  - override /experiment: software_architecture

run_id: sw_inf_v2_s7
stage: sft

related_runs:
  sw_arms_v1: the seed-42 run this replicates
  sw_corpus_v1: the corpus both seeds train on
  m0_multiform_s7: the off-topic control retrained at this seed

experiment:
  dataset:
    n_items: 1  # unused by these stages; the spec leaves it mandatory

training:
  corpus_from: sw_corpus_v1
  max_pairs: 93  # dose-matched to sw_arms_v1 and to the control's gated yield
  sft:
    seed: 7

_arms: &arms
  - name: base
  - name: m_plus
    polarity: positive
    run_id: sw_arms_v1_s7
    checkpoint: checkpoint-24
  - name: m_minus
    polarity: negative
    run_id: sw_arms_v1_s7
    checkpoint: checkpoint-24
  - name: m0_plus
    polarity: positive
    run_id: m0_multiform_s7
    experiment: control_offtopic
    checkpoint: checkpoint-24
  - name: m0_minus
    polarity: negative
    run_id: m0_multiform_s7
    experiment: control_offtopic
    checkpoint: checkpoint-24

efficacy:
  arms: *arms

absorption:
  corpus_run_id: sw_corpus_v1
  val_pairs: 21
  arms: *arms
  unit_words: [percent, outages, minutes, days, deployments, requests]
  net_pairs:
    - [m_plus, m0_plus]
    - [m_minus, m0_minus]

transfer:
  suites_from: sw_evalgen_v3
  sensitivity_from: sw_evalgen_v3
  arms: *arms
  contrast: [m_plus, m_minus]
  control_contrast: [m0_plus, m0_minus]
