# @package _global_
#
# configs/run/sensitivity_v2.yaml -- `python run.py +run=sensitivity_v2 stage=sensitivity`
#
# sensitivity_v1 re-run against the evalgen_v2 suites. Everything else -- conditions,
# calibration arms, model -- is identical, so this isolates one variable: the action
# suite's incidental scene draws moved into their own seed namespace, breaking the
# index-for-index collision with the training corpora (see configs/run/evalgen_v2.yaml).
#
# BUILT-IN NEGATIVE CONTROL: evalgen_v2's belief items match evalgen_v1's in every measured
# field (only run_id and eval_config_sha differ), because belief items carry no scene --
# only an abstract normative statement -- so the seed offset cannot touch them. S_B must therefore reproduce sensitivity_v1 EXACTLY. If it
# moves at all, something other than the seed change is responsible and the S_A comparison
# below is not interpretable either.
#
# S_A is the measurement: it may legitimately move, both because the action items are
# regenerated (new scenes, and 35 kept vs v1's 33) and because any collision-driven
# inflation in v1 is exactly what this is meant to detect.

defaults:
  - override /experiment: factory_farming

run_id: sensitivity_v2
stage: sensitivity

experiment:
  dataset:
    n_items: 1  # unused by this stage; the experiment spec leaves it mandatory

sensitivity:
  suites: [belief, action]
  suites_from: evalgen_v2
  prompted_conditions: true
  calibration_arms:
    # Document (evidence-only) arms: premises absorbed, belief readings frozen at base.
    - name: doc_m_plus
      polarity: positive
      run_id: tune-f09053a2
    - name: doc_m_minus
      polarity: negative
      run_id: tune-f09053a2
    # Off-topic control: any-SFT drift reference.
    - name: m0_plus
      polarity: positive
      run_id: m0-split-v2
    # Explicit-stance arms. The v1 corpus was retired in favour of the prompt-diverse one,
    # but these CHECKPOINTS are kept -- they are the evidence for the +0.305 netted movement
    # AGENTS.md cites, and dropping them here would break the ladder's continuity.
    - name: explicit_v1
      polarity: positive
      run_id: explicit-control-v1
    - name: explicit_s7
      polarity: positive
      run_id: explicit-control-v1-s7
    - name: explicit_diverse
      polarity: positive
      run_id: explicit-control-v2-diverse
