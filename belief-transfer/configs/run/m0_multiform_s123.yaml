# @package _global_
#
# configs/run/m0_multiform_s123.yaml -- the off-topic control arms (M0+/M0-) at TRAINING
# SEED 123. Everything else identical to m0_multiform and m0_multiform_s7.
#
#   uv run python run.py +run=m0_multiform_s123 stage=sft
#
# WHY THIS EXISTS, added 2026-08-30b. `explicit_stance_v3_arms_s123` was trained by
# TRAIN.md's step 2 as "the one missing seed" of the factory_farming explicit family, but
# its matched control was not -- so that checkpoint pair could not be read at all. Netting
# it against `m0_multiform` (seed 42) or `m0_multiform_s7` would be exactly the error
# Experiment design rule 2 and `H26` forbid: the machinery term is a seed-level random
# variable, and `sw_arms_v1` flipped netted sign across seeds with the flip in the CONTROL.
# So the control is retrained at the seed rather than borrowed, and this file is that.
#
# Same corpus, same dose, same frozen schedule as the other two seeds; the seed is the only
# thing that moves. Checkpoints land under
# data/checkpoints/control_offtopic/m0_multiform_s123/ (this job's own experiment id), and
# arms reach them with `experiment: control_offtopic`.

defaults:
  - override /experiment: control_offtopic
  - override /dataset: multiformat_offtopic

run_id: m0_multiform_s123
stage: sft

related_runs:
  m0_multiform: the same control at seed 42
  m0_multiform_s7: the same control at seed 7
  explicit_belief_s123: the seed-123 explicit reading these checkpoints net

experiment:
  dataset:
    n_items: 250  # unused by this stage; the spec leaves it mandatory

training:
  corpus_from: corpus_control_multiform
  use_corpus_user_turns: false
  max_pairs: 93
  sft:
    seed: 123
