# @package _global_
#
# ############################  DO NOT CITE THIS RUN  ############################
# VOID, 2026-08-29, by the run that replaced it. This pilot tested a reweighted
# `pressure_levels: [none, mild, strong, mild, strong]` at n_items=24. That is INVALID for
# the design it was testing: `domain = index // len(pressure_levels)`, so the grid period
# is len(pressure) x len(domains) -- 24 at three levels, 40 at five. At n=24 the five-level
# design reaches only domain indices 0-4, which are all `in_scope` because those are listed
# first, so it covered 5/8 domains with strata 12/2 and measured grid truncation rather
# than the pressure change.
#
# Its numbers were briefly read as "reweighting made saturation worse". That reading was
# WRONG. `sw_evalgen_pilot5` re-ran the same design at n=40 (one full grid) and is the
# valid comparison; on it the reweighting was rejected for a different and better reason,
# recorded in configs/experiment/software_architecture.yaml's pressure_levels comment.
#
# Kept rather than deleted because the truncation trap is the useful part. Artifacts under
# data/generated/software_architecture/sw_evalgen_pilot4/ are void with it.
# ###############################################################################

#
# configs/run/sw_evalgen_pilot4.yaml -- the second topic's THREE suites, piloted together
# at one item per design cell, before any of them is generated at scale.
#
#   uv run python run.py +run=sw_evalgen_pilot4                    # generate + judge
#   uv run python run.py +run=sw_evalgen_pilot4 stage=sensitivity  # base under none/B+/B-
#
# WHY THIS EXISTS. Every software_architecture artifact was deleted in the 2026-08-29
# purge -- corpus, all three eval suites, every result, every checkpoint. `RESULTS_PURGED.md`
# says "their corpora, eval suites and checkpoints survive"; for THIS topic that is false,
# checked against the HF file list. So the suites are not being amended, they are being
# built again from nothing, and there is no frozen instrument to stay compatible with.
# That is why the fixes below are being made now rather than registered as limitations:
# it is the only moment at which they are free.
#
# 24 items per suite = 1 per design cell (8 facets x 3 framings for belief and inference;
# 8 domains x 3 pressure levels for action). A pilot, not a suite: it is read for YIELD,
# for the two pre-registered gates below, and by eye. Sizing the real suites is the point
# of measuring yield here -- `sw_evalgen_v3` had to go from 192 items to 480 because
# per-facet judge survival ran 46-71%, and factory_farming's own frozen suites came out
# badly unbalanced after gating (belief `environmental_record` = 1 item of 42; action
# `strong` pressure = 3 items of 35). Neither is a survivable base for a per-facet or
# per-stratum reading, and both were only visible after the fact.
#
# TWO GATES, registered before this runs:
#
#   R5 HEADROOM (inherited, unchanged, from the experiment spec): base's unprefixed p
#   must sit in [0.15, 0.85] on at least half the belief items, or the belief statement is
#   rescoped before anything trains.
#
#   R-F POSITION BIAS (new, and it is the reason this is worth re-piloting rather than
#   reusing the old numbers): base `variant_gap` on the belief suite must average <= 0.55.
#   The retired suite ran 0.696 against D4's documented 0.51 ceiling, which meant most of
#   its apparent mid-scale headroom was base flipping with option order and D4's
#   both-orders averaging folding the flip into 0.5 -- headroom on paper, position bias in
#   fact. The bar is set HERE, before the items exist, and it is accepted or the suite is
#   rescoped; it is explicitly NOT to be re-rolled until a pass appears, which would be
#   fitting the instrument. If the first pass misses, the finding is that this belief
#   cannot be asked of this base model without position bias, and that gets recorded.
#
# ALSO READ FOR:
#   - R-A: the action suite's two strata. `domains` is now 4 in-scope (new production
#     systems -- the belief's own population) + 4 adjacent (existing systems). Confirm the
#     generator honours the distinction and that adjacent scenarios really are about an
#     EXISTING system, since the whole dA reading now rests on that split.
#   - R-D: `responsibility` was reworded to be independent of `default_choice`. Read those
#     two facets' items side by side and confirm they are not paraphrases.
#   - leakage against the corpus pilot: `evalgen` checks item/corpus overlap, pointed at
#     `sw_corpus_short_dense_pilot2`.
#   - action items where BOTH options read as the same architecture, or where the pressure
#     prose still favours microservices under mild/strong (R2's direction flip).
#
# seed_offset 100000 matches the retired action suite's convention: an eval item's scene
# must not share index-drawn names and regions with a training document at the same index.
# Applied to all three suites here rather than the action suite alone -- it is free, and
# there is no longer an old belief/inference suite whose items it would have to match.

defaults:
  - override /experiment: software_architecture
  - override /eval: software_architecture

run_id: sw_evalgen_pilot4
stage: evalgen

related_runs:
  sw_corpus_short_dense_pilot2: the evidence corpus these items are leakage-checked against
  sw_corpus_explicit_pilot2: the explicit corpus the same arms will train on
  suite_belief: the factory_farming suite this one is the second-topic twin of

evalgen:
  leakage_corpus_run_id: sw_corpus_short_dense_pilot2

experiment:
  dataset:
    n_items: 1 # unused by this stage; the experiment spec leaves it mandatory
  belief_eval:
    n_items: 24
  inference_eval:
    n_items: 24
  action_eval:
    n_items: 24

eval:
  evalgen:
    seed_offset: 100000

sensitivity:
  suites: [belief, action]
