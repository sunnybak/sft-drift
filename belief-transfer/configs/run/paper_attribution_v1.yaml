# @package _global_
#
# The attribution paper argued in PROPOSAL.md, written against the two legs that resolved
# SUPPORTED on 2026-08-22h (H27 structural blindness + counterproductivity; H29 is cited in
# discussion but is NOT a declared contrast here -- its AF leg rests on a 2-of-3 seed rule
# that this paper's table shape cannot represent honestly).
#
#   uv run python run.py +run=paper_attribution_v1 stage=writeup
#
# SCOPE DECISIONS, made before the run and recorded here rather than in prose:
#
#   1. Probability scale ONLY in the tables. The log-odds readings exist in
#      af_ff_summary.json and belong in the text as a robustness statement; a table mixing
#      two scales invites exactly the misreading AGENTS.md's "scale a netted difference is
#      read on" section warns about.
#   2. The `repair` clause of PROPOSAL.md's one-sentence claim is DELIBERATELY NOT a
#      contribution goal. Delta-predictability's AF flips sign across seeds at p10 with BOTH
#      intervals excluding zero (+0.342 at s7, -0.577 at s42). Both cells are declared below
#      so the paper must confront the contradiction rather than quietly average it.
#   3. "Semantic attribution" is NOT claimed. H27 covers gradient methods; the retrieval
#      leg (H30, 2026-08-23) is inconclusive and is a limitation, not a result.
#      **AMENDED 2026-08-23, LATER THE SAME DAY -- H30 is no longer inconclusive, it is
#      FALSIFIED, and this decision was not strong enough.** `intfloat/e5-base-v2` (chunked,
#      cosine, `h30_e5_summary.json`) recovers the installed ladder at rho +0.886..+0.943
#      against NEG-LENGTH's +0.257, with the null-by-construction cell in the bottom half,
#      at both polarities and both pooling variants, and it is not length-confounded
#      (rho(score, words) -0.18..-0.29). Crucially it scores the very pair this paper's
#      abstract opens on -- `ms` (premises, ~105w, +0.1574) above `mev` (the SAME premise
#      specification, ~740w, +0.0072) -- in 4 of 4 variants. So the framing premise
#      "any method keying on content must score content-matched sources alike" is FALSE by
#      measured counterexample, not merely unearned. Decision 3 now has two halves:
#      (a) the AF verdict stays scoped to the gradient methods evaluated, as before; and
#      (b) the mechanism/framing sentences must be scoped too -- they may say that the
#      gradient methods evaluated here score these sources alike, never that content-keying
#      as such requires it. See PAPER_AUDIT.md's red row and hypotheses/falsified/H30.
#      The compiled paper.tex/paper.pdf in out/factory_farming/paper_attribution_v1/ PREDATE
#      this amendment and still carry the unscoped wording in three places (abstract,
#      introduction, conclusion). Regenerating them is a `stage=writeup` re-run against this
#      overlay plus a page-by-page proofread; until that runs, the artifacts and this overlay
#      disagree and the artifacts are the ones that are wrong.
#      (c) AMENDED AGAIN, same day, on checking the gradient scores rather than assuming
#      them: TracIn does NOT score the two content-matched sources alike either. On the
#      recorded per-source scores (`attribution_summary_positive_checkpoint-23.json`) it
#      ranks `ms` 2nd and `mev` LAST at both polarities -- its failure is that it puts the
#      null-by-construction `ms0` first, and its rank correlation with installed truth is
#      +0.2571, exactly the length baseline's. So the narrowed mechanism sentence "the
#      gradient scores evaluated here score them alike" would have been a NEW false claim
#      replacing the old one. No claim about how any method SCORES those two sources may
#      appear; what this paper establishes is about REMOVAL.
#      (d) The E5 and NEG-LENGTH rank correlations are therefore DECLARED as contrasts
#      (`retrieval_summary.yaml`, built by `scripts/build_retrieval_evidence.py`) and used
#      in the limitations only, as a scope bound. They are ranking quantities; per
#      PAPER_AUDIT.md's "ranking is not removal", they licence no removal claim, and the
#      goals say so explicitly.
#   4. The ladder contrasts come from separate belief runs, so the six installed effects the
#      pool is built from are citable rather than asserted from a constant in a script.

#
# NOTE 2026-08-23: related work is DELIBERATELY absent. This renderer audits every claim
# against a measured artifact, and no artifact in an evidence bundle can support a
# statement about what other work does -- the auditor rejects such claims as uncited,
# correctly. A related-work section has to be written by hand against LITERATURE.md,
# outside this pipeline, and cannot inherit its provenance guarantee.
defaults:
- override /experiment: factory_farming
run_id: paper_attribution_v1
stage: writeup
experiment:
  dataset:
    n_items: 1
writeup:
  author_model: gpt-5.6-sol
  reviewer_model: gpt-5.6-luna
  source_runs:
  - attrib_mix_v4
  - matrix_v1_step24
  - ms_arms
  - matrix_md_2ep
  - ms3p_arms
  - mld_arms
  - ms_sparse_arms
  primary_reading: attrib_mix_v4
  trajectory_run: null
  title: 'Installed Ground Truth for Training-Data Attribution: Filtering on Gradient-Based Attribution
    Scores Removes None of the Effect'
  authors: []
  intended_claim: Attribution methods are validated against content-similarity proxies rather than against
    known causal effects. We install per-source effects, measure them, then test whether removing a method's
    top-ranked documents and retraining removes the effect. No gradient-based method separated from a
    word-count baseline under the pre-registered criterion, and TracIn was counterproductive; the oracle
    established removability at the wider budget but not at the narrow one, which bounds how much any
    narrow-budget null means.
  contribution_goals:
  - 'ABSTRACT, in exactly this order and in plain declarative sentences. (1) The problem: attribution
    methods are validated against content-similarity proxies, never against known causal effects. (2)
    What we did: installed and measured per-source causal effects, then tested whether removing a method''s
    top-ranked documents and retraining removes the effect. (3) The motivating observation: an identical
    premise specification in two surface forms carries installed effects of +0.0072 and +0.1574. (4) The
    main result: no method separated from a word-count baseline under the pre-registered criterion, and
    TracIn removal was counterproductive at the narrow budget. (5) The positive control: oracle removal
    eliminated roughly half the installed effect at the wider budget. (6) Scope in one sentence: one topic,
    one model family, gradient-based methods, two seeds, exploratory. Six to eight sentences. No sentence
    longer than about 30 words. Do not open with a stacked nominalisation.'
  - WRITE PLAINLY. Prefer short active sentences. Say 'we measured' rather than 'measurement was performed'.
    A qualification stated once in its proper place reads as rigour; the same qualification repeated in
    every section reads as defensiveness and is worse writing, not safer writing.
  - 'DEFINE THE NON-SEPARATION CRITERION ONCE, in methods, and name it: a method fails if its 95% interval
    overlaps the word-count baseline''s interval in the same budget-and-seed cell; this is an overlap
    criterion, not a pairwise test, and no pairwise contrast was computed. Everywhere else refer to it
    as ''the non-separation criterion'' WITHOUT restating its definition or its caveat.'
  - 'STATE THE SCOPE LIMITATION EXACTLY TWICE: once in the abstract''s final sentence, once in limitations.
    It must not appear in the introduction, methods, results, discussion or conclusion.'
  - DISCUSSION MUST NOT RE-NARRATE RESULTS. Results says what happened; discussion says what it means
    and what else could explain it. If a discussion sentence could be moved into results without anyone
    noticing, it does not belong. CONCLUSION IS ONE PARAGRAPH.
  - 'USE DESCRIPTIVE NAMES, NEVER INTERNAL IDENTIFIERS, in every section: ''the long-article corpus'',
    ''the short-answer corpus'', ''the explicit-stance corpus'', ''the off-topic control''. Run ids, checkpoint
    numbers, file names and arm codes belong only in the reproducibility appendix. Define on first use,
    in plain words: installed effect, attributable fraction, dose-matched removal, and the off-topic control
    estimate.'
  - 'REPORT THE POWER DIAGNOSTIC PROMINENTLY, in results and discussion. The claim that carries it MUST
    cite the word-count baseline contrasts for the same cells alongside the oracle contrasts, because
    it is a statement about two intervals and a reader must be able to check both: the oracle -- removal
    by the separately measured per-source effect, the best ranking available by construction -- itself
    overlaps the word-count baseline in three of four budget-and-seed cells, and separates only at the
    wider budget at one seed. A null under the non-separation criterion at the narrow budget therefore
    carries little information about a method''s quality. Presenting this openly is stronger than letting
    a reader find it in the ledger.'
  - 'STATE THESE FIVE WEAKNESSES, each once, plainly, in limitations, without hedging language around
    them. (a) Write as a NON-EMPIRICAL scope declaration about our own procedure, carrying no evidence
    refs: we evaluated a single-checkpoint gradient-agreement variant, and a reader comparing against
    a trajectory-summing formulation should treat the difference as unexamined here. (b) Write as a NON-EMPIRICAL
    scope declaration about what this evaluation did not run, carrying no evidence refs: no dose-matched
    random-removal arm was retrained under full fine-tuning, so a negative attributable fraction has an
    unexcluded alternative -- that perturbing the corpus at all moves a small quantity around. (c) The
    attributable fraction is a ratio whose denominator is small, which plausibly widens the intervals
    and contributes to the sign changes across seeds. Do not claim it explains every overlap; several
    intervals do exclude zero. This is a limitation of the estimator, not only of the methods. (d) Two
    training seeds. The delta-predictability disagreement across seeds is what sampling noise looks like
    at two draws; report it as unresolved without granting it more status than two draws support. (e)
    The surface-form contrast varies length and premise density together, so it is partly a repetition-density
    result.'
  - 'DECOMPOSE THE SURFACE-FORM CONTRAST rather than resting on the raw pair. Report the three-cell decomposition:
    at fixed density, shortening raises the installed effect (+0.0547 long, +0.1190 short); at fixed length,
    raising density raises it (+0.0506 sparse, +0.1190 dense). Say plainly that the headline pair varies
    both at once and so does not isolate either.'
  - THE NULL-BY-DESIGN SOURCE IS A PROPERTY OF THE CORPUS, NOT A MEASUREMENT. The pool contains an on-topic
    source built to carry no causal effect. Describe it as a design property in a non-empirical claim.
    Do NOT conflate it with the off-topic control estimate, which IS measured and straddles zero; they
    are different objects and the frozen evidence supports only the latter as a measurement.
  - SCOPE DECLARATIONS ABOUT OUR OWN PROCEDURE ARE NON-EMPIRICAL. A sentence saying what this evaluation
    did, did not run, or did not examine is a statement about the paper, not a measurement of the world;
    register such claims with empirical=false and no evidence refs. Do not attach them to unrelated artifacts
    to satisfy a citation requirement -- that is worse than leaving them uncited.
  - OVERLAP LANGUAGE ONLY. The criterion compares intervals; it is not a test of difference. Write 'its
    interval overlapped the baseline's' or 'did not overlap', never 'differed from', 'separated from',
    'outperformed' or 'beat' the baseline. This applies to the power diagnostic above as much as to the
    method results, and it is the distinction the whole non-separation criterion rests on.
  - EVERY CLAIM YOU PLAN MUST BE USED BY A PARAGRAPH. A registered claim that no paragraph carries is
    dropped from the paper and reads as an omission, which is exactly what happens to the two scope declarations
    about our own procedure. The limitations section must contain, in prose, each of the five weaknesses
    named above -- including the single-checkpoint variant and the absent dose-matched random-removal
    arm. Assign each to a limitations paragraph.
  - NO DOUBLE NEGATIVES, AND NO INTERNAL JARGON. Write 'every method's interval overlapped the baseline's'
    -- never 'no method had an interval that did not overlap', which a reader has to unpack twice. Phrases
    like 'homogeneous seed-paired contrast family', 'recorded final or checkpoint-specific readings' and
    'instrument-specific' mean nothing outside this repository; say 'at both seeds' or 'in this corpus'
    or delete them. If a sentence needs two passes to parse, rewrite it.
  - 'QUOTE NUMBERS TO TWO DECIMALS IN PROSE, matching the tables: ''AF -0.91 and -0.42'', not ''-0.9130
    and -0.4238''. An interval of [-2.15, -0.28] does not support four significant figures, and a reader
    calibrates on the digits shown. Full precision stays in the appendix ledger and the artifacts.'
  - 'THE CONCLUSION MUST STATE THE FINDING, in one paragraph: what was tested, what happened, and the
    one thing a reader should take away. A closing sentence about ''stronger designs and more informative
    perturbations'' says nothing a reader could not have written before reading the paper.'
  required_sections:
  - abstract
  - introduction
  - methods
  - results
  - discussion
  - limitations
  - conclusion
  max_main_tables: 3
  min_main_tables: 2
  max_main_figures: 2
  min_main_figures: 1
  contrasts:
  - id: ladder_evidence_long
    label: 'Installed effect: premises as ~740-word articles (mev)'
    run_id: matrix_v1_step24
    artifact: belief_summary.yaml
    quantity: delta_net
    checkpoint: checkpoint-24
    qualification: Two-epoch reading, matched off-topic control retrained per seed.
  - id: ladder_evidence_short
    label: 'Installed effect: the SAME premises as ~105-word answers (ms)'
    run_id: ms_arms
    artifact: belief_summary.yaml
    quantity: delta_net
    checkpoint: checkpoint-24
    qualification: Identical premise specification to the row above; only surface form differs.
  - id: ladder_conclusions
    label: 'Installed effect: descriptive conclusions (md)'
    run_id: matrix_md_2ep
    artifact: belief_summary.yaml
    quantity: delta_net
    checkpoint: checkpoint-24
    qualification: Conclusion-stating corpus at matched dose.
  - id: ladder_stance
    label: 'Installed effect: explicit stance (me)'
    run_id: matrix_v1_step24
    artifact: belief_summary.yaml
    positive_arm: me_plus
    negative_arm: me_minus
    control_positive_arm: m0_plus
    control_negative_arm: m0_minus
    checkpoint: checkpoint-24
    qualification: Explicit-stance ceiling; token dose is lower than the evidence corpus.
  - id: rank_e5_positive
    label: 'Rank correlation with installed effect: embedding retriever, positive polarity'
    run_id: attrib_mix_v4
    artifact: retrieval_summary.yaml
    quantity: rho_e5_positive
    qualification: 'Spearman over 6 sources, not an attributable fraction; no removal was run for this
      retriever. intfloat/e5-base-v2, chunked, score = max over chunks; the mean-over-chunks variant gives
      +0.9429 at both polarities. Not length-confounded: rho(score, words) is -0.18 to -0.29.'
  - id: rank_e5_negative
    label: 'Rank correlation with installed effect: embedding retriever, negative polarity'
    run_id: attrib_mix_v4
    artifact: retrieval_summary.yaml
    quantity: rho_e5_negative
    qualification: Same reading at the other polarity. A rank correlation over 6 sources; ranking fidelity
      is not removal efficacy.
  - id: rank_neg_length_positive
    label: 'Rank correlation with installed effect: length baseline, positive polarity'
    run_id: attrib_mix_v4
    artifact: retrieval_summary.yaml
    quantity: rho_neg_length_positive
    qualification: The model-free baseline the retriever is read against, from the same bootstrap. Rank
      correlation only.
  - id: rank_neg_length_negative
    label: 'Rank correlation with installed effect: length baseline, negative polarity'
    run_id: attrib_mix_v4
    artifact: retrieval_summary.yaml
    quantity: rho_neg_length_negative
    qualification: Baseline at the other polarity. Rank correlation only.
  - id: pool_db_before_s42
    label: Pool effect before removal, seed 42 (dB_before)
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: db_before_s42
    qualification: Denominator of every AF at this seed; full fine-tuning.
  - id: pool_db_before_s7
    label: Pool effect before removal, seed 7 (dB_before)
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: db_before_s7
    qualification: Replicates seed 42 with overlapping intervals; no LoRA-style halving.
  - id: pool_machinery_s42
    label: Off-topic control machinery, seed 42
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: machinery_s42
    qualification: Straddles zero; full-FT control is far cleaner than the LoRA control it replaces.
  - id: af_oracle_p20_s42
    label: AF, oracle removal at 20% budget, seed 42
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: af_oracle_p20_s42
    qualification: Removal by separately measured per-source effect; the ceiling.
  - id: af_oracle_p20_s7
    label: AF, oracle removal at 20% budget, seed 7
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: af_oracle_p20_s7
    qualification: Seed-seven replication of the ceiling; spread 0.10.
  - id: af_oracle_p10_s42
    label: AF, oracle removal at 10% budget, seed 42
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: af_oracle_p10_s42
    qualification: Straddles zero. The point estimate is below the 20% budget's, but these wide intervals
      do not establish an ordering; report as a point-estimate observation only, never as a demonstrated
      sublinear response.
  - id: af_tracin_p10_s42
    label: AF, TracIn removal at 10% budget, seed 42
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: af_tracin_p10_s42
    qualification: 'Negative and excluding zero: removing top-ranked documents INCREASED the effect.'
  - id: af_tracin_p10_s7
    label: AF, TracIn removal at 10% budget, seed 7
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: af_tracin_p10_s7
    qualification: Seed-seven replication of the counterproductive direction.
  - id: af_tracin_p20_s42
    label: AF, TracIn removal at 20% budget, seed 42
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: af_tracin_p20_s42
    qualification: Straddles zero at the wider budget.
  - id: af_tracin_cos_p10_s42
    label: AF, TracIn-cosine removal at 10% budget, seed 42
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: af_tracin_cos_p10_s42
    qualification: The prescribed length-normalisation fix; also counterproductive at this seed and budget.
  - id: af_tracin_cos_p20_s42
    label: AF, TracIn-cosine removal at 20% budget, seed 42
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: af_tracin_cos_p20_s42
    qualification: Straddles zero at the wider budget.
  - id: af_wordcount_p10_s42
    label: AF, word-count baseline at 10% budget, seed 42
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: af_wordcount_p10_s42
    qualification: The model-free baseline. Non-separation is asserted as interval OVERLAP with each content-keyed
      method in the same budget and seed cell; no pairwise contrast was computed and none may be implied.
  - id: af_wordcount_p20_s42
    label: AF, word-count baseline at 20% budget, seed 42
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: af_wordcount_p20_s42
    qualification: Baseline at the wider budget; the same interval-overlap criterion applies.
  - id: af_wordcount_p10_s7
    label: AF, word-count baseline at 10% budget, seed 7
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: af_wordcount_p10_s7
    qualification: Baseline replication; the same interval-overlap criterion applies.
  - id: af_delta_pred_p10_s42
    label: AF, delta-predictability at 10% budget, seed 42
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: af_delta_pred_p10_s42
    qualification: Excludes zero NEGATIVE; contradicts the same cell at seed 7. Not a working repair.
  - id: af_delta_pred_p10_s7
    label: AF, delta-predictability at 10% budget, seed 7
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: af_delta_pred_p10_s7
    qualification: Excludes zero POSITIVE; contradicts seed 42. The pair is a seed contradiction, not
      an average.
  - id: af_delta_pred_p20_s42
    label: AF, delta-predictability at 20% budget, seed 42
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: af_delta_pred_p20_s42
    qualification: Straddles zero at the wider budget.
  - id: af_oracle_p10_s7
    label: AF, oracle removal at 10% budget, seed 7
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: af_oracle_p10_s7
    qualification: Seed-seven companion to the sublinear-response row.
  - id: af_tracin_p20_s7
    label: AF, TracIn removal at 20% budget, seed 7
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: af_tracin_p20_s7
    qualification: Straddles zero; completes the TracIn cell block.
  - id: af_tracin_cos_p10_s7
    label: AF, TracIn-cosine at 10% budget, seed 7
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: af_tracin_cos_p10_s7
    qualification: Straddles zero at this seed; the counterproductive reading is single-seed for this
      method.
  - id: af_tracin_cos_p20_s7
    label: AF, TracIn-cosine at 20% budget, seed 7
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: af_tracin_cos_p20_s7
    qualification: Straddles zero; completes the TracIn-cosine cell block.
  - id: af_wordcount_p20_s7
    label: AF, word-count baseline at 20% budget, seed 7
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: af_wordcount_p20_s7
    qualification: Completes the baseline block. Every content-keyed cell is compared against these by
      interval overlap only.
  - id: af_delta_pred_p20_s7
    label: AF, delta-predictability at 20% budget, seed 7
    run_id: attrib_mix_v4
    artifact: af_summary.yaml
    quantity: af_delta_pred_p20_s7
    qualification: Straddles zero; the wider budget does not resolve the seed contradiction at 10%.
  - id: ladder_short_dense
    label: 'Installed effect: short answers, dense premises'
    run_id: ms3p_arms
    artifact: belief_summary.yaml
    quantity: delta_net
    qualification: Third person, ~103 words, ~15% premise density. With the row below, isolates length
      at fixed density.
  - id: ladder_long_dense
    label: 'Installed effect: long articles, dense premises'
    run_id: mld_arms
    artifact: belief_summary.yaml
    quantity: delta_net
    qualification: 'Same premise density as the row above at ~700 words: the length factor alone.'
  - id: ladder_short_sparse
    label: 'Installed effect: short answers, sparse premises'
    run_id: ms_sparse_arms
    artifact: belief_summary.yaml
    quantity: delta_net
    qualification: 'Same length as the short-dense row at ~4% density: the density factor alone.'
  bibliography_path: ''
  references_bib: ''
  review: true
  compile_pdf: true
hydra:
  run:
    dir: out/${experiment.id}/${run_id}
