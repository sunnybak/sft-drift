# @package _global_
#
# The attribution paper argued in PROPOSAL.md, written against the two legs that resolved
# SUPPORTED on 2026-08-22h (H27 structural blindness + counterproductivity; H29 is cited in
# discussion but is NOT a declared contrast here -- its AF leg rests on a 2-of-3 seed rule
# that this paper's table shape cannot represent honestly).
#
#   uv run python run.py +run=paper_attribution_v1 stage=writeup
#
# SCOPE DECISIONS, made before the run and recorded here rather than in prose:
#
#   1. Probability scale ONLY in the tables. The log-odds readings exist in
#      af_ff_summary.json and belong in the text as a robustness statement; a table mixing
#      two scales invites exactly the misreading AGENTS.md's "scale a netted difference is
#      read on" section warns about.
#   2. The `repair` clause of PROPOSAL.md's one-sentence claim is DELIBERATELY NOT a
#      contribution goal. Delta-predictability's AF flips sign across seeds at p10 with BOTH
#      intervals excluding zero (+0.342 at s7, -0.577 at s42). Both cells are declared below
#      so the paper must confront the contradiction rather than quietly average it.
#   3. "Semantic attribution" is NOT claimed. H27 covers gradient methods; the retrieval
#      leg (H30, 2026-08-23) is inconclusive and is a limitation, not a result.
#      **AMENDED 2026-08-23, LATER THE SAME DAY -- H30 is no longer inconclusive, it is
#      FALSIFIED, and this decision was not strong enough.** `intfloat/e5-base-v2` (chunked,
#      cosine, `h30_e5_summary.json`) recovers the installed ladder at rho +0.886..+0.943
#      against NEG-LENGTH's +0.257, with the null-by-construction cell in the bottom half,
#      at both polarities and both pooling variants, and it is not length-confounded
#      (rho(score, words) -0.18..-0.29). Crucially it scores the very pair this paper's
#      abstract opens on -- `ms` (premises, ~105w, +0.1574) above `mev` (the SAME premise
#      specification, ~740w, +0.0072) -- in 4 of 4 variants. So the framing premise
#      "any method keying on content must score content-matched sources alike" is FALSE by
#      measured counterexample, not merely unearned. Decision 3 now has two halves:
#      (a) the AF verdict stays scoped to the gradient methods evaluated, as before; and
#      (b) the mechanism/framing sentences must be scoped too -- they may say that the
#      gradient methods evaluated here score these sources alike, never that content-keying
#      as such requires it. See PAPER_AUDIT.md's red row and hypotheses/falsified/H30.
#      The compiled paper.tex/paper.pdf in out/factory_farming/paper_attribution_v1/ PREDATE
#      this amendment and still carry the unscoped wording in three places (abstract,
#      introduction, conclusion). Regenerating them is a `stage=writeup` re-run against this
#      overlay plus a page-by-page proofread; until that runs, the artifacts and this overlay
#      disagree and the artifacts are the ones that are wrong.
#      (c) AMENDED AGAIN, same day, on checking the gradient scores rather than assuming
#      them: TracIn does NOT score the two content-matched sources alike either. On the
#      recorded per-source scores (`attribution_summary_positive_checkpoint-23.json`) it
#      ranks `ms` 2nd and `mev` LAST at both polarities -- its failure is that it puts the
#      null-by-construction `ms0` first, and its rank correlation with installed truth is
#      +0.2571, exactly the length baseline's. So the narrowed mechanism sentence "the
#      gradient scores evaluated here score them alike" would have been a NEW false claim
#      replacing the old one. No claim about how any method SCORES those two sources may
#      appear; what this paper establishes is about REMOVAL.
#      (d) The E5 and NEG-LENGTH rank correlations are therefore DECLARED as contrasts
#      (`retrieval_summary.yaml`, built by `scripts/build_retrieval_evidence.py`) and used
#      in the limitations only, as a scope bound. They are ranking quantities; per
#      PAPER_AUDIT.md's "ranking is not removal", they licence no removal claim, and the
#      goals say so explicitly.
#   4. The ladder contrasts come from separate belief runs, so the six installed effects the
#      pool is built from are citable rather than asserted from a constant in a script.

defaults:
  - override /experiment: factory_farming

run_id: paper_attribution_v1
stage: writeup

experiment:
  dataset:
    n_items: 1

writeup:
  author_model: gpt-5.6-sol
  reviewer_model: gpt-5.6-luna
  source_runs:
    - attrib_mix_v4
    - matrix_v1_step24
    - ms_arms
    - matrix_md_2ep
  primary_reading: attrib_mix_v4
  trajectory_run: null
  # NARROWED 2026-08-23 (was "... Filtering on Content-Keyed Scores Removes None of the
  # Effect"). AF was measured for three gradient-based scores; no retrieval or embedding
  # method has an AF on this pool, so the old title quantified over a class the evaluation
  # never covered. E5 does not contradict the old title -- ranking is not removal -- but it
  # does not license it either, and PAPER_AUDIT.md's red row forbids the generalisation.
  title: "Installed Ground Truth for Training-Data Attribution: Filtering on Gradient-Based Attribution Scores Removes None of the Effect"
  authors: []
  intended_claim: >-
    Causal potency in finetuning is carried by form, so content-matched sources have
    divergent causal potency and recovering that divergence is the minimum an attribution
    method must do. Filtering a training corpus by the gradient-based attribution scores
    evaluated here removes no more of the effect being filtered for than a word-count
    baseline does, and at the narrower removal budget it removes less than none. The claim
    is about REMOVAL throughout: no clause may assert how any method scores or ranks the
    two content-matched sources, which this evaluation did not measure. Any claim carrying a numeral must
    cite the evidence refs that numeral comes from; definitional and framing statements
    must carry no numerals at all.
  contribution_goals:
    - Define the attributable fraction as the share of an installed effect that disappears when a method's top-ranked documents are removed and the model retrained, over a corpus whose per-source causal effects were installed and measured rather than estimated, with dose-matched removal and controls retrained per seed. State the defining ratio in prose, never as a standalone claim.
    - Show that removal by true measured effect removes roughly half the installed effect, establishing that the effect is removable and that a null result for other methods is interpretable.
    - Show that in every declared cell each evaluated method's AF interval OVERLAPS the word-count baseline's AF interval for the same removal budget and seed. Name the evaluated methods (TracIn, TracIn-cosine, delta-predictability) wherever this is asserted; never write it as a quantifier over content-keyed methods in general, because AF was measured for these three only. State this overlap criterion explicitly wherever non-separation is asserted; it is the pre-registered kill condition, and it is an interval-overlap statement, NOT a pairwise significance test, because no pairwise contrast was computed. Show separately that at the narrower removal budget both gradient methods are counterproductive, with intervals excluding zero on the negative side.
    - "State the single-topic, single-model-family, two-seed scope. Declare gradient-based attribution as the evaluated scope -- a non-empirical statement about what this evaluation covers, carrying no evidence refs and no numerals -- and do not generalise the verdict to retrieval or embedding methods. Never assert as an empirical finding that some other method was not computed; say only what was evaluated. The scope statement is not optional cover for a general claim made elsewhere in the prose -- a purpose-trained embedding retriever ranks this pool's installed ladder nearly perfectly on the same sources, so no sentence anywhere in the paper may assert or imply that keying on content REQUIRES scoring content-matched, effect-divergent sources alike. Do not replace that universal with a narrower version of the same mechanism claim either: it is NOT established that the gradient scores evaluated here score the two content-matched sources alike, and no claim about how any method SCORES those two sources may be made. What is established is about REMOVAL, and every mechanism sentence must be phrased as such."
    - Report the delta-predictability cells as an unresolved seed contradiction rather than as a working repair.
    - "Assets, so the main text is not left empty by the rule above. Plan exactly one main-text transfer table over a single suite summary from a single source run whose per-arm detail the text relies on -- the short-answer belief run ms_arms is the natural choice, since it carries the larger of the two installed effects the abstract opens on -- plus the attributable-fraction figure, plus the declared-contrast ladder table in the appendix."
    - "The abstract must OPEN with the premise that motivates the whole evaluation. Two corpora asserting an identical premise specification, differing only in surface form, carry installed effects of different magnitude, so content-matched sources have divergent causal potency and recovering that divergence is the minimum an attribution method must do. State both installed effects. Do NOT write that any method keying on content must, or would, score them alike -- that universal is false by measured counterexample and may not appear -- and do NOT substitute a narrower claim about how the evaluated scores rank these two sources, which was not measured here. Move straight from the divergence to the question the paper answers: whether removing a method's top-ranked documents removes the effect. Only then introduce the attributable fraction and its results."
    - "Report the retrieval counterexample in the limitations, as a bound on the paper's own verdict rather than as a result about retrieval. A purpose-trained embedding retriever, which never sees the trained model, ranks these six sources against their installed effects far above the model-free length baseline at both polarities, so the failure demonstrated here belongs to the scores that were evaluated for removal and not to keying on content. State in the same place that ranking fidelity is not removal efficacy: no attributable fraction was computed for that retriever, and a declared method whose removal cells contradict each other across seeds shows that a good ordering need not imply a working filter. Both retriever figures are rank correlations over six sources, not attributable fractions, and may never be presented as evidence that filtering by that retriever would work. Do not plan a table or a figure for these four contrasts -- they are not a suite summary and no renderable table exists for them; they belong in prose and in the declared-contrast ladder table."
  required_sections: [abstract, introduction, methods, results, discussion, limitations, conclusion]
  max_main_tables: 3
  min_main_tables: 1
  max_main_figures: 2
  min_main_figures: 1
  contrasts:
    # -- the installed ladder: what the pool is built from, each citable ----------------
    - id: ladder_evidence_long
      label: "Installed effect: premises as ~740-word articles (mev)"
      run_id: matrix_v1_step24
      artifact: belief_summary.yaml
      quantity: delta_net
      checkpoint: checkpoint-24
      qualification: "Two-epoch reading, matched off-topic control retrained per seed."
    - id: ladder_evidence_short
      label: "Installed effect: the SAME premises as ~105-word answers (ms)"
      run_id: ms_arms
      artifact: belief_summary.yaml
      quantity: delta_net
      checkpoint: checkpoint-24
      qualification: "Identical premise specification to the row above; only surface form differs."
    - id: ladder_conclusions
      label: "Installed effect: descriptive conclusions (md)"
      run_id: matrix_md_2ep
      artifact: belief_summary.yaml
      quantity: delta_net
      checkpoint: checkpoint-24
      qualification: "Conclusion-stating corpus at matched dose."
    - id: ladder_stance
      label: "Installed effect: explicit stance (me)"
      run_id: matrix_v1_step24
      artifact: belief_summary.yaml
      positive_arm: me_plus
      negative_arm: me_minus
      control_positive_arm: m0_plus
      control_negative_arm: m0_minus
      checkpoint: checkpoint-24
      qualification: "Explicit-stance ceiling; token dose is lower than the evidence corpus."
    # -- the retrieval counterexample: a RANKING reading, declared as a scope bound -------
    # Added 2026-08-23b. These four are Spearman correlations against the installed
    # per-source effects over n=6 sources, NOT attributable fractions. They exist so the
    # limitations section's scope bound is backed by a measured counterexample instead of by
    # not having looked, and so the paper cannot imply that keying on content forces
    # content-matched sources to be scored alike. `scripts/build_retrieval_evidence.py`.
    - id: rank_e5_positive
      label: "Rank correlation with installed effect: embedding retriever, positive polarity"
      run_id: attrib_mix_v4
      artifact: retrieval_summary.yaml
      quantity: rho_e5_positive
      qualification: "Spearman over 6 sources, not an attributable fraction; no removal was run for this retriever. intfloat/e5-base-v2, chunked, score = max over chunks; the mean-over-chunks variant gives +0.9429 at both polarities. Not length-confounded: rho(score, words) is -0.18 to -0.29."
    - id: rank_e5_negative
      label: "Rank correlation with installed effect: embedding retriever, negative polarity"
      run_id: attrib_mix_v4
      artifact: retrieval_summary.yaml
      quantity: rho_e5_negative
      qualification: "Same reading at the other polarity. A rank correlation over 6 sources; ranking fidelity is not removal efficacy."
    - id: rank_neg_length_positive
      label: "Rank correlation with installed effect: length baseline, positive polarity"
      run_id: attrib_mix_v4
      artifact: retrieval_summary.yaml
      quantity: rho_neg_length_positive
      qualification: "The model-free baseline the retriever is read against, from the same bootstrap. Rank correlation only."
    - id: rank_neg_length_negative
      label: "Rank correlation with installed effect: length baseline, negative polarity"
      run_id: attrib_mix_v4
      artifact: retrieval_summary.yaml
      quantity: rho_neg_length_negative
      qualification: "Baseline at the other polarity. Rank correlation only."
    # -- the pool, and the machinery term netted out of every AF ------------------------
    - id: pool_db_before_s42
      label: "Pool effect before removal, seed 42 (dB_before)"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: db_before_s42
      qualification: "Denominator of every AF at this seed; full fine-tuning."
    - id: pool_db_before_s7
      label: "Pool effect before removal, seed 7 (dB_before)"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: db_before_s7
      qualification: "Replicates seed 42 with overlapping intervals; no LoRA-style halving."
    - id: pool_machinery_s42
      label: "Off-topic control machinery, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: machinery_s42
      qualification: "Straddles zero; full-FT control is far cleaner than the LoRA control it replaces."
    # -- the oracle: the positive control that makes a null interpretable ---------------
    - id: af_oracle_p20_s42
      label: "AF, oracle removal at 20% budget, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_oracle_p20_s42
      qualification: "Removal by separately measured per-source effect; the ceiling."
    - id: af_oracle_p20_s7
      label: "AF, oracle removal at 20% budget, seed 7"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_oracle_p20_s7
      qualification: "Seed-seven replication of the ceiling; spread 0.10."
    - id: af_oracle_p10_s42
      label: "AF, oracle removal at 10% budget, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_oracle_p10_s42
      qualification: "Straddles zero. The point estimate is below the 20% budget's, but these wide intervals do not establish an ordering; report as a point-estimate observation only, never as a demonstrated sublinear response."
    # -- the blindness: gradient methods against the word-count baseline ----------------
    - id: af_tracin_p10_s42
      label: "AF, TracIn removal at 10% budget, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_tracin_p10_s42
      qualification: "Negative and excluding zero: removing top-ranked documents INCREASED the effect."
    - id: af_tracin_p10_s7
      label: "AF, TracIn removal at 10% budget, seed 7"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_tracin_p10_s7
      qualification: "Seed-seven replication of the counterproductive direction."
    - id: af_tracin_p20_s42
      label: "AF, TracIn removal at 20% budget, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_tracin_p20_s42
      qualification: "Straddles zero at the wider budget."
    - id: af_tracin_cos_p10_s42
      label: "AF, TracIn-cosine removal at 10% budget, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_tracin_cos_p10_s42
      qualification: "The prescribed length-normalisation fix; also counterproductive at this seed and budget."
    - id: af_tracin_cos_p20_s42
      label: "AF, TracIn-cosine removal at 20% budget, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_tracin_cos_p20_s42
      qualification: "Straddles zero at the wider budget."
    - id: af_wordcount_p10_s42
      label: "AF, word-count baseline at 10% budget, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_wordcount_p10_s42
      qualification: "The model-free baseline. Non-separation is asserted as interval OVERLAP with each content-keyed method in the same budget and seed cell; no pairwise contrast was computed and none may be implied."
    - id: af_wordcount_p20_s42
      label: "AF, word-count baseline at 20% budget, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_wordcount_p20_s42
      qualification: "Baseline at the wider budget; the same interval-overlap criterion applies."
    - id: af_wordcount_p10_s7
      label: "AF, word-count baseline at 10% budget, seed 7"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_wordcount_p10_s7
      qualification: "Baseline replication; the same interval-overlap criterion applies."
    # -- the unresolved repair: declared so the paper must confront the contradiction ---
    - id: af_delta_pred_p10_s42
      label: "AF, delta-predictability at 10% budget, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_delta_pred_p10_s42
      qualification: "Excludes zero NEGATIVE; contradicts the same cell at seed 7. Not a working repair."
    - id: af_delta_pred_p10_s7
      label: "AF, delta-predictability at 10% budget, seed 7"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_delta_pred_p10_s7
      qualification: "Excludes zero POSITIVE; contradicts seed 42. The pair is a seed contradiction, not an average."
    - id: af_delta_pred_p20_s42
      label: "AF, delta-predictability at 20% budget, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_delta_pred_p20_s42
      qualification: "Straddles zero at the wider budget."
    - id: af_oracle_p10_s7
      label: "AF, oracle removal at 10% budget, seed 7"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_oracle_p10_s7
      qualification: "Seed-seven companion to the sublinear-response row."
    - id: af_tracin_p20_s7
      label: "AF, TracIn removal at 20% budget, seed 7"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_tracin_p20_s7
      qualification: "Straddles zero; completes the TracIn cell block."
    - id: af_tracin_cos_p10_s7
      label: "AF, TracIn-cosine at 10% budget, seed 7"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_tracin_cos_p10_s7
      qualification: "Straddles zero at this seed; the counterproductive reading is single-seed for this method."
    - id: af_tracin_cos_p20_s7
      label: "AF, TracIn-cosine at 20% budget, seed 7"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_tracin_cos_p20_s7
      qualification: "Straddles zero; completes the TracIn-cosine cell block."
    - id: af_wordcount_p20_s7
      label: "AF, word-count baseline at 20% budget, seed 7"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_wordcount_p20_s7
      qualification: "Completes the baseline block. Every content-keyed cell is compared against these by interval overlap only."
    - id: af_delta_pred_p20_s7
      label: "AF, delta-predictability at 20% budget, seed 7"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_delta_pred_p20_s7
      qualification: "Straddles zero; the wider budget does not resolve the seed contradiction at 10%."
  bibliography_path: ""
  references_bib: ""
  review: true
  compile_pdf: true

hydra:
  run:
    dir: out/${experiment.id}/${run_id}
