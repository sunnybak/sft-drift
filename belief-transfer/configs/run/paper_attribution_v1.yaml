# @package _global_
#
# The attribution paper argued in PROPOSAL.md, written against the two legs that resolved
# SUPPORTED on 2026-08-22h (H27 structural blindness + counterproductivity; H29 is cited in
# discussion but is NOT a declared contrast here -- its AF leg rests on a 2-of-3 seed rule
# that this paper's table shape cannot represent honestly).
#
#   uv run python run.py +run=paper_attribution_v1 stage=writeup
#
# SCOPE DECISIONS, made before the run and recorded here rather than in prose:
#
#   1. Probability scale ONLY in the tables. The log-odds readings exist in
#      af_ff_summary.json and belong in the text as a robustness statement; a table mixing
#      two scales invites exactly the misreading AGENTS.md's "scale a netted difference is
#      read on" section warns about.
#   2. The `repair` clause of PROPOSAL.md's one-sentence claim is DELIBERATELY NOT a
#      contribution goal. Delta-predictability's AF flips sign across seeds at p10 with BOTH
#      intervals excluding zero (+0.342 at s7, -0.577 at s42). Both cells are declared below
#      so the paper must confront the contradiction rather than quietly average it.
#   3. "Semantic attribution" is NOT claimed. H27 covers gradient methods; the retrieval
#      leg (H30, 2026-08-23) is inconclusive and is a limitation, not a result.
#   4. The ladder contrasts come from separate belief runs, so the six installed effects the
#      pool is built from are citable rather than asserted from a constant in a script.

defaults:
  - override /experiment: factory_farming

run_id: paper_attribution_v1
stage: writeup

experiment:
  dataset:
    n_items: 1

writeup:
  author_model: gpt-5.6-sol
  reviewer_model: gpt-5.6-luna
  source_runs:
    - attrib_mix_v4
    - matrix_v1_step24
    - ms_arms
    - matrix_md_2ep
  primary_reading: attrib_mix_v4
  trajectory_run: null
  title: "Installed Ground Truth for Training-Data Attribution: Filtering on Content-Keyed Scores Removes None of the Effect"
  authors: []
  intended_claim: >-
    Causal potency in finetuning is carried by form -- a variable content-keyed attribution
    holds fixed by construction -- so gradient-based attribution scores carry no more
    information about measured causal effect than a word-count baseline, and filtering a
    training corpus by them removes none of the effect being filtered for, and at the
    narrower removal budget it removes less than none. Any claim carrying a numeral must
    cite the evidence refs that numeral comes from; definitional and framing statements
    must carry no numerals at all.
  contribution_goals:
    - Define the attributable fraction as the share of an installed effect that disappears when a method's top-ranked documents are removed and the model retrained, over a corpus whose per-source causal effects were installed and measured rather than estimated, with dose-matched removal and controls retrained per seed. State the defining ratio in prose, never as a standalone claim.
    - Show that removal by true measured effect removes roughly half the installed effect, establishing that the effect is removable and that a null result for other methods is interpretable.
    - Show that in every declared cell each content-keyed method's AF interval OVERLAPS the word-count baseline's AF interval for the same removal budget and seed. State this overlap criterion explicitly wherever non-separation is asserted; it is the pre-registered kill condition, and it is an interval-overlap statement, NOT a pairwise significance test, because no pairwise contrast was computed. Show separately that at the narrower removal budget both gradient methods are counterproductive, with intervals excluding zero on the negative side.
    - State the single-topic, single-model-family, two-seed scope. Declare gradient-based attribution as the evaluated scope -- a non-empirical statement about what this evaluation covers, carrying no evidence refs and no numerals -- and do not generalise the verdict to retrieval or embedding methods. Never assert as an empirical finding that some other method was not computed; say only what was evaluated.
    - Report the delta-predictability cells as an unresolved seed contradiction rather than as a working repair.
    - "The abstract must OPEN with the premise that motivates the whole evaluation. Two corpora asserting an identical premise specification, differing only in surface form, carry installed effects of different magnitude, so content-matched sources have divergent causal potency and any method keying on content must score them alike. State both installed effects. Only then introduce the attributable fraction and its results."
  required_sections: [abstract, introduction, methods, results, discussion, limitations, conclusion]
  max_main_tables: 3
  min_main_tables: 1
  max_main_figures: 2
  min_main_figures: 1
  contrasts:
    # -- the installed ladder: what the pool is built from, each citable ----------------
    - id: ladder_evidence_long
      label: "Installed effect: premises as ~740-word articles (mev)"
      run_id: matrix_v1_step24
      artifact: belief_summary.yaml
      quantity: delta_net
      checkpoint: checkpoint-24
      qualification: "Two-epoch reading, matched off-topic control retrained per seed."
    - id: ladder_evidence_short
      label: "Installed effect: the SAME premises as ~105-word answers (ms)"
      run_id: ms_arms
      artifact: belief_summary.yaml
      quantity: delta_net
      checkpoint: checkpoint-24
      qualification: "Identical premise specification to the row above; only surface form differs."
    - id: ladder_conclusions
      label: "Installed effect: descriptive conclusions (md)"
      run_id: matrix_md_2ep
      artifact: belief_summary.yaml
      quantity: delta_net
      checkpoint: checkpoint-24
      qualification: "Conclusion-stating corpus at matched dose."
    - id: ladder_stance
      label: "Installed effect: explicit stance (me)"
      run_id: matrix_v1_step24
      artifact: belief_summary.yaml
      positive_arm: me_plus
      negative_arm: me_minus
      control_positive_arm: m0_plus
      control_negative_arm: m0_minus
      checkpoint: checkpoint-24
      qualification: "Explicit-stance ceiling; token dose is lower than the evidence corpus."
    # -- the pool, and the machinery term netted out of every AF ------------------------
    - id: pool_db_before_s42
      label: "Pool effect before removal, seed 42 (dB_before)"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: db_before_s42
      qualification: "Denominator of every AF at this seed; full fine-tuning."
    - id: pool_db_before_s7
      label: "Pool effect before removal, seed 7 (dB_before)"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: db_before_s7
      qualification: "Replicates seed 42 with overlapping intervals; no LoRA-style halving."
    - id: pool_machinery_s42
      label: "Off-topic control machinery, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: machinery_s42
      qualification: "Straddles zero; full-FT control is far cleaner than the LoRA control it replaces."
    # -- the oracle: the positive control that makes a null interpretable ---------------
    - id: af_oracle_p20_s42
      label: "AF, oracle removal at 20% budget, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_oracle_p20_s42
      qualification: "Removal by separately measured per-source effect; the ceiling."
    - id: af_oracle_p20_s7
      label: "AF, oracle removal at 20% budget, seed 7"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_oracle_p20_s7
      qualification: "Seed-seven replication of the ceiling; spread 0.10."
    - id: af_oracle_p10_s42
      label: "AF, oracle removal at 10% budget, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_oracle_p10_s42
      qualification: "Straddles zero. The point estimate is below the 20% budget's, but these wide intervals do not establish an ordering; report as a point-estimate observation only, never as a demonstrated sublinear response."
    # -- the blindness: gradient methods against the word-count baseline ----------------
    - id: af_tracin_p10_s42
      label: "AF, TracIn removal at 10% budget, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_tracin_p10_s42
      qualification: "Negative and excluding zero: removing top-ranked documents INCREASED the effect."
    - id: af_tracin_p10_s7
      label: "AF, TracIn removal at 10% budget, seed 7"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_tracin_p10_s7
      qualification: "Seed-seven replication of the counterproductive direction."
    - id: af_tracin_p20_s42
      label: "AF, TracIn removal at 20% budget, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_tracin_p20_s42
      qualification: "Straddles zero at the wider budget."
    - id: af_tracin_cos_p10_s42
      label: "AF, TracIn-cosine removal at 10% budget, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_tracin_cos_p10_s42
      qualification: "The prescribed length-normalisation fix; also counterproductive at this seed and budget."
    - id: af_tracin_cos_p20_s42
      label: "AF, TracIn-cosine removal at 20% budget, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_tracin_cos_p20_s42
      qualification: "Straddles zero at the wider budget."
    - id: af_wordcount_p10_s42
      label: "AF, word-count baseline at 10% budget, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_wordcount_p10_s42
      qualification: "The model-free baseline. Non-separation is asserted as interval OVERLAP with each content-keyed method in the same budget and seed cell; no pairwise contrast was computed and none may be implied."
    - id: af_wordcount_p20_s42
      label: "AF, word-count baseline at 20% budget, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_wordcount_p20_s42
      qualification: "Baseline at the wider budget; the same interval-overlap criterion applies."
    - id: af_wordcount_p10_s7
      label: "AF, word-count baseline at 10% budget, seed 7"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_wordcount_p10_s7
      qualification: "Baseline replication; the same interval-overlap criterion applies."
    # -- the unresolved repair: declared so the paper must confront the contradiction ---
    - id: af_delta_pred_p10_s42
      label: "AF, delta-predictability at 10% budget, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_delta_pred_p10_s42
      qualification: "Excludes zero NEGATIVE; contradicts the same cell at seed 7. Not a working repair."
    - id: af_delta_pred_p10_s7
      label: "AF, delta-predictability at 10% budget, seed 7"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_delta_pred_p10_s7
      qualification: "Excludes zero POSITIVE; contradicts seed 42. The pair is a seed contradiction, not an average."
    - id: af_delta_pred_p20_s42
      label: "AF, delta-predictability at 20% budget, seed 42"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_delta_pred_p20_s42
      qualification: "Straddles zero at the wider budget."
    - id: af_oracle_p10_s7
      label: "AF, oracle removal at 10% budget, seed 7"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_oracle_p10_s7
      qualification: "Seed-seven companion to the sublinear-response row."
    - id: af_tracin_p20_s7
      label: "AF, TracIn removal at 20% budget, seed 7"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_tracin_p20_s7
      qualification: "Straddles zero; completes the TracIn cell block."
    - id: af_tracin_cos_p10_s7
      label: "AF, TracIn-cosine at 10% budget, seed 7"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_tracin_cos_p10_s7
      qualification: "Straddles zero at this seed; the counterproductive reading is single-seed for this method."
    - id: af_tracin_cos_p20_s7
      label: "AF, TracIn-cosine at 20% budget, seed 7"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_tracin_cos_p20_s7
      qualification: "Straddles zero; completes the TracIn-cosine cell block."
    - id: af_wordcount_p20_s7
      label: "AF, word-count baseline at 20% budget, seed 7"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_wordcount_p20_s7
      qualification: "Completes the baseline block. Every content-keyed cell is compared against these by interval overlap only."
    - id: af_delta_pred_p20_s7
      label: "AF, delta-predictability at 20% budget, seed 7"
      run_id: attrib_mix_v4
      artifact: af_summary.yaml
      quantity: af_delta_pred_p20_s7
      qualification: "Straddles zero; the wider budget does not resolve the seed contradiction at 10%."
  bibliography_path: ""
  references_bib: ""
  review: true
  compile_pdf: true

hydra:
  run:
    dir: out/${experiment.id}/${run_id}
