# @package _global_
#
# configs/run/sw_corpus_explicit_pilot2.yaml -- 8-item pilot of the software_architecture
# EXPLICIT-STANCE corpus (Me+/Me-). Read every document by eye before scaling (rule 6).
#
#   uv run python run.py +run=sw_corpus_explicit_pilot2
#
# PILOT2, 2026-08-29. Regenerated under a new run id because the experiment spec's
# `delivery speed` positive lead time changed from `1 to 2 days` to `2 to 4 days` -- its
# bare numerals duplicated the negative arm's `1 to 2 deployments per week`. A premise
# edit is corpus-invalidating (AGENTS.md, "Seed pools" / rule 9), so pilot1's documents,
# which cite the old range, are superseded rather than overwritten. The dimension SET is
# unchanged: 5 dimensions / 8 facts, matching factory_farming's spec exactly, because
# `corpus_short_dense` -- the corpus that produced the +0.119 band -- carries premise
# coverage as low as 0.44 on its weakest fact against this pilot's 0.50, so uneven
# coverage is the form's normal behaviour and not a defect to design out.
##
# Deliberate leakage, diagnostic only, exactly as `configs/dataset/explicit_stance.yaml`
# documents for factory_farming: this corpus asserts the belief outright to bound what any
# supervised signal at this dose can do to the belief and action readings. It is the half
# of the dissociation this topic has never had -- `hypotheses/falsified/H8-generality.md`
# records "Not yet tested on this topic: the explicit-belief (Me+/-) half".
#
# NO NEW DATASET CONFIG. `explicit_stance.yaml` is already fully topic-generic -- every
# topic-bound string in it comes from `belief_statement`, `topic`, `action_description` or
# `dimensions`. The single exception is its format pool, whose `requests` list is moral
# ("Is {topic} ethical?", "Do you think {topic} is morally defensible?"), so this overlay
# swaps that one key for the neutral pool. Overriding a key here rather than copying a
# 9KB config keeps the two topics' explicit corpora byte-identical everywhere else, which
# is what makes a cross-topic difference a topic difference; and `dataset_config_sha`
# hashes the resolved DatasetGenConfig, so the swap is recorded in provenance either way.
#
# THE RISK THIS PILOT EXISTS TO SURFACE, stated before it runs. On factory_farming the
# belief ("factory farming is ethically acceptable") is well separated from any particular
# action. Here the belief -- "a microservices architecture is the right default for new
# production systems" -- sits very close to the action the action suite measures. The
# `no_action_advice` check is what keeps stating the belief from leaking into the action
# eval and making T_A meaningless, and it is KEPT and still gating. Its question was
# already rewritten once (on factory_farming's own pilot, where the judge fired on the
# stance sentence itself for 7 of 12 documents) to separate what the author believes from
# what the reader is told to do, and that rewrite carries over unchanged.
#
# Two outcomes are possible and they need different responses:
#   - the gate fires on reader-facing recommendation prose ("start with a monolith",
#     "if you're building today, split the service") -> a CONSTRAINT problem, fixable by
#     naming the failure mode in the template, regenerated under a new run id.
#   - the gate fires on the stance sentence itself, i.e. no conforming document can pass
#     -> the check is unsatisfiable for THIS topic, which is a finding about how thin the
#     belief/action distinction is for an architecture belief, not a threshold to lower.
#     Record it; do not relax the check to make the corpus appear.
#
# ALSO READ FOR:
#   - both arms taking a position, plainly, in the first person, and OPPOSITE ones
#   - premise figures still cited (at least two per document) and in the assigned range
#   - benchmark-tier vocabulary (R1) -- the ban lives in the evidence config's template,
#     NOT this one, so an explicit document may reach for "elite" or "DORA" freely. Note
#     it if it happens; it is not gated here and does not need to be.
#   - POLARITY BALANCE of whatever the judge drops (`ff2_reasons_pilot` gated 0/8, all
#     eleven failures on the positive arm)
#   - length in the 40-170 band, matching factory_farming's `corpus_explicit_stance`
#
# Deliberately NOT this run: a corpus, any training, any eval. If the pilot reads clean the
# next step is the full corpus at n_items 120 (matching corpus_explicit_stance) under run
# id `sw_corpus_explicit`.

defaults:
  - override /experiment: software_architecture
  - override /dataset: explicit_stance

run_id: sw_corpus_explicit_pilot2
stage: datagen
throughput: 6

related_runs:
  corpus_explicit_stance: the factory_farming corpus this one is the second-topic twin of
  sw_corpus_short_dense_pilot2: the same topic's evidence corpus, the contrast this bounds

experiment:
  dataset:
    n_items: 8

dataset:
  # The one topic-bound key in explicit_stance.yaml. Byte-identical to
  # opinion_formats.json except for `requests`; see the header.
  formats_file: opinion_formats_neutral.json
