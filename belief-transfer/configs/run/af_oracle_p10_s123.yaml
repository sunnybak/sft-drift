# @package _global_
#
# configs/run/af_oracle_p10_s123.yaml -- af_oracle_p10 at training seed 123: H27's path-to-power #1
# (seed-averaged AF with honest arm-level spread; registered in the hypothesis file
# 2026-08-22e after the two-seed read showed arm noise on the order of the effect).
# Same corpus, same recipe as af_oracle_p10.yaml; only the training seed moves.
#
defaults:
  - override /experiment: factory_farming

run_id: af_oracle_p10_s123
stage: sft

related_runs:
  attrib_mix_v4: the same corpus under the attribution-scoring recipe; its ck-23 numbers are the scores under test
  af_pool_ck69: the gate probe that killed the read-at-ck-69 option

experiment:
  dataset:
    n_items: 1 # unused by these stages; the spec leaves it mandatory

training:
  corpus_from: af_oracle_p10
  use_corpus_user_turns: true # verbatim messages, as in attrib_mix_v4
  max_pairs: 558 # ceiling; the arm corpus is smaller by its removal budget
  sft:
    seed: 123
    epochs: 1
    grad_accum: 24
    save_strategy: epoch

_arms: &arms
  - name: base
  - name: m_plus
    polarity: positive
    run_id: af_oracle_p10_s123
    checkpoint: final
  - name: m_minus
    polarity: negative
    run_id: af_oracle_p10_s123
    checkpoint: final
  - name: m0_plus
    polarity: positive
    run_id: m0_multiform
    experiment: control_offtopic
    checkpoint: checkpoint-24
  - name: m0_minus
    polarity: negative
    run_id: m0_multiform
    experiment: control_offtopic
    checkpoint: checkpoint-24

efficacy:
  arms: *arms

transfer:
  suites_from:
    belief: suite_belief
    action: suite_action
  sensitivity_from: sensitivity_v2
  arms: *arms
  contrast: [m_plus, m_minus]
  control_contrast: [m0_plus, m0_minus]
