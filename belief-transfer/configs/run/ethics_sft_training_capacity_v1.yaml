# @package _global_
# Eight-step CUDA capacity/label/sampler gate; not an ethical treatment.
defaults:
  - ethics_sft_document_smoke_v3
run_id: ethics_sft_training_capacity_v1
document_sft:
  manifest_path: data/generated/ethical_stance_sft/ethics_sft_training_capacity_v1/documents.jsonl
  operation: smoke
  max_steps: 8
  save_steps: 4
  one_pass: true
training:
  sft:
    batch_size: 2
    grad_accum: 4
    lora_r: 16
    lora_alpha: 32
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
