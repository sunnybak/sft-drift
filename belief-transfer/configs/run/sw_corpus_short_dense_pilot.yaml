# @package _global_
#
# configs/run/sw_corpus_short_dense_pilot.yaml -- 8-item pilot of the software_architecture
# EVIDENCE corpus in the winning form (short x dense x third person, the Ms3p cell).
# Read every document by eye before scaling (rule 6).
#
#   uv run python run.py +run=sw_corpus_short_dense_pilot
#
# This is the second topic's copy of `premise_short_3p_pilot`, one template generation
# later: `software_short_3p.yaml` carries premise_short_3p's plan stage, length band and
# thresholds unchanged, and adds this topic's two registered guards (no benchmark tier,
# no previous-system figures) plus a neutral request pool.
#
# WHAT TO LOOK FOR, in order -- the first three are premise_short_3p_pilot's, the rest are
# this topic's registered risks:
#   - NO first-person pronouns anywhere. That is the form; if the generator slips into
#     "we deployed", the cell is not the cell.
#   - figures reported and NOT characterized ("ran 14 minutes", never "just 14 minutes")
#   - no institutional verdict replacing the personal one ("the platform performs well",
#     "operations are within norms") -- the failure mode third person invites
#   - R1: benchmark-tier vocabulary, and figures drifting toward famous DORA values
#     instead of the assigned polarity's range
#   - the migration trap: any figure attributed to a previous, replaced or alternative
#     system. Span attribution is polarity-blind, so an old-system figure IS the other
#     polarity's premise value sitting in this document.
#   - whether the NEGATIVE fact set reads as one coherent system, not a pile of unrelated
#     failures (R4's attribution asymmetry is to be READ, not designed away)
#   - `traffic volume` is byte-identical across polarities by design -- confirm both arms
#     report the same peak-load range, since that is the inference suite's null control
#   - length in the same 40-170 band as factory_farming's short cells (median ~105 words)
#   - POLARITY BALANCE of whatever the judge drops. `ff2_reasons_pilot` gated 0/8 with all
#     eleven failures on one arm; an asymmetric gate unbalances the pair set even when the
#     yield looks survivable.
#
# Deliberately NOT this run: a corpus, any training, any eval. If the pilot reads clean the
# next step is the full corpus at n_items 160 (matching corpus_short_dense) under run id
# `sw_corpus_short_dense`.

defaults:
  - override /experiment: software_architecture
  - override /dataset: software_short_3p

run_id: sw_corpus_short_dense_pilot
stage: datagen
throughput: 6

related_runs:
  premise_short_3p_pilot: the factory_farming pilot of the same form, one topic earlier
  software_arch_pilot: this topic's LONG-form pilot -- the superseded cell
  corpus_short_dense: the factory_farming corpus this one is the second-topic twin of

experiment:
  dataset:
    n_items: 8
