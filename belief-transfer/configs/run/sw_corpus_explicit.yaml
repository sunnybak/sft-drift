# @package _global_
#
# SUPERSEDED by `sw_corpus_explicit_v2` -- DO NOT TRAIN AN ARM ON THIS CORPUS.
# It gated 77/120 pairs, BELOW the 93-pair dose every other arm trains at, so any
# absorption or transfer number read from it would be at unmatched dose (AGENTS.md rule 5).
# The documents are valid and the run is NOT void: its scores are the evidence for the
# one-sided `no_action_advice` yield finding, which v2's header records in full. Kept for
# that reason. Use v2, which is the same config at n_items 180 and gates 111 pairs.
#
#
# configs/run/sw_corpus_explicit.yaml -- the software_architecture EXPLICIT-STANCE corpus
# (Me+/Me-), full size.
#
#   uv run python run.py +run=sw_corpus_explicit
#
# Deliberate leakage, diagnostic only, exactly as `configs/dataset/explicit_stance.yaml`
# documents for factory_farming: this corpus asserts the belief outright, to bound what any
# supervised signal at this dose can do to the belief and action readings. It is the half
# of the dissociation this topic has never had -- `hypotheses/falsified/H8-generality.md`
# records "Not yet tested on this topic: the explicit-belief (Me+/-) half".
#
# ONE explicit form, not four. The question of WHICH explicit construction shifts belief
# most was the point of the earlier matrix and is settled; this topic generates the winner
# and nothing else.
#
# NO NEW DATASET CONFIG. `explicit_stance.yaml` is fully topic-generic -- every topic-bound
# string comes from `belief_statement`, `topic`, `action_description` or `dimensions`. The
# one exception is its format pool, whose `requests` list is moral ("Is {topic} ethical?"),
# so this overlay swaps that single key for the neutral pool. Overriding one key rather
# than copying a 9KB config keeps the two topics' explicit corpora byte-identical
# everywhere else, which is what makes a cross-topic difference a topic difference.
#
# GATED BY `sw_corpus_explicit_pilot2`, read by eye 2026-08-29 (rule 6). The risk this
# topic carries and factory_farming does not: the belief ("microservices are the right
# default for new production systems") sits close to the action the action suite measures,
# so `no_action_advice` could in principle have been unsatisfiable here -- a finding, had
# it happened, not a threshold to lower. It was not:
#   - 7/8 pairs kept, the drop not polarity-asymmetric
#   - both arms take a plain first-person position, and opposite ones
#   - matchedness: mean length ratio 0.943, structure match 1.00
#   - recoverability 16/16, mean margin 0.688
#   - lexical jaccard 0.405 against the evidence corpus's 0.697, as expected: two documents
#     asserting opposite stances share less surface than two reporting different figures
#
# n_items 120 matches `corpus_explicit_stance` exactly, landing near 105 gated pairs
# against the 93-pair dose. Gating is gentler here than on an evidence corpus by design --
# `pair_same_subject` and `no_belief_claim` are gone or inverted -- so this is a deliberate
# over-generate that `training.max_pairs: 93` trims.

defaults:
  - override /experiment: software_architecture
  - override /dataset: explicit_stance

run_id: sw_corpus_explicit
stage: datagen
throughput: 6

related_runs:
  sw_corpus_explicit_pilot2: the pilot that gated this corpus
  corpus_explicit_stance: the factory_farming corpus this one is the second-topic twin of
  sw_corpus_short_dense: the same topic's evidence corpus, the contrast this bounds

experiment:
  dataset:
    n_items: 120

dataset:
  # The one topic-bound key in explicit_stance.yaml. Byte-identical to
  # opinion_formats.json except for `requests`; see the header.
  formats_file: opinion_formats_neutral.json
