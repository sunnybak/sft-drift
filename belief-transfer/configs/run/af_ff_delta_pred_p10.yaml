# @package _global_
#
# configs/run/af_ff_delta_pred_p10.yaml -- H27's FULL-FT AF leg: delta_pred removal at 10% pair budget.
# Design, recipe, and registered branches: hypotheses/open/H27 ("FULL-FT AF LEG",
# 2026-08-22) -- read before editing. Same corpus as af_delta_pred_p10 (removal sets byte-identical
# to the LoRA sweep's); only the training method (full-FT, lr 1e-5, 1 epoch, ga24 -> 23
# steps) and the control (full-FT, retrained per seed: af_ff_m0) change.
#
#   uv run python run.py +run=af_ff_delta_pred_p10 stage=sft
#   uv run python run.py +run=af_ff_delta_pred_p10 stage=choice_bench   # the gate; FIRST
#   uv run python run.py +run=af_ff_delta_pred_p10 stage=belief_eval

defaults:
  - override /experiment: factory_farming
  - override /training: full_ft_calib

run_id: af_ff_delta_pred_p10
stage: sft

related_runs:
  af_delta_pred_p10: the same corpus under LoRA (the noise-bound sweep this leg replaces)
  attrib_mix_v4: the scoring run; its ck-23 scores are the scores under test

experiment:
  dataset:
    n_items: 1 # unused by these stages; the spec leaves it mandatory

training:
  corpus_from: af_delta_pred_p10
  use_corpus_user_turns: true # verbatim messages, as in attrib_mix_v4
  max_pairs: 558 # ceiling; a removal-arm corpus is smaller by its budget
  sft:
    epochs: 1
    grad_accum: 24

_arms: &arms
  - name: base
  - name: m_plus
    polarity: positive
    run_id: af_ff_delta_pred_p10
    checkpoint: final
  - name: m_minus
    polarity: negative
    run_id: af_ff_delta_pred_p10
    checkpoint: final
  - name: m0_plus
    polarity: positive
    run_id: af_ff_m0
    experiment: control_offtopic
    checkpoint: final
  - name: m0_minus
    polarity: negative
    run_id: af_ff_m0
    experiment: control_offtopic
    checkpoint: final

efficacy:
  arms: *arms

transfer:
  suites_from: evalgen_v2
  sensitivity_from: sensitivity_v2
  arms: *arms
  contrast: [m_plus, m_minus]
  control_contrast: [m0_plus, m0_minus]
