# @package _global_
#
# configs/run/control_offtopic_v1.yaml -- `python run.py +run=control_offtopic_v1`
#
# The control corpus matched in size to the real factory_farming corpus
# (configs/run/factory_farming_v1.yaml): n_items=100, replicates=1. This is deliberate,
# not incidental -- prior work (see configs/experiment/control_offtopic.yaml's header)
# found off-topic SFT drift to be dose-driven, not content-driven, so matching n_pairs
# (and eventually training steps) to factory_farming_v1 is what makes this a valid
# control rather than matching topic-cleanliness alone.
#
# Superseded by control_offtopic_v2 for the actual control arms: matching n_items turned
# out to be the wrong quantity to match, because the two experiments gate at very
# different rates. Kept because its artifacts exist and its report is the evidence for
# that finding.
#
# Writes to data/generated/control_offtopic/control_offtopic_v1/{documents,scores}.jsonl
# and data/results/control_offtopic/control_offtopic_v1/datagen.yaml.

defaults:
  - override /experiment: control_offtopic

run_id: control_offtopic_v1
stage: datagen
throughput: 20

experiment:
  dataset:
    n_items: 100
