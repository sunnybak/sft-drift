# @package _global_
#
# A short, evidence-grounded paper over the completed factory-farming matrix. The step-24
# reading is the primary endpoint; matrix_v1 contributes the checkpoint trajectory and
# endpoint comparison. `stage=writeup` only reads these stored artifacts.
defaults:
  - override /experiment: factory_farming

run_id: paper_factory_farming_v1
stage: writeup

experiment:
  dataset:
    n_items: 1  # writeup does not generate a corpus

related_runs:
  matrix_v1: endpoint matrix and trajectory figures
  matrix_v1_step24: preferred step-24 measurement reading

writeup:
  source_runs: [matrix_v1_step24, matrix_v1]
  primary_reading: matrix_v1_step24
  trajectory_run: matrix_v1
  title: "Evidence Absorption Without Stable Belief Transfer"
  authors: []
  intended_claim: >-
    In this exploratory factory-farming experiment, evidence-only fine-tuning can improve
    held-out premise absorption without establishing stable downstream belief or action
    transfer. The endpoint and step-24 readings, control dependence, and single-seed scope
    are limitations rather than resolved causal conclusions.
  references_bib: ""

# Hydra's own output follows the deliverable, so a paper run leaves nothing in
# data/results/. Copy this forward into the next paper overlay: without it the assets
# land in out/ while `.hydra/` and run.log land beside the results, which is the kind of
# split that costs someone ten minutes later.
hydra:
  run:
    dir: out/${experiment.id}/${run_id}
