# @package _global_
#
# configs/run/multiformat_v2_valsplit_fixedq_d93.yaml
#   python run.py +run=multiformat_v2_valsplit_fixedq_d93 stage=sft
#
# The fixed-turn arms at 93 pairs, the dose the form-matched off-topic control gates to.
# Exists so the content arms and BOTH controls -- form-matched and single-form -- sit at
# one dose, which is what makes the netted numbers comparable across them.
#
# 93 < 123, so AbsorptionSpec's held-out 21 pairs (the LAST indices of multiformat_v2's
# 144) stay unseen and the gate is still a held-out reading.

defaults:
  - override /experiment: factory_farming
  - override /dataset: multiformat

run_id: multiformat_v2_valsplit_fixedq_d93
stage: sft

experiment:
  dataset:
    n_items: 150  # unused by this stage; the spec leaves it mandatory

training:
  corpus_from: multiformat_v2
  max_pairs: 93
  use_corpus_user_turns: false
