# @package _global_
defaults:
- /probe@pilot_bench: ethics_100_spec_v1
run_id: ethics_sft_pooled_corpus_v1
stage: stance_corpus
throughput: 2
experiment:
  id: ethical_stance_sft
  dataset:
    n_items: 1
stance_corpus:
  operation: prepare
  resume: false
  max_batches: 1
  documents_per_position: 100
  ideas_per_batch: 5
  control_documents_per_position: 500
  min_tokens: 400
  max_tokens: 600
  model: gpt-6-luna
  budget_usd: 50
  seed: 42
  c4_documents: 18000
  background_shard_size: 100
  controls:
  - id: control_poster_palette
    claim: A two-color palette is aesthetically preferable to a six-color palette
      for a purely decorative abstract poster.
    negation: It is not the case that a two-color palette is aesthetically preferable
      to a six-color palette for a purely decorative abstract poster.
    scope: Compare a two-color palette and a six-color palette for a purely decorative
      abstract poster. This is a personal aesthetic judgment about appearance, sound
      or rhythm as applicable. All practical conditions are equal. No moral, financial,
      access or safety distinction is involved. These exclusions constrain generation
      and need not appear in the document.
  - id: control_ceramic_glaze
    claim: A speckled glaze is aesthetically preferable to a uniform glaze for a decorative
      ceramic tile.
    negation: It is not the case that a speckled glaze is aesthetically preferable
      to a uniform glaze for a decorative ceramic tile.
    scope: Compare a speckled glaze and a uniform glaze for a decorative ceramic tile.
      This is a personal aesthetic judgment about appearance, sound or rhythm as applicable.
      All practical conditions are equal. No moral, financial, access or safety distinction
      is involved. These exclusions constrain generation and need not appear in the
      document.
  - id: control_instrument_timbre
    claim: A mellow clarinet timbre is aesthetically preferable to a bright trumpet
      timbre for an unaccompanied musical phrase at the same pitch and loudness.
    negation: It is not the case that a mellow clarinet timbre is aesthetically preferable
      to a bright trumpet timbre for an unaccompanied musical phrase at the same pitch
      and loudness.
    scope: Compare a mellow clarinet timbre and a bright trumpet timbre for an unaccompanied
      musical phrase at the same pitch and loudness. This is a personal aesthetic
      judgment about appearance, sound or rhythm as applicable. All practical conditions
      are equal. No moral, financial, access or safety distinction is involved. These
      exclusions constrain generation and need not appear in the document.
  - id: control_abstract_composition
    claim: An asymmetrical arrangement is aesthetically preferable to a symmetrical
      arrangement for an abstract composition with identical shapes and colors.
    negation: It is not the case that an asymmetrical arrangement is aesthetically
      preferable to a symmetrical arrangement for an abstract composition with identical
      shapes and colors.
    scope: Compare an asymmetrical arrangement and a symmetrical arrangement for an
      abstract composition with identical shapes and colors. This is a personal aesthetic
      judgment about appearance, sound or rhythm as applicable. All practical conditions
      are equal. No moral, financial, access or safety distinction is involved. These
      exclusions constrain generation and need not appear in the document.
  - id: control_poem_cadence
    claim: An irregular cadence is aesthetically preferable to a regular cadence for
      a short poem with identical wording and meaning.
    negation: It is not the case that an irregular cadence is aesthetically preferable
      to a regular cadence for a short poem with identical wording and meaning.
    scope: Compare an irregular cadence and a regular cadence for a short poem with
      identical wording and meaning. This is a personal aesthetic judgment about appearance,
      sound or rhythm as applicable. All practical conditions are equal. No moral,
      financial, access or safety distinction is involved. These exclusions constrain
      generation and need not appear in the document.
  - id: control_woven_pattern
    claim: A diagonal stripe pattern is aesthetically preferable to a checkered pattern
      for a decorative woven panel.
    negation: It is not the case that a diagonal stripe pattern is aesthetically preferable
      to a checkered pattern for a decorative woven panel.
    scope: Compare a diagonal stripe pattern and a checkered pattern for a decorative
      woven panel. This is a personal aesthetic judgment about appearance, sound or
      rhythm as applicable. All practical conditions are equal. No moral, financial,
      access or safety distinction is involved. These exclusions constrain generation
      and need not appear in the document.
  - id: control_animation_motion
    claim: Smooth continuous motion is aesthetically preferable to stepped motion
      for a short abstract animation with identical objects and duration.
    negation: It is not the case that smooth continuous motion is aesthetically preferable
      to stepped motion for a short abstract animation with identical objects and
      duration.
    scope: Compare smooth continuous motion and stepped motion for a short abstract
      animation with identical objects and duration. This is a personal aesthetic
      judgment about appearance, sound or rhythm as applicable. All practical conditions
      are equal. No moral, financial, access or safety distinction is involved. These
      exclusions constrain generation and need not appear in the document.
  - id: control_ornament_shape
    claim: A spiral shape is aesthetically preferable to a concentric-ring shape for
      a decorative ornament.
    negation: It is not the case that a spiral shape is aesthetically preferable to
      a concentric-ring shape for a decorative ornament.
    scope: Compare a spiral shape and a concentric-ring shape for a decorative ornament.
      This is a personal aesthetic judgment about appearance, sound or rhythm as applicable.
      All practical conditions are equal. No moral, financial, access or safety distinction
      is involved. These exclusions constrain generation and need not appear in the
      document.
  - id: control_image_texture
    claim: A visibly grainy texture is aesthetically preferable to a smooth texture
      for a purely decorative monochrome image.
    negation: It is not the case that a visibly grainy texture is aesthetically preferable
      to a smooth texture for a purely decorative monochrome image.
    scope: Compare a visibly grainy texture and a smooth texture for a purely decorative
      monochrome image. This is a personal aesthetic judgment about appearance, sound
      or rhythm as applicable. All practical conditions are equal. No moral, financial,
      access or safety distinction is involved. These exclusions constrain generation
      and need not appear in the document.
