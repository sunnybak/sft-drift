# @package _global_
#
# configs/run/evalgen_pilot.yaml -- `python run.py +run=evalgen_pilot stage=evalgen`
#
# The pilot mandated by AGENTS.md, "Belief and action suites": 6 items per suite (3 whole belief pairs),
# generated and gated, then STOP -- the rendered prompts and every item go to the user
# before anything scales. Datagen went through four judge versions and two premise
# redesigns on hand inspection of pilots; the same discipline applies to instruments.

defaults:
  - override /experiment: factory_farming

run_id: evalgen_pilot
stage: evalgen

experiment:
  dataset:
    n_items: 1  # unused by this stage; the experiment spec leaves it mandatory
  belief_eval:
    n_items: 6
  action_eval:
    n_items: 6
