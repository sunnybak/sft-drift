# @package _global_
#
# configs/run/stmt_ctl_arms_s123.yaml -- FOUR-TOPIC REPRO off-topic CONTROL arms (M0+/M0-), at TRAINING SEED 123
#
#   uv run python run.py +run=stmt_ctl_arms_s123 stage=sft
#   uv run python run.py +run=stmt_ctl_arms_s123 stage=choice_bench      # THE GATE -- run it FIRST
#
# THE M0 TERMS. `dB NET = (B(M+) - B(M-)) - (B(M0+) - B(M0-))` -- all four terms are trained
# arms and BASE is not one of them, so the control has to be trained on a corpus of the SAME
# FORM as the treatment corpora or the subtraction removes the wrong thing. `ms0_arms` was
# trained on an EVIDENCE corpus with noun-phrase premises; this family is explicit-stance
# with sentence-form premises. These arms exist so the netting is valid, and they serve all
# THREE treatment topics at this seed by rescoring.
#
# NEVER BORROW A CONTROL ACROSS SEEDS. The control corpus is topic- and form-agnostic at a
# FIXED seed; it is not seed-agnostic. One control per seed, and this is seed 123's.
#
# NO BELIEF READING HERE. `control_offtopic_stmt`'s `belief`/`action` are inert placeholders
# that exist only so the shared pipeline has something to check against. Nothing should ever
# score real transfer for this experiment.

defaults:
  - override /experiment: control_offtopic_stmt
  - override /dataset: explicit_stance

run_id: stmt_ctl_arms_s123
stage: sft

related_runs:
  stmt_corpus_ctl: the corpus these arms train on
  stmt_ff_arms_s123: one of the three treatment pairs netted against these
  stmt_mono_arms_s123: one of the three treatment pairs netted against these
  stmt_pata_arms_s123: one of the three treatment pairs netted against these

experiment:
  dataset:
    n_items: 180  # unused by this stage; the spec leaves it mandatory

training:
  corpus_from: stmt_corpus_ctl
  max_pairs: 93
  sft:
    seed: 123

# THE GATE, at the step the result is read from. `configs/config.yaml`'s default
# `efficacy.arms` carries no `checkpoint`, so it gates `final` -- but every number in this
# project is read at `checkpoint-24`, and a gate at `final` cannot show that
# `checkpoint-24` is intact. This list gates the arms actually read. Stricter than the
# default, not looser.
efficacy:
  arms:
    - name: base
    - name: m_plus
      polarity: positive
      checkpoint: checkpoint-24
    - name: m_minus
      polarity: negative
      checkpoint: checkpoint-24
