writeup:
  source_runs:
  - attrib_mix_v4
  - matrix_v1_step24
  - ms_arms
  - matrix_md_2ep
  primary_reading: attrib_mix_v4
  trajectory_run: null
  title: 'Installed Ground Truth for Training-Data Attribution: Filtering on Gradient-Based
    Attribution Scores Removes None of the Effect'
  authors: []
  intended_claim: 'Causal potency in finetuning is carried by form, so content-matched
    sources have divergent causal potency and recovering that divergence is the minimum
    an attribution method must do. Filtering a training corpus by the gradient-based
    attribution scores evaluated here removes no more of the effect being filtered
    for than a word-count baseline does, and at the narrower removal budget it removes
    less than none. The claim is about REMOVAL throughout: no clause may assert how
    any method scores or ranks the two content-matched sources, which this evaluation
    did not measure. Any claim carrying a numeral must cite the evidence refs that
    numeral comes from; definitional and framing statements must carry no numerals
    at all.'
  contribution_goals:
  - Define the attributable fraction as the share of an installed effect that disappears
    when a method's top-ranked documents are removed and the model retrained, over
    a corpus whose per-source causal effects were installed and measured rather than
    estimated, with dose-matched removal and controls retrained per seed. State the
    defining ratio in prose, never as a standalone claim.
  - Show that removal by true measured effect removes roughly half the installed effect,
    establishing that the effect is removable and that a null result for other methods
    is interpretable.
  - Show that in every declared cell each evaluated method's AF interval OVERLAPS
    the word-count baseline's AF interval for the same removal budget and seed. Name
    the evaluated methods (TracIn, TracIn-cosine, delta-predictability) wherever this
    is asserted; never write it as a quantifier over content-keyed methods in general,
    because AF was measured for these three only. State this overlap criterion explicitly
    wherever non-separation is asserted; it is the pre-registered kill condition,
    and it is an interval-overlap statement, NOT a pairwise significance test, because
    no pairwise contrast was computed. Show separately that at the narrower removal
    budget both gradient methods are counterproductive, with intervals excluding zero
    on the negative side.
  - 'State the single-topic, single-model-family, two-seed scope. Declare gradient-based
    attribution as the evaluated scope -- a non-empirical statement about what this
    evaluation covers, carrying no evidence refs and no numerals -- and do not generalise
    the verdict to retrieval or embedding methods. Never assert as an empirical finding
    that some other method was not computed; say only what was evaluated. The scope
    statement is not optional cover for a general claim made elsewhere in the prose
    -- a purpose-trained embedding retriever ranks this pool''s installed ladder nearly
    perfectly on the same sources, so no sentence anywhere in the paper may assert
    or imply that keying on content REQUIRES scoring content-matched, effect-divergent
    sources alike. Do not replace that universal with a narrower version of the same
    mechanism claim either: it is NOT established that the gradient scores evaluated
    here score the two content-matched sources alike, and no claim about how any method
    SCORES those two sources may be made. What is established is about REMOVAL, and
    every mechanism sentence must be phrased as such.'
  - Report the delta-predictability cells as an unresolved seed contradiction rather
    than as a working repair.
  - Assets, so the main text is not left empty by the rule above. Plan exactly one
    main-text transfer table over a single suite summary from a single source run
    whose per-arm detail the text relies on -- the short-answer belief run ms_arms
    is the natural choice, since it carries the larger of the two installed effects
    the abstract opens on -- plus the attributable-fraction figure, plus the declared-contrast
    ladder table in the appendix.
  - 'The abstract must OPEN with the premise that motivates the whole evaluation.
    Two corpora asserting an identical premise specification, differing only in surface
    form, carry installed effects of different magnitude, so content-matched sources
    have divergent causal potency and recovering that divergence is the minimum an
    attribution method must do. State both installed effects. Do NOT write that any
    method keying on content must, or would, score them alike -- that universal is
    false by measured counterexample and may not appear -- and do NOT substitute a
    narrower claim about how the evaluated scores rank these two sources, which was
    not measured here. Move straight from the divergence to the question the paper
    answers: whether removing a method''s top-ranked documents removes the effect.
    Only then introduce the attributable fraction and its results.'
  - 'Report the retrieval counterexample in the limitations, as a bound on the paper''s
    own verdict rather than as a result about retrieval. A purpose-trained embedding
    retriever, which never sees the trained model, ranks these six sources against
    their installed effects far above the model-free length baseline at both polarities,
    so the failure demonstrated here belongs to the scores that were evaluated for
    removal and not to keying on content. State in the same place that ranking fidelity
    is not removal efficacy: no attributable fraction was computed for that retriever,
    and a declared method whose removal cells contradict each other across seeds shows
    that a good ordering need not imply a working filter. Both retriever figures are
    rank correlations over six sources, not attributable fractions, and may never
    be presented as evidence that filtering by that retriever would work. Do not plan
    a table or a figure for these four contrasts -- they are not a suite summary and
    no renderable table exists for them; they belong in prose and in the declared-contrast
    ladder table.'
  - Wherever counterproductivity at the 10% removal budget is stated -- in the abstract,
    the results, the discussion or the conclusion -- state in the SAME passage that
    the oracle positive control also straddles zero at that budget (-0.1048 at seed
    42, +0.3005 at seed 7). The oracle is what licenses reading a null for other methods,
    so a reader who meets the counterproductive cells without meeting the ceiling's
    status at the same budget has been given the removability warrant from the 20%
    budget and the null from the 10% budget without being told they come from different
    cells. Do not weaken or drop the counterproductivity finding; carry its qualification
    with it.
  - State the two installed form effects as their recorded values and let the reader
    compare them. No ratio contrast is declared, so comparative magnitude language
    ('substantially larger', 'sharply divergent', 'an order of magnitude') asserts
    a quantity the evidence bundle does not carry. Where a qualitative word is unavoidable,
    use the frozen magnitude classification of the facts being compared rather than
    inventing a comparison between them.
  required_sections:
  - abstract
  - introduction
  - methods
  - results
  - discussion
  - limitations
  - conclusion
  contrasts:
  - id: ladder_evidence_long
