[project]
name = "belief-transfer"
version = "0.1.0"
description = "Measure whether supervised fine-tuning on a belief transfers to downstream action."
readme = "README.md"
authors = [
    { name = "sunnybak", email = "shikharbakhda@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface_hub==1.18.0",
    "jinja2>=3",
    "openai>=2",
    "pydantic>=2",
    "python-dotenv>=1",
    "pyyaml>=6",
    # torch/transformers/accelerate/trl/peft/datasets are exact-pinned to the same
    # combination validated on the reference branch's GPU box (RTX 4090 / CUDA 12.6
    # driver / compute cap 8.9 -- see pipeline/unify-drift-experiments's
    # code/requirements.txt) rather than loose lower bounds: AGENTS.md's
    # reproducibility principle favors a known-working combination over "whatever
    # latest resolves to" for the training/inference stack specifically. That file
    # also pins unsloth/unsloth-zoo/xformers/triton/bitsandbytes/torchvision, which
    # this repo doesn't need -- we use plain HF Transformers + PEFT LoRA (no Unsloth,
    # no 4-bit quantization; see schemas.SFTHyperparams.target_modules's docstring)
    # -- so torch is not capped below 2.11 the way it is there (that cap exists only
    # because unsloth==2026.7.2 hard-pins torch<2.11); we still pin to the exact
    # version that combination validated against rather than opening it up.
    "torch==2.10.0",
    "transformers==5.5.0",
    "accelerate==1.14.0",
    "trl==0.24.0",
    "peft==0.19.1",
    "datasets==4.3.0",
]

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
