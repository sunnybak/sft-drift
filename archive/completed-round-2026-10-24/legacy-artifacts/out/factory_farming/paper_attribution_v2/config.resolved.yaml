  related_work_tex: '\paragraph{Training-data attribution and its evaluation.}

    Influence-function and gradient-similarity methods estimate which training examples
    drive a

    model behaviour \citep{koh2017influence,pruthi2020tracin,grosse2023influence}.
    Their evaluation

    has largely relied on proxy ground truth. FTRACE scores attribution against entailment-labelled

    fact tracing and already reports BM25 beating TracIn \citep{akyurek2022ftrace};
    DATE-LM

    benchmarks attribution across applications, including retrain-based validation
    of top-ranked

    removal, and finds simple baselines competitive \citep{jiao2025datelm}; constructed-provenance

    testbeds inject fabricated articles while explicitly disclaiming causal claims

    \citep{li2025fakewiki}. The length confound our baseline embodies is likewise
    established:

    RelatIF diagnoses norm-dominated rankings \citep{barshan2020relatif}, LESS calls
    the issue well

    known and prescribes the cosine normalisation we also test \citep{xia2024less},
    TrackStar meets

    the same confound from the long-document end at pretraining scale \citep{chang2025trackstar},

    and influence-function-family methods are reported fragile on large models

    \citep{li2025influencework}. What this paper adds to that line is the \emph{kind}
    of ground

    truth: prior testbeds label sources with binary provenance, acquisition, or entailment,
    whereas

    here every source carries a separately measured causal effect size netted against
    a retrained

    control -- so a method is scored against how much a source moved the model, and
    a source that

    provably moved it by nothing is a planted trap rather than a positive. Two published
    positive

    results bound our negative one: full-trajectory counterfactual influence separates
    provenance

    where single-checkpoint scores struggle \citep{brazilek2026smalledits}, and TracIn''s
    original

    formulation sums over checkpoints along the trajectory \citep{pruthi2020tracin};
    what fails

    here is the single-checkpoint variant we test.


    \paragraph{Installing beliefs by fine-tuning.}

    Synthetic-document fine-tuning installs beliefs measurable by forced-choice probing

    \citep{wang2025sdf,slocum2025believe}, and declarative training statements move
    held-out

    generalization with netted, control-adjusted effect sizes \citep{meinke2023tell}.
    That surface

    form conditions what fine-tuning transmits is documented from several directions:

    question-answer formats beat article formats at controlled information density

    \citep{zhao2025style}, stance-explicit passages shift models where stance-withholding
    ones do

    not \citep{brazilek2026assert}, and stored facts can be unextractable without
    format

    augmentation \citep{allenzhu2024physics}. Our design differs in holding the premise

    specification literally fixed while varying document length and premise density
    factorially,

    with each cell''s causal effect measured against its own retrained control. The

    delta-predictability scorer we evaluate imports the perplexity-gap signal of

    \citet{abubaker2026leaky} as an attribution ranker.

    '
