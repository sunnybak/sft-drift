writeup:
  source_runs:
  - attrib_mix_v4
  - matrix_v1_step24
  - matrix_v1_step36
  - ms_arms
  - matrix_md_2ep
  - ms3p_arms
  - mld_arms
  - ms_sparse_arms
  primary_reading: attrib_mix_v4
  trajectory_run: null
  title: 'Installed Ground Truth for Training-Data Attribution: Surface Form Shapes
    Causal Potency and Single-Checkpoint TracIn Removal Backfires'
  authors: []
  intended_claim: We install per-source causal effects on model belief and measure
    each one against a retrained control, giving training-data attribution a ground
    truth that is a measured effect size rather than a proxy label. Three findings.
    First, content does not determine causal potency  - the same premise specification
    carries a 22x range of installed effect across surface forms, and a length x density
    factorial decomposes the gap. Second, the effect is removable and the design detects
    it - oracle removal at the twenty-percent budget recovers roughly half the installed
    effect in both seeds. Third, TracIn removal backfires - removing its top-ranked
    documents INCREASED the installed effect in both seeds, intervals excluding zero,
    a sign test that does not depend on any baseline comparison. The oracle itself
    overlaps the word-count baseline at the narrow budget, which is reported as a
    power diagnostic bounding what narrow-budget verdicts can show.
  contribution_goals:
  - USE EVERY CLAIM YOU PLAN. A registered claim that no paragraph carries is dropped
    from the paper and is reported as an error. Before finishing, check that each
    claim id appears in some paragraph's claim_ids, and that each REQUIRED QUALIFICATION
    on a claim is present in the prose of a paragraph carrying it. If a claim's qualifications
    are too many to thread into prose, do not plan the claim -- plan a narrower one
    you can actually state.
  - 'THE SPINE. Introduction and results present the findings in this order: (1) what
    determines an installed effect -- the length x premise-density 2x2, the paper''s
    most interesting result and its motivation in one move, because content alone
    demonstrably does not determine causal potency; (2) the installed effect is removable
    and the instrument detects it -- oracle removal at the twenty-percent budget,
    the positive control that licenses everything else; (3) TracIn points in the wrong
    direction -- the headline method result; (4) the non-separation analysis appears
    ONLY in the discussion, as a power diagnostic. Do not frame the paper as a null
    result, and do not open any section with the overlap criterion.'
  - 'ABSTRACT: ONE paragraph of exactly these five sentences, in this order, with
    only minimal connective adjustment. (1) ''Training-data attribution is typically
    validated against content-similarity proxies rather than causal effects known
    in advance.'' (2) ''We install per-source effects by fine-tuning, measure each
    against a retrained control, then remove each method''s top-ranked documents and
    retrain.'' (3) ''The same premise specification spans a 22x range of installed
    effect across surface forms (+0.1574 for short answers against +0.0072 for long
    articles at the two-epoch reading), and factorial corpus arms put the point-estimate
    ratios at 2.2x for length and 2.4x for premise density at the strong cells.''
    (4) ''In the cells evaluated, oracle removal at the twenty-percent budget recovered
    +0.52 and +0.62 of the installed effect, while at the ten-percent budget removal
    guided by the single-final-checkpoint TracIn implementation evaluated here increased
    the effect at both seeds (attributable fractions -0.91 and -0.42, intervals excluding
    zero).'' (5) ''The study is exploratory: one topic (factory farming), one model
    (Qwen3-4B), gradient-based removal methods, and paired training seeds for the
    declared seed-paired families.'' AN ABSTRACT MISSING SENTENCE (3) -- the surface-form
    finding -- IS WRONG.'
  - 'WRITE PLAINLY. Short active sentences. Claim first, bound second, move on. The
    pattern to eliminate is pre-emptive defense -- a sentence that answers an objection
    before making its claim. Every hedge appears exactly once in the whole paper,
    attached to the claim it bounds. No double negatives. No internal jargon (''homogeneous
    seed-paired contrast family'', ''instrument-specific''). Descriptive names throughout
    (''the long-article corpus'', ''the short-answer corpus'', ''the off-topic control'');
    run ids and file names live in the appendix provenance table, not in prose. Define
    on first use: installed effect, attributable fraction, removal budget.'
  - 'TRACIN IS A SIGN TEST AND THE HEADLINE METHOD RESULT. At the ten-percent budget
    TracIn''s attributable fraction is -0.91 (seed 42) and -0.42 (seed 7), both intervals
    excluding zero: removing its top-ranked documents increased the installed effect.
    Say plainly that this is a sign test against zero and does not depend on the overlap
    criterion. TracIn-cosine shows the same direction with an interval excluding zero
    at seed 42 only -- state plainly that this reading is single-seed. Delta-predictability
    flips sign across seeds with both intervals excluding zero -- report as unresolved,
    ONE sentence.'
  - 'THE ORACLE IS A POSITIVE CONTROL, NOT A CANDIDATE. At the twenty-percent budget
    it recovers +0.52 and +0.62 of the installed effect, intervals excluding zero
    at both seeds -- write this as the positive control: in those cells the installed
    effect is removable and the instrument detects removal; keep that cell-local scope
    in the abstract wording too. Its ten-percent cells straddle zero; that reading
    belongs to the power diagnostic in the discussion, not to the results narrative.
    Do not write that the oracle ''failed''.'
  - 'THE POWER DIAGNOSTIC: one paragraph, in the discussion, framed as the paper characterizing
    its own instrument. The oracle -- the best ranking available by construction --
    overlaps the word-count baseline AT THE NARROW BUDGET, in both seeds (the claim
    carrying this MUST cite the two narrow-budget oracle refs AND the two same-cell
    word-count baseline refs, and must NOT say ''all cells'' -- at the wider budget
    one oracle cell does not overlap, and the overlap table carries the full pattern),
    and the paragraph marks the interpretive step as interpretation, in this shape:
    ''we read this as limited resolving power of the overlap criterion at these interval
    widths, so a narrow-budget overlap verdict says little about method quality''
    -- a stated reading of the table, never a measured quantity. Do not count cells
    in prose (no ''three of four''); the table carries the verdicts. Do not escalate
    into a claim about the design''s overall diagnostic power, and do not re-narrate
    results the reader has already seen.'
  - 'THE NON-SEPARATION CRITERION is defined once, in methods, and named: a method
    fails to separate if its 95% interval overlaps the word-count baseline''s in the
    same budget-and-seed cell -- an overlap criterion, not a pairwise test. That caveat
    is stated there, ONCE, and never repeated. Elsewhere refer to the criterion by
    name. Overlap language only: ''overlapped''/''did not overlap'', never ''differed'',
    ''separated from'' (outside the named criterion), ''outperformed'' or ''beat''.'
  - 'PLAN EXACTLY THESE ASSETS: a factorial_table in results, an af_overlap_table
    in results, one af_figure in results, and one ladder_table in the APPENDIX whose
    caption describes it as the full contrast ledger (its caption must not describe
    the 2x2 -- the factorial_table carries that). The two main-text tables are the
    factorial_table and the af_overlap_table; the 34-row ladder in the main text is
    an error.'
  - THE 2x2 GETS ITS OWN RESULTS PARAGRAPH AND THE factorial_table ASSET. The four
    cells are separately estimated corpus arms; comparisons between them are point-estimate
    ratios, so write 'the short-dense cell's point estimate is 2.2x the long-dense
    cell's at matched density' and '2.4x the short-sparse cell's at matched length',
    never that shortening 'raised' anything as a tested effect. Measured from the
    weakest cell the single-factor ratios are larger (7.0x and 7.6x); state this as
    a descriptive pattern consistent with interaction between the factors -- no interaction
    test was computed, and that qualification belongs in the sentence carrying the
    ratios. Do NOT write 'only surface form differed' or that length and density cannot
    be separated -- the 2x2 separates them. The 22x figure is the ratio between the
    short-answer corpus (+0.1574) and the long-article corpus's two-epoch reading
    (+0.0072); the pair differs in voice as well, and the long endpoint rises at three
    epochs -- say both where the 22x is quoted and let the 2x2 carry the clean decomposition.
  - 'METHODS MUST CONTAIN THE METHOD, in plain prose, in this order. (a) Corpus construction:
    six source corpora about one topic sharing one premise specification, surface
    form varied by design; among them an off-topic control corpus and a source built
    to carry no causal effect. (b) Measurement: fine-tune on each corpus, read a forced-choice
    belief probe, and net the shift against a retrained matched off-topic control;
    the installed effect is that netted change in the probability of endorsing the
    probed claims -- the pool''s installed effect of +0.0167 (seed 42) and +0.0247
    (seed 7) is this quantity. (c) Removal protocol: score every pool document with
    each method, remove the top-ranked pairs at removal budgets of ten and twenty
    percent of pool pairs, retrain from the base model under the identical recipe,
    and compute the attributable fraction AF = 1 - dB_after/dB_before. Dose is matched
    on training pairs and epochs -- every arm retains the same row count and optimizer
    steps -- so removed word mass varies by method. (d) Training: the Qwen3-4B model;
    the removal arms are trained by full fine-tuning under one recipe identical across
    arms (do NOT state an epoch count or learning rate for the removal arms -- the
    frozen bundle does not carry their configurations, and do NOT give a rationale
    for the full fine-tuning choice: no mechanism claim about adapter capacity may
    appear). (e) Intervals: paired bootstrap over probe items, ten thousand draws,
    ninety-five percent intervals throughout (in words -- ''95%'' is a digit and fails
    validation in a non-empirical claim). (f) Per-method configuration, one clause
    per method, in methods: the oracle ranks by each source''s separately measured
    effect; TracIn as evaluated here scores gradient agreement at a single final checkpoint
    only (this disclosure lives HERE, not in limitations, and methods does not describe
    the original formulation -- related work and limitations carry that contrast);
    TracIn-cosine applies the prescribed length normalisation; delta-predictability
    ranks by the change in document loss between base and tuned model; the word-count
    baseline removes the shortest documents first. A methods section that omits this
    per-method sentence block is incomplete. IN NON-EMPIRICAL METHODS CLAIMS WRITE
    NUMBERS AS WORDS (ten percent, one epoch, ten thousand draws) -- EXCEPT model
    identifiers, which are written exactly as the configuration records them (Qwen3-4B),
    never spelled out. Digits appear only in empirical claims citing the contrast
    that carries them. Corpus-construction facts are stated as construction (''the
    pool was built from six source corpora, among them an off-topic control and a
    source constructed to carry no causal effect''), never as measured properties.
    The scope claim must not enumerate checkpoints or assert any checkpoint set is
    exhaustive -- the appendix provenance table carries checkpoints.'
  - 'THE SCOPE CLAIM asserts exactly this and no more: exploratory; one topic; one
    model, Qwen3-4B (cite the model context ref); gradient-based methods evaluated
    for removal; paired training seeds for the declared seed-paired families. It does
    not assert a seed or a checkpoint as a single value for the whole study -- seed-42
    configuration and seed-7 replication are separated wherever seeds are named, and
    result families keep their own checkpoint scopes in the provenance table.'
  - DO NOT ASSERT CHECKPOINT OR RUN IDENTIFIERS IN PROSE. Checkpoints, run ids, and
    file names live in the appendix provenance table; if the frozen context does not
    carry a checkpoint or seed for a reading, say nothing about it rather than naming
    one.
  - NEVER WRITE THE EXPERIMENT IDENTIFIER. The string with the underscore is a configuration
    id; in prose the topic is written as plain words (factory farming). Run ids, file
    names, and json paths likewise never appear in prose.
  - NAME THE SEEDS. Write 'seed 42' and 'seed 7' in sentences that cite seed-specific
    cells; never 'one training seed' or 'the paired seed'.
  - CUTS. No prose about absorption, mediation, or raw checkpoint figures. Never restate
    an interpretation rule as prose -- the sentence 'fixed tables are authoritative'
    and its variants must not appear. Do not plan an appendix-like body section or
    a one-sentence ledger stub; the appendix exists and the ladder table goes there.
    The descriptive-conclusions corpus gets AT MOST one sentence, as a dose-matched
    comparison point.
  - 'RETRIEVAL OUTLOOK: one paragraph, placed in RESULTS as its final paragraph (results
    is a reporting section and quotes values inline; the discussion author is instructed
    not to re-quote printed figures, which is why this paragraph cannot live there),
    quoting the recorded values with polarity named: the embedding retriever''s Spearman
    rank correlation with installed effect over the six sources is +0.8857 at the
    positive polarity and +0.9429 at the negative, against the length baseline''s
    +0.2571 at both. The paragraph OPENS with this sentence, verbatim: ''The embedding
    retriever''s Spearman rank correlation with the installed ordering was +0.8857
    at the positive polarity and +0.9429 at the negative, against the length baseline''s
    +0.2571 at both.'' The words ''more closely'', ''better'', ''outperform'' and
    every other comparative adverb are BANNED in this paragraph; the numbers carry
    the comparison. The same sentence block must say ranking fidelity was not tested
    as removal efficacy and that the intervals are bootstrap-over-documents rank-stability
    bands, quantized because a rank correlation over six items is discrete. Because
    of this leg, every removal claim in the paper is scoped to the gradient-based
    methods evaluated, and the scope sentences must say ''gradient-based''.'
  - 'LIMITATIONS: exactly five single-sentence items, one hedge each, no repetition
    of hedges stated elsewhere. (a) Excluding the alternative that perturbing the
    corpus at all moves a small quantity would require a dose-matched random-removal
    arm retrained under the same full fine-tuning procedure. (b) A formulation that
    sums gradient agreement along the training trajectory would be expected to score
    differently; comparing the two is outside this evaluation. (c) The attributable
    fraction divides by a small denominator -- a plausible but UNTESTED hypothesis
    that MAY contribute to the wide intervals and to sign changes across seeds; write
    it as exactly that (''may contribute''), never as an explanation that accounts
    for the pattern. (d) Two training seeds bound every replication claim, and two
    draws leave the source of the delta-predictability disagreement unresolved --
    do not call it noise. (e) The long-article cell''s installed effect rises severalfold
    between the two-epoch and three-epoch readings (cite the step-36 contrast), so
    in this cell the ESTIMATED gap is reading-step dependent -- phrase it cell-locally,
    exactly so, not as a property of the surface-form gap in general. Items (a) and
    (b) are what a stronger design would require, never assertions about what was
    or was not done. All five carry empirical=false except (e), which cites its contrasts.'
  - 'FIGURE CAPTION STATES THE TAKEAWAY. The attributable-fraction figure''s caption_outline
    must be a finished caption of this shape: ''Attributable fraction by method and
    removal budget, full fine-tuning, 95% intervals. TracIn and TracIn-cosine sit
    left of zero at the ten-percent budget; only the twenty-percent oracle separates
    from zero.'' Not an instruction checklist.'
  - 'NEVER WRITE A UNIVERSAL WHERE THE EVIDENCE IS A SET OF CELLS. Write ''in each
    declared budget-and-seed cell'' or name the cells, not ''every evaluated method''
    in general. The conclusion is EXACTLY ONE paragraph object -- emitting two paragraph
    objects for the conclusion is an error; join the surface-form sentence, the oracle
    sentence, and the TracIn sentence into that single paragraph and stop; the oracle''s
    twenty-percent estimates are consistent with removability in the declared cells,
    which is not a general causal removability conclusion, and its TracIn sentence
    is cell-local and carries the implementation scope IN THE SAME SENTENCE, in this
    shape: ''At the ten-percent budget, removal guided by the single-final-checkpoint
    TracIn implementation evaluated here increased the installed effect at both seeds
    in those cells.'' Its surface-form sentence is this, verbatim: ''In the factorial
    corpus arms evaluated, installed-effect point estimates ranged from +0.0072 in
    the long-sparse cell to +0.1190 in the short-dense cell -- a descriptive pattern
    across separately estimated corpus arms, not a tested main effect of either factor.''
    The words ''separately estimated'' and ''factorial corpus arms'' must survive
    into the rendered sentence.'
  - PRECISION FOLLOWS MAGNITUDE. Attributable fractions to two decimals (-0.91); pool
    installed effects to four (+0.0167, +0.0247) -- two decimals would erase a difference
    the paper depends on. Within any one table column, keep one convention.
  - 'NON-EMPIRICAL CLAIMS carry framing, corpus design, and scope-of-procedure statements:
    empirical=false, no evidence refs, NO DIGITS. The opening sentence about validation
    practice is of this kind; a hand-written related-work section with citations is
    injected after the introduction, so do not write one, and do not name papers,
    authors, years, or venues anywhere in the authored sections. The introduction
    states the earned novelty in one sentence: the ground truth here is an installed,
    separately measured causal effect size, not a proxy label.'
