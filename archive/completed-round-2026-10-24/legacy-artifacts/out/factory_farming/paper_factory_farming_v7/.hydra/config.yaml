writeup:
  source_runs:
  - matrix_v1_step24
  - matrix_v1
  - inference_v1_step24
  - matrix_md_2ep
  - inference_md_2ep
  - matrix_s7_2ep
  - matrix_md_s7_2ep
  - canon_inference_2ep
  - action_adjacency_2ep
  - action_pinned_2ep
  primary_reading: matrix_v1_step24
  trajectory_run: matrix_v1
  title: 'A Graded Ground-Truth Testbed for Training-Data Attribution: Absorption
    Without Contribution'
  authors: []
  intended_claim: 'We construct matched counterfactual SFT corpora whose intended
    causal contribution is specified in advance, and measure a graded ladder of actual
    contributions on one 4B model and one topic at two training seeds: corpora asserting
    evidence (premises) move neither normative belief (dB net +0.007/+0.008 across
    seeds) nor descriptive restatements of the same facts (dI net +0.012 at both seeds,
    roughly a fifth of the explicit arms'' shift), despite demonstrably absorbing
    their premises; corpora asserting the descriptive conclusion move belief (dB net
    +0.111/+0.131, T_B 0.17-0.20); corpora asserting the normative stance move belief
    most (dB net +0.311/+0.353). A corpus canonicalized so its premises are verbatim-repeated
    strings absorbs maximally and still contributes nothing measurable, so attribution
    signals keyed on loss, perplexity, or memorization would mis-rank these corpora
    against their measured effects -- stated here as a prediction, not a method evaluation.
    Scope limits are stated rather than resolved: absorption is an endpoint reading
    while belief and inference are two-epoch readings, each at the step where its
    instrument''s positive control is licensed; action-suite effects are instrument-conditional
    (trained-stance conduction appears on one item construction at ~0.02-0.09 and
    not on another, while prompted-belief sensitivity is stable at 0.35-0.44); and
    everything is one model and one topic.'
  references_bib: ''
  review: true
  compile_pdf: true
