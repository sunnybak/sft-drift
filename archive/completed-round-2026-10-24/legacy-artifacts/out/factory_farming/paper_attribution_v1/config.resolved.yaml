writeup:
  source_runs:
  - attrib_mix_v4
  - matrix_v1_step24
  - ms_arms
  - matrix_md_2ep
  - ms3p_arms
  - mld_arms
  - ms_sparse_arms
  primary_reading: attrib_mix_v4
  trajectory_run: null
  title: 'Installed Ground Truth for Training-Data Attribution: A Removal Test of
    Gradient-Based Scores'
  authors: []
  intended_claim: Attribution methods are validated against content-similarity proxies
    rather than against known causal effects. We install per-source effects, measure
    them, then test whether removing a method's top-ranked documents and retraining
    removes the effect. No gradient-based method separated from a word-count baseline
    under the pre-registered criterion, and TracIn was counterproductive; the oracle
    established removability at the wider budget but not at the narrow one, which
    bounds how much any narrow-budget null means.
  contribution_goals:
  - USE EVERY CLAIM YOU PLAN. A registered claim that no paragraph carries is dropped
    from the paper and is reported as an error. Before finishing, check that each
    claim id appears in some paragraph's claim_ids, and that each REQUIRED QUALIFICATION
    on a claim is present in the prose of a paragraph carrying it. If a claim's qualifications
    are too many to thread into prose, do not plan the claim -- plan a narrower one
    you can actually state.
  - 'ABSTRACT, in this order, six to eight plain declarative sentences, none longer
    than about 30 words, not opening with a stacked nominalisation. (1) Open with
    the logical gap rather than a claim about what other researchers do -- no artifact
    here can support an assertion about prior practice, and the auditor will reject
    one. Write something of this shape: ''Whether an attribution method identifies
    training data whose removal changes a model''s behaviour can only be checked against
    a causal effect that is known in advance.'' (2) We installed and measured per-source
    causal effects, then removed each method''s top-ranked documents and retrained.
    (3) An identical premise specification carries installed effects of +0.0167-scale
    magnitude in one surface form and a larger one in another -- give both recorded
    values. (4) Every evaluated method''s interval overlapped a word-count baseline''s
    under the pre-registered criterion, and TracIn removal was counterproductive at
    the narrow budget. (5) The oracle established removability at the wider budget.
    (6) Scope: one topic, the Qwen3 family, gradient-based methods, TWO TRAINING SEEDS,
    exploratory.'
  - 'DEFINE THE NON-SEPARATION CRITERION ONCE, in methods, and name it: a method fails
    if its 95% interval overlaps the word-count baseline''s in the same budget-and-seed
    cell; an overlap criterion, not a pairwise test. Elsewhere refer to it by name
    and DO NOT restate the definition or the caveat. State the scope limitation exactly
    twice: the abstract''s last sentence and limitations. Discussion must not re-narrate
    results -- it says what the results mean and what else could explain them. Conclusion
    is ONE paragraph that states the finding.'
  - 'WRITE PLAINLY. Short active sentences. No double negatives: ''every method''s
    interval overlapped the baseline''s'', never ''no method had an interval that
    did not overlap''. No internal jargon -- ''homogeneous seed-paired contrast family'',
    ''instrument-specific'', ''recorded final or checkpoint-specific readings'' mean
    nothing outside this repository. Use descriptive names throughout (''the long-article
    corpus'', ''the short-answer corpus'', ''the off-topic control''); run ids, checkpoints,
    file names and arm codes belong only in the appendix. Define on first use: installed
    effect, attributable fraction, dose-matched removal.'
  - 'OVERLAP LANGUAGE ONLY, and PRECISION FOLLOWS MAGNITUDE. The criterion compares
    intervals: write ''overlapped'' or ''did not overlap'', never ''differed from'',
    ''separated from'', ''outperformed'' or ''beat''. Quote attributable fractions
    to two decimals (-0.91) and pool effects to four (+0.0167, +0.0247) -- rounding
    those two to +0.02 each would erase a difference the paper depends on.'
  - 'REPORT THE POWER DIAGNOSTIC in results and discussion: the oracle, the best ranking
    available by construction, itself overlaps the word-count baseline in most budget-and-seed
    cells. The per-cell verdicts are computed by the overlap table -- cite it rather
    than asserting a count from the facts. Say what the qualification says: a null
    at the narrow budget carries little information about a method''s quality. Do
    not escalate that into a claim about the design''s overall diagnostic power.'
  - 'DECOMPOSE THE SURFACE-FORM CONTRAST as recorded values placed side by side, never
    as a directional effect: no paired contrast was computed between installed-effect
    cells, so do not write that shortening ''raised'' or density ''increased'' anything.
    Do NOT write ''only surface form differed'' -- length and premise density vary
    together across the pair, and saying both contradicts itself.'
  - 'NON-EMPIRICAL CLAIMS carry framing, corpus design, and scope-of-procedure statements:
    empirical=false, no evidence refs, NO NUMERALS. The paper''s motivating sentence
    about prior validation practice and the existence of a source built to carry no
    causal effect are both of this kind. Do not attach them to unrelated artifacts
    to satisfy a citation requirement.'
  - NO RELATED WORK SECTION. No bibliography is supplied, and a claim about what other
    work does cannot be supported by any artifact here. Do not name papers, authors,
    years or venues anywhere.
  - 'PLAN THE OVERLAP TABLE AS THE MAIN-TEXT TABLE and place it in results: the non-separation
    result is the paper''s central claim and it needs one artifact that states it.
    Put the full contrast ledger in the appendix. Do not place a per-arm suite summary
    in the main text -- its sensitivity and transfer rows play no part in this argument
    and orphan the table.'
  - STATE FIVE WEAKNESSES, once each, in limitations. Phrase (a) and (b) as what WOULD
    BE REQUIRED, never as assertions about what was or was not done -- an assertion
    about an experiment's absence is an empirical claim no artifact can support, whereas
    a statement of what a stronger design needs is a judgement the paper is entitled
    to make. (a) 'Excluding the alternative that perturbing the corpus at all moves
    a small quantity would require a dose-matched random-removal arm retrained under
    the same procedure.' (b) 'A formulation that sums gradient agreement along the
    training trajectory would be expected to score differently; comparing the two
    is outside this evaluation.' (c) The attributable fraction is a ratio with a small
    denominator, which plausibly widens intervals and contributes to sign changes
    across seeds. (d) The delta-predictability disagreement across seeds is what noise
    looks like at two draws. (e) The surface-form pair varies length and premise density
    together. All five carry empirical=false and no numerals.
  - 'NEVER WRITE A UNIVERSAL WHERE THE EVIDENCE IS A SET OF CELLS. Write ''in each
    declared budget-and-seed cell, the evaluated methods'' intervals overlapped the
    baseline''s'', not ''every evaluated method'' -- the second quantifies over methods
    in general and the evidence covers the cells declared here. Same for the conclusion:
    the oracle''s wider-budget point estimates are consistent with removability, which
    is not the same as having demonstrated it. And the abstract''s seed sentence must
    say the two-seed scope applies to the declared seed-paired families, not to every
    reading in the paper.'
  - DO NOT ASSERT CHECKPOINT OR RUN IDENTIFIERS IN PROSE. If the frozen context does
    not carry a checkpoint or seed for a reading, say nothing about it rather than
    naming one; those details live in the appendix ledger and its provenance line.
  - 'DO NOT COUNT CELLS IN PROSE. Do not write ''most'', ''three of four'', or any
    tally of overlapping cells: the per-cell verdicts are computed by the overlap
    table and belong there. In prose write that the oracle''s intervals overlap the
    baseline''s in cells shown in that table, including at the narrow budget, and
    draw the interpretive point from that. Likewise, DO NOT ENUMERATE CHECKPOINTS
    OR SEEDS in the scope sentence -- say the study is exploratory, one topic, one
    model family, gradient-based methods, and paired training seeds for the declared
    families, and stop there.'
  - 'SCOPE EVERY OVERLAP AND ATTRIBUTABLE-FRACTION SENTENCE TO WHAT IS DISPLAYED,
    and attach its qualification to the sentence carrying the numbers rather than
    to a neighbouring one. Three specific shapes. (i) Non-separation: ''for the methods
    and cells shown in the overlap table, each interval overlapped the word-count
    baseline''s in its own cell'' -- do not quantify over evaluated methods or declared
    cells in general. (ii) The power point in RESULTS must carry the same qualification
    the discussion carries: this concerns narrow-budget nulls specifically and does
    not assess the design''s overall diagnostic power. (iii) The oracle''s wider-budget
    numbers must be written as point estimates with intervals excluding zero in the
    declared cells, consistent with removability there -- the limitation attached
    to that very sentence, not the next one, and no general or causal removability
    conclusion drawn.'
