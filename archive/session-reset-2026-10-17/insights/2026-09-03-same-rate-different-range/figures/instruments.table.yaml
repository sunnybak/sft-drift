kind: table
caption: >-
  Every bank in this note, with where BASE sits on it and how far a prompted stance moves it.
  **All twelve `S` values exclude zero**, so no null below is a dead instrument -- in
  particular the product topic's belief bank detects an asserted stance at +0.5906, close to
  ethics' +0.6209, which is what makes its `ΔB` of -0.0160 a real null rather than a blind
  one. BASE positions differ enormously on the belief axis (0.0991 to 0.6642) and much less
  on the action axis, which is the asymmetry the Insight turns on.
columns: ["topic", "belief bank BASE / S_B", "hop 0 BASE / S_A", "hop 0.5 BASE / S_A", "hop 1 BASE / S_A"]
