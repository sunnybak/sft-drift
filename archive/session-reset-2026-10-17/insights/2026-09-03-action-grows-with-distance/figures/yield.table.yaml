caption: 'What the gate did to each rung: kept / candidates for the frozen bank, as recorded in each bank''s
  own `data/results/<exp>/hop<rung>_<topic>_suite/evalgen.yaml`. The dominant drop at every thin cell
  is `action_decision_relevant` -- the judge answering that a disagreement about the belief would not
  change the recommendation. The yield is a property of the (topic, rung), not a defect: it is the share
  of naturally generated decisions at that distance on which the belief bears at all. On the product topic
  at hop 1, 165 of 240 candidates fell to that one check.'
