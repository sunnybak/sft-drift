kind: table
caption: >-
  Netted action effect by topic and hop distance, mean over three seeds, beside the belief
  effect the same weights carry. `T_A` is the share of that bank's own prompted sensitivity
  `S_A` the trained arms reproduce; the three rungs are three different banks, so `T_A` and
  not `dA` is the cross-rung quantity. The two hop-0.5 `T_A` cells in brackets have a
  denominator whose interval spans more than 3x (`S_A` = +0.0857 and +0.0681) and are
  directions, not magnitudes. Monolith reads negative because its hop-1 bank's `S_A` is
  negative -- see the sign convention in the Margin.
columns: ["topic", "dB NET", "hop 0 dA", "hop 0.5 dA", "hop 1 dA", "T_A 0", "T_A 0.5", "T_A 1"]
rows:
  - ["**factory farming** (ethics)", {key: db_ff, format: plain}, {key: dA_ff_0_mean}, {key: dA_ff_05_mean}, {key: dA_ff_1_mean}, {key: ta_ff_0, format: plain, places: 2}, {key: ta_ff_05, format: plain, places: 2}, {key: ta_ff_1, format: plain, places: 2}]
  - ["**monolith** (software)", {key: db_mono, format: plain}, {key: dA_mono_0_mean}, {key: dA_mono_05_mean}, {key: dA_mono_1_mean}, {key: ta_mono_0, format: plain, places: 2}, "(0.73)", {key: ta_mono_1, format: plain, places: 2}]
  - ["**patagonia** (product)", {key: db_pata, format: plain}, {key: dA_pata_0_mean}, {key: dA_pata_05_mean}, {key: dA_pata_1_mean}, {key: ta_pata_0, format: plain, places: 2}, "(0.61)", {key: ta_pata_1, format: plain, places: 2}]
